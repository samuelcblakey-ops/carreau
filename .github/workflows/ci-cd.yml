# Every push and pull request runs the tests, split into parallel jobs so the result comes back sooner:
#   - app:   build the site + the app tests (4 at a time)
#   - web:   the website tests against the Firebase emulators, as three jobs side by side (each has its own emulators)
#   - test:  passes only when all of the above passed. This is the check that main's protection requires.
# The test jobs run in Playwright's own image, which already has Chromium and its system libraries, so they don't spend
# minutes in apt. Keep its version equal to playwright's in package.json.
# A push to main that passes the tests is deployed automatically:
#   - the website to GitHub Pages
#   - the Firestore security rules to Firebase (once the FIREBASE_SERVICE_ACCOUNT secret is set)
# To redeploy main without a new merge: Actions → CI/CD → Run workflow (branch main). It tests, then deploys.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same pull request cancels the run that's still testing the old one (main is never cancelled)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Python for the build
        run: command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-minimal; }
      - run: npm ci
      - run: npm run build
      - run: node tests/run.js app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-app
          path: test-results/

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6   # the Firebase emulators need Java
        with:
          distribution: temurin
          java-version: 21
      - name: Python for the build
        run: command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-minimal; }
      - uses: actions/cache@v6   # the Firestore emulator's download, which firebase-tools otherwise fetches every run
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-
      - run: npm ci
      - run: npm run build
      - run: npx firebase emulators:exec --only firestore,auth --project demo-carreau "node tests/run.js web --shard ${{ matrix.shard }}/3"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-web-${{ matrix.shard }}
          path: test-results/

  # the required check: green only when the build, the app tests and every web shard passed
  test:
    needs: [app, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "app: ${{ needs.app.result }} · web: ${{ needs.web.result }}"
          [ "${{ needs.app.result }}" = success ] && [ "${{ needs.web.result }}" = success ]

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url || steps.pages2.outputs.page_url || steps.pages3.outputs.page_url }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret not set, skipping the rules deploy (publish firestore.rules in the Firebase console by hand)."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only firestore:rules --project carreau-petanque --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: actions/configure-pages@v6
      # one artifact per attempt, so "Re-run failed jobs" works (deploy-pages refuses a run with two of the same name)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      # Pages can take more than deploy-pages' default 10 minutes; waiting for it keeps the production lock held until it's
      # really done. If Pages is still busy with an earlier deployment (one whose job gave up), it refuses this one, so wait
      # and try again.
      - id: pages
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1800000
      - if: steps.pages.outcome == 'failure'
        run: echo "Pages refused or failed the deployment; trying again in 5 minutes" && sleep 300
      - id: pages2
        if: steps.pages.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1800000
      - if: steps.pages2.outcome == 'failure'
        run: echo "Pages refused or failed the deployment again; last try in 5 minutes" && sleep 300
      - id: pages3
        if: steps.pages2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1800000
