<!doctype html>
<!-- The link-preview image for an event page (1200 × 630), in SN Pétanque's own style. tools/share-image.js renders it
     with Playwright: node tools/share-image.js worlds2026. The text comes from the address (?title=…&where=…&cta=…&flags=…).
     No federation or event logos and no mascots: they aren't ours to use. -->
<html lang="en"><head><meta charset="utf-8"><title>Share image</title>
<style>
@font-face{font-family:'Barlow';font-weight:500;src:url(../public/fonts/barlow-500-latin.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;src:url(../public/fonts/barlow-600-latin.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;src:url(../public/fonts/barlowcondensed-600-latin.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;src:url(../public/fonts/barlowcondensed-700-latin.woff2) format('woff2')}
html,body{margin:0}
.card{width:1200px;height:630px;box-sizing:border-box;position:relative;overflow:hidden;background:#1d6a54;color:#fff;font-family:'Barlow',sans-serif;
  padding:64px 72px 56px;display:flex;flex-direction:column}
/* a boule and the jack, large and faint, in the corner */
.boule{position:absolute;right:-90px;top:-70px;width:520px;height:520px;border-radius:50%;border:18px solid rgba(255,255,255,.09)}
.boule::before,.boule::after{content:"";position:absolute;left:8%;right:8%;height:46%;border:12px solid rgba(255,255,255,.07);border-radius:50%}
.boule::before{top:-22%}.boule::after{bottom:-22%}
.jack{position:absolute;right:420px;top:330px;width:64px;height:64px;border-radius:50%;background:#d48d0b;box-shadow:0 0 0 10px rgba(212,141,11,.18)}
.eyebrow{font-family:'Barlow Condensed';font-weight:600;font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:#bfe3d4}
h1{font-family:'Barlow Condensed';font-weight:700;font-size:104px;line-height:.95;margin:14px 0 0;letter-spacing:.01em;max-width:860px}
.where{font-size:38px;font-weight:500;margin-top:18px;color:#e3f2ec}
.flags{display:flex;gap:14px;margin-top:34px}
.flag{width:66px;height:44px;border-radius:5px;overflow:hidden;display:flex;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.flag.v{flex-direction:row}.flag.h{flex-direction:column}.flag span{flex:1}
.cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.pill{background:#d48d0b;color:#1a2320;font-family:'Barlow Condensed';font-weight:700;font-size:40px;padding:12px 30px;border-radius:14px;letter-spacing:.02em}
.brand{display:flex;align-items:center;gap:14px;font-family:'Barlow Condensed';font-weight:700;font-size:44px;letter-spacing:.02em}
.brand small{font-family:'Barlow';font-weight:600;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#bfe3d4;margin-left:4px}
</style></head>
<body><div class="card" id="card">
  <div class="boule"></div><div class="jack"></div>
  <div class="eyebrow" id="eyebrow">Live results</div>
  <h1 id="title"></h1>
  <div class="where" id="where"></div>
  <div class="flags" id="flags"></div>
  <div class="cta"><span class="pill" id="cta"></span>
    <span class="brand"><svg width="54" height="54" viewBox="0 0 26 26" aria-hidden="true"><circle cx="10" cy="14" r="8" fill="none" stroke="#fff" stroke-width="2"/><path d="M4.5 11.5c3.5 1.5 7.5 1.5 11 0M4.5 16.5c3.5-1.5 7.5-1.5 11 0" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="21" cy="6" r="3" fill="#d48d0b"/></svg>SN Pétanque<small>snpetanque.com</small></span></div>
</div>
<script>
// simple flag shapes (stripes only): v = vertical stripes, h = horizontal; colours top/left first
const FLAGS = {
  fr: ["v", "#0055a4", "#ffffff", "#ef4135"], it: ["v", "#009246", "#ffffff", "#ce2b37"], be: ["v", "#000000", "#fdda24", "#ef3340"],
  th: ["h", "#a51931", "#f4f5f8", "#2d2a4a", "#2d2a4a", "#f4f5f8", "#a51931"], es: ["h", "#aa151b", "#f1bf00", "#f1bf00", "#aa151b"],
  de: ["h", "#000000", "#dd0000", "#ffce00"], nl: ["h", "#ae1c28", "#ffffff", "#21468b"], ie: ["v", "#169b62", "#ffffff", "#ff883e"]
};
const q = new URLSearchParams(location.search);
document.getElementById("title").textContent = q.get("title") || "World Championships 2026";
document.getElementById("where").textContent = q.get("where") || "Khon Kaen · 21–24 November";
document.getElementById("cta").textContent = q.get("cta") || "Play Pick the Winner · free";
document.getElementById("flags").innerHTML = (q.get("flags") || "th,fr,it,es,be,de,nl").split(",").filter(c => FLAGS[c])
  .map(c => { const [d, ...cols] = FLAGS[c]; return `<span class="flag ${d}">${cols.map(x => `<span style="background:${x}"></span>`).join("")}</span>`; }).join("");
</script></body></html>
