<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Run petanque competitions live: draws, courts and scores for everyone.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Carreau Competition Desk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: compact app bar + tab strip, one working column; courts and brackets as grids that wrap or scroll in place. */
:root{
  --bg:#eceeea; --surface:#ffffff; --surface-2:#f5f6f3; --ink:#1a2320; --muted:#5d6a64; --line:#d3d9d5;
  --accent:#1d6a54; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --jack:#d48d0b; --jack-soft:#fbefd6; --danger:#b3261e; --danger-soft:#f8e0de; --wire:#b9c3be;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a211e; --surface-2:#202825; --ink:#e5ebe8; --muted:#97a49e; --line:#2d3833;
  --accent:#5fc19d; --accent-ink:#0b1511; --accent-soft:#1f3a30;
  --jack:#f0b443; --jack-soft:#3a2f17; --danger:#ef7a70; --danger-soft:#3d1f1d; --wire:#3e4b45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a211e; --surface-2:#202825; --ink:#e5ebe8; --muted:#97a49e; --line:#2d3833;
  --accent:#5fc19d; --accent-ink:#0b1511; --accent-soft:#1f3a30;
  --jack:#f0b443; --jack-soft:#3a2f17; --danger:#ef7a70; --danger-soft:#3d1f1d; --wire:#3e4b45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{flex:none}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.tsel select{max-width:260px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:26px}
h3{font-size:19px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.ghost{background:none;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f>span{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.seg{display:inline-flex;align-self:flex-start;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface-2);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.playing{background:var(--jack-soft);color:var(--jack)}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.ready{background:var(--surface-2);color:var(--ink);border:1px dashed var(--line)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.notice{padding:10px 14px;border-radius:8px;background:var(--jack-soft);color:var(--ink);font-size:14px}
.notice.example{background:var(--accent-soft)}
/* matches */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;cursor:pointer;min-width:0}
.match:hover{border-color:var(--muted)}
.match.ro{cursor:default}
.match.playing{border-color:var(--jack);box-shadow:inset 3px 0 0 var(--jack)}
.match .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.side{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.side .nm{min-width:0;overflow-wrap:anywhere;font-weight:500}
.side.win .nm{font-weight:700}
.side .sc{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.side.win .sc{color:var(--accent)}
.side.lose .sc{color:var(--muted)}
.court-tag{font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink);letter-spacing:.03em}
.tbd{color:var(--muted);font-style:italic}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:160px}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.rank{font-family:var(--display);font-weight:700;font-size:17px}
/* courts */
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.court{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.court .cn{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;display:flex;justify-content:space-between;align-items:center}
.court.free{background:var(--surface-2);border-style:dashed}
.court.off{opacity:.5}
/* bracket */
/* bracket: every round column is the same height and each match sits in an equal share of it,
   so a match always lines up halfway between the two games that feed it; wires are drawn with borders */
.bk-scroll{overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.bk{--gap:40px;display:grid;grid-auto-columns:minmax(200px,230px);grid-template-rows:auto 1fr;column-gap:var(--gap);width:max-content;min-width:100%}
.bk h4{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;grid-row:1}
.bk-col{grid-row:2;display:flex;flex-direction:column}
.bk-pair{flex:1;display:flex;flex-direction:column;position:relative}
.bk-slot{flex:1;display:flex;align-items:center;position:relative;padding-block:5px}
.bk-slot>*{width:100%}
.bk-col.out .bk-slot::after{content:"";position:absolute;right:calc(var(--gap) / -2);width:calc(var(--gap) / 2);top:50%;border-top:2px solid var(--wire)}
.bk-col.out .bk-pair::after{content:"";position:absolute;right:calc(var(--gap) / -2);top:25%;bottom:25%;border-right:2px solid var(--wire)}
.bk-col.in .bk-slot::before{content:"";position:absolute;left:calc(var(--gap) / -2);width:calc(var(--gap) / 2);top:50%;border-top:2px solid var(--wire)}
.bk-col.out .bk-slot.done::after{border-color:var(--accent)}
.bkm{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:left;padding:0;cursor:pointer;font-size:14px}
.bkm.ro{cursor:default}
button.bkm:hover{border-color:var(--muted)}
.bkm.playing{border-color:var(--jack);box-shadow:inset 3px 0 0 var(--jack)}
.bkm.bye{opacity:.6;background:var(--surface-2);border-style:dashed}
.bkm-row{display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:34px}
.bkm-row+.bkm-row{border-top:1px solid var(--line)}
.bkm-row .sd{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.6ch;text-align:right}
.bkm-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkm-row .sc{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.bkm-row.win .nm{font-weight:700}.bkm-row.win .sc{color:var(--accent)}
.bkm-row.lose .nm,.bkm-row.lose .sc{color:var(--muted)}
.bkm-row .tbd{font-size:13px}
.bkm-foot{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;background:var(--surface-2);color:var(--muted);border-top:1px solid var(--line)}
.bkm.playing .bkm-foot{background:var(--jack-soft);color:var(--jack)}
.bk-champ{border:2px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.bk-champ b{font-family:var(--display);font-size:22px;line-height:1.1;overflow-wrap:anywhere}
.bk-champ.tbc{border-style:dashed;border-color:var(--wire);background:none}
.bk-third{display:flex;justify-content:flex-end}
.bk-third>div{width:230px;max-width:100%}
.bk-third h4{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0}
/* pools */
.pools{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
/* entries */
.elist{display:flex;flex-direction:column}
.erow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.erow .num{font-family:var(--display);font-weight:700;color:var(--muted);width:2.5ch;text-align:right;font-variant-numeric:tabular-nums}
.erow .who{flex:1;min-width:0}
.erow .who b{display:block}
.erow.out{opacity:.5}
.erow.here .num{color:var(--accent)}
.btn.checked{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.reg-count{font-family:var(--display);font-size:22px}.reg-count b{font-size:30px}
.meter{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);transition:width .2s}
input[type=search]{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;color:var(--ink)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;max-width:520px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.scorer{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.scorer .who{min-width:0}
.scorer .who b{display:block;font-size:17px;overflow-wrap:anywhere}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer}
.stepper input{width:64px;text-align:center;font-family:var(--display);font-size:30px;font-weight:700;padding:4px}
.err{color:var(--danger);font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
/* display mode */
.disp{display:flex;flex-direction:column;gap:20px}
.disp .court .cn{font-size:40px}
.disp .court .side .nm{font-size:20px}
.disp .court .side .sc{font-size:34px}
.disp h2{font-size:38px}
@media (max-width:560px){h2{font-size:22px}.stepper button{width:40px;height:40px}}
@media (prefers-reduced-motion:no-preference){.match,.btn{transition:border-color .12s}}
</style>
</head>
<body>


<header class="app">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="10" cy="14" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 11.5c3.5 1.5 7.5 1.5 11 0M4.5 16.5c3.5-1.5 7.5-1.5 11 0" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="21" cy="6" r="3" fill="var(--jack)"/></svg>
        Carreau <small>Competition desk</small>
      </div>
      <div class="tsel" id="tsel"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Loading competitions…</div></main>
<div id="modal"></div>
<div id="toast" hidden class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, connectFirestoreEmulator, doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc, getDocs, query, where, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { firebaseConfig } from "./firebase-config.js";
(() => {
"use strict";
/* ---------------- utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const SIZE = { singles: 1, doubles: 2, triples: 3 };
const FORMAT_LABEL = { singles: "Singles (tête-à-tête)", doubles: "Doubles", triples: "Triples" };
const SYSTEM_LABEL = { swiss: "Swiss rounds", pools: "Pools → knockout", knockout: "Knockout", roundrobin: "Round robin", snake: "Snake", melee: "Mêlée rounds" };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

/* ---------------- French translation ----------------
   Keys are the English text as it appears on screen. {n} matches a number and {x} any text
   (a team name, say); in the French, {1}, {2}… refer to those matches in order. */
const FR_TEXT = {
  // header, tabs, general

  "Competition": "Concours", "Sections": "Sections", "This device only": "Cet appareil uniquement", "Saved in this browser only": "Enregistré dans ce navigateur uniquement",
  "Registration": "Inscriptions", "Setup": "Paramètres", "Draw & results": "Tirage et résultats", "Pistes": "Pistes", "Standings": "Classement", "Big screen": "Grand écran",

  // formats & systems

  "Fixed teams": "Équipes formées", "Mêlée (random teams)": "Mêlée (équipes tirées au sort)", "Mêlée": "Mêlée", "Mêlée rounds": "Parties en mêlée",
  "Swiss": "Suisse", "Swiss rounds": "Système suisse", "Snake": "Serpent", "Snake rounds": "Parties en serpent", "Pools → KO": "Poules → tableau", "Pools → knockout": "Poules → tableau",
  "Knockout": "Élimination directe", "Round robin": "Tous contre tous", "Round robin schedule": "Calendrier tous contre tous", "Pools": "Poules",

  "Competition name": "Nom du concours", "Date": "Date", "Venue": "Lieu", "Club or boulodrome": "Club ou boulodrome",
  "Format locked after the first draw": "Format verrouillé après le premier tirage", "Entries": "Engagés", "Entry type": "Type d'inscription", "Format": "Format",
  "Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.": "Les joueurs s'inscrivent individuellement. À chaque partie, de nouvelles équipes sont tirées au sort, en mélangeant doublettes et triplettes si le nombre ne tombe pas juste, en évitant si possible les mêmes partenaires. Le classement est individuel.",
  "Points to win": "Points pour gagner", "Bye counts as": "L'exempt compte pour", "Competition system": "Système de jeu",
  "Mêlée competitions play a set number of rounds.": "Les concours en mêlée se jouent sur un nombre de parties fixé.",

  if (ae && $("#main").contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type !== "checkbox") { S.pendingRender = true; return; }
  S.pendingRender = false;
  renderHeader();
  const t = T(); const main = $("#main");
  if (!S.loaded) { localize($("header.app")); return; }
  if (!t) { main.innerHTML = renderWelcome(); localize($("header.app")); localize(main); return; }
  const fn = { setup: renderSetup, entries: renderEntries, draw: renderDraw, courts: renderCourts, standings: renderStandings, display: renderDisplay }[S.tab] || renderDraw;
  main.innerHTML = (t.example ? `<div class="notice example" style="margin-bottom:16px">This is an example competition with made-up teams, so you can see how everything works. Create your own from the menu above, then delete this one in Setup.</div>` : "") + fn(t);
  localize($("header.app")); localize(main);
}
function renderHeader() {
  const list = Object.values(S.tournaments).sort((a, b) => (b.created || 0) - (a.created || 0));
  $("#tsel").innerHTML = `${list.length ? `<select id="tpick" aria-label="Competition">${list.map(t => `<option value="${t.id}" ${t.id === S.tid ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select>` : ""}
    <div class="seg" role="group" aria-label="Language" data-notr><button type="button" data-lang="en" aria-pressed="${I18N.lang === "en"}">EN</button><button type="button" data-lang="fr" aria-pressed="${I18N.lang === "fr"}">FR</button></div>
    ${S.canCreate() ? `<button class="btn sm" data-act="new-t">+ New competition</button>` : ""}${S.headerExtra ? S.headerExtra() : ""}
    ${S.store.mode === "local" && S.loaded ? `<span class="pill" title="Saved in this browser only">This device only</span>` : ""}`;
  const t = T();
  if (t && !canScore() && S.tab !== "draw") S.tab = "draw"; // players and spectators see the draw and results only
  $("#tabs").innerHTML = t ? TABS.filter(([k]) => canEdit() || (canScore() ? k !== "setup" : k === "draw")).map(([k, l]) => `<button data-tab="${k}" aria-current="${S.tab === k}">${l}</button>`).join("") : "";
}
function renderWelcome() {
  return `<div class="panel stack" style="max-width:640px">
    <h2>No competitions yet</h2>
    <p class="muted">Set up a competition, add teams or players, then draw rounds, pools or a knockout. Pistes are allocated as games finish and scores go live for everyone with the link.</p>
    ${S.canCreate() ? `<div><button class="btn primary" data-act="new-t">Create a competition</button></div>` : S.welcomeExtra ? S.welcomeExtra() : `<p class="muted">The organiser hasn't created a competition yet.</p>`}
  </div>`;
}
function newTournament() {
  const id = "t" + uid();
  return { id, name: "New competition", date: new Date().toISOString().slice(0, 10), venue: "", entry: "teams", format: "triples", system: "swiss",
    checkin: true, target: 13, byeScore: [13, 7], swissRounds: 5, poolSize: 4, poolStyle: "french", qualify: 2, bBracket: true, consolante: false, seeding: "random", randomCourts: false,
    courts: Array.from({ length: 8 }, (_, i) => ({ id: "c" + (i + 1), name: String(i + 1), active: true })),
    teams: [], players: [], draws: [], pools: [], brackets: [], created: Date.now() };
}

/* setup */
function seg(name, cur, opts, locked) { return `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" data-set="${name}" data-val="${v}" aria-pressed="${String(cur) === String(v)}" ${locked ? "disabled" : ""}>${l}</button>`).join("")}</div>`; }
function renderSetup(t) {
  const locked = t.draws.length > 0;
  const sys = isMelee(t) ? "melee" : t.system;
  return `<div class="stack">
  <div class="spread"><h2>Setup</h2>${locked ? `<span class="pill">Format locked after the first draw</span>` : ""}</div>
  ${S.setupExtra ? S.setupExtra(t) : ""}
  <div class="panel stack">
    <div class="fields">
      <label class="f"><span>Competition name</span><input type="text" id="f-name" data-field="name" value="${esc(t.name)}"></label>
      <label class="f"><span>Date</span><input type="date" id="f-date" data-field="date" value="${esc(t.date)}"></label>
      <label class="f"><span>Venue</span><input type="text" id="f-venue" data-field="venue" value="${esc(t.venue)}" placeholder="Club or boulodrome"></label>
    </div>
  </div>
  <div class="grid2">
    <div class="panel stack">
      <h3>Entries</h3>
      <div class="stack" style="gap:8px"><div class="eyebrow">Entry type</div>${seg("entry", t.entry, [["teams", "Fixed teams"], ["melee", "Mêlée (random teams)"]], locked)}</div>
      <div class="stack" style="gap:8px"><div class="eyebrow">Format</div>${seg("format", t.format, [["singles", "Singles"], ["doubles", "Doubles"], ["triples", "Triples"]], locked)}</div>
      ${isMelee(t) ? `<p class="small muted">Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.</p>` : ""}
      <div class="fields">
        <label class="f"><span>Points to win</span><input type="number" min="1" max="21" id="f-target" data-field="target" data-num value="${t.target}"></label>
        <label class="f"><span>Bye counts as</span><div class="row" style="flex-wrap:nowrap"><input type="number" min="0" id="f-bye0" data-field="byeScore.0" data-num value="${t.byeScore[0]}"><span>–</span><input type="number" min="0" id="f-bye1" data-field="byeScore.1" data-num value="${t.byeScore[1]}"></div></label>
      </div>
    </div>
    <div class="panel stack">
      <h3>Competition system</h3>
      ${isMelee(t) ? `<p class="muted">Mêlée competitions play a set number of rounds.</p>` :
      seg("system", t.system, [["swiss", "Swiss"], ["snake", "Snake"], ["pools", "Pools → KO"], ["knockout", "Knockout"], ["roundrobin", "Round robin"]], locked)}
      ${sys === "snake" ? `<label class="f"><span>Rounds</span><input type="number" min="1" max="15" id="f-snrounds" data-field="snakeRounds" data-num value="${t.snakeRounds || 5}" ${locked ? "disabled" : ""}></label>
        <p class="small muted">Teams stand in two lines. Each round one line moves along a place, so team 2 plays whoever team 1 just played, team 3 whoever team 2 just played, and so on. All rounds are drawn at once and nobody meets the same team twice${activeIds(t).length ? ` (${activeIds(t).length} teams allow up to ${snakeMaxRounds(activeIds(t).length)} rounds)` : ""}. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, Buchholz, fine Buchholz, points difference.</p>` : ""}
      ${sys === "swiss" || sys === "melee" ? `<label class="f"><span>Planned rounds</span><input type="number" min="1" max="15" id="f-rounds" data-field="swissRounds" data-num value="${t.swissRounds}"></label>
        <p class="small muted">${sys === "swiss" ? "Round 1 is random. After that, teams on the same number of wins play each other and rematches are avoided. Ties are split by Buchholz (opponents' wins), then points difference." : "Rounds are drawn one at a time once the previous round is finished."}</p>` : ""}
      ${sys === "pools" ? `<div class="fields">
          <label class="f"><span>Pool size</span><input type="number" min="3" max="8" id="f-psize" data-field="poolSize" data-num value="${t.poolSize}" ${locked ? "disabled" : ""}></label>
        </div>
        <div class="stack" style="gap:8px"><div class="eyebrow">Pool games</div>${seg("poolStyle", t.poolStyle, [["french", "French poule (2 wins qualify)"], ["rr", "Round robin"]], locked)}</div>
        <p class="small muted">French poules need 4 teams: game 1 is drawn, then winners play winners and losers play losers, and a barrage decides second place. Pools of other sizes play round robin.</p>` : ""}
      ${sys === "knockout" ? `<label class="chk"><input type="checkbox" data-check="consolante" ${t.consolante ? "checked" : ""}> First-round losers play a consolante</label><label class="chk"><input type="checkbox" data-check="koThird" ${t.koThird ? "checked" : ""} ${locked ? "disabled" : ""}> Third-place play-off</label>` : ""}
      ${sys !== "melee" ? `<div class="stack" style="gap:8px"><div class="eyebrow">Seeding</div>${seg("seeding", t.seeding, [["random", "Random draw"], ["entry", "Entry order is seeding"]], locked)}</div>` : ""}
    </div>
  </div>
  ${PLAN_SYSTEMS.includes(sys) ? `<div class="panel stack">
    <div><h3>Afternoon knockouts</h3><p class="small muted">What happens after the ${sys === "pools" ? "pools" : sys === "swiss" ? "Swiss rounds" : sys === "snake" ? "snake rounds" : "round robin"}. You can change this any time before the knockouts are drawn.</p></div>
    ${renderPlanEditor(t, { locked: (t.brackets || []).length > 0 })}
  </div>` : ""}
  <div class="panel stack">
    <div class="spread"><h3>Pistes</h3><label class="f" style="flex-direction:row;align-items:center;gap:8px"><span>Number of pistes</span><input type="number" min="1" max="200" id="f-courts" data-courts value="${t.courts.length}" style="width:90px"></label></div>
    <p class="small muted">Rename a piste to match the markings on your terrain, or switch it off if it's unusable. Free pistes are given to waiting games as soon as a result comes in.</p>
    <div class="courts" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))">
      ${t.courts.map((c, i) => `<div class="row" style="flex-wrap:nowrap;gap:6px"><input type="text" id="cn-${c.id}" data-court-name="${i}" value="${esc(c.name)}" aria-label="Piste name" style="width:70px"><label class="chk small"><input type="checkbox" data-court-on="${i}" ${c.active !== false ? "checked" : ""}> In use</label></div>`).join("")}
    </div>
    <label class="chk"><input type="checkbox" data-check="randomCourts" ${t.randomCourts ? "checked" : ""}> Allocate pistes at random (otherwise lowest free piste first)</label>
  </div>
  ${S.canDelete && !S.canDelete(t) ? "" : `<div class="panel spread">
    <div><h3>Delete competition</h3><p class="small muted">Removes the competition, its entries and every result.</p></div>
    ${S.confirmDelete ? `<div class="row"><span class="err">Delete “${esc(t.name)}” for everyone?</span><button class="btn danger" data-act="del-t-yes">Delete</button><button class="btn" data-act="del-t-no">Keep it</button></div>` : `<button class="btn danger" data-act="del-t">Delete…</button>`}
  </div>`}
  </div>`;
}

/* entries */
function renderEntries(t) {
  const melee = isMelee(t); const size = SIZE[t.format]; const noun = melee ? "players" : "teams";
  const list = entities(t);
  const entered = list.filter(e => e.active !== false);
  const here = entered.filter(e => e.checkedIn);
  const drawn = t.draws.length > 0;
  const rolling = ["swiss", "melee"].includes(melee ? "melee" : t.system); // later rounds pick up late arrivals
  const pct = entered.length ? Math.round(100 * here.length / entered.length) : 0;
  const q = (S.regFilter || "").toLowerCase();
  const match = e => !q || [entName(t, e.id), ...(e.players || []), e.club || "", e.name || ""].join(" ").toLowerCase().includes(q);
  return `<div class="stack">
    <div class="spread"><h2>Registration</h2><span class="muted small">${FORMAT_LABEL[t.format]} · ${melee ? "Mêlée" : SYSTEM_LABEL[t.system]}</span></div>
    <div class="panel stack">
      ${t.checkin ? `<div class="spread"><div><div class="eyebrow">Checked in on the day</div><div class="reg-count"><b>${here.length}</b> of ${entered.length} ${noun}</div></div>
        ${canEdit() && !drawn ? `<div class="row"><button class="btn sm" data-act="checkin-all">Check in everyone</button>${here.length ? `<button class="btn sm ghost" data-act="checkin-clear">Clear check-ins</button>` : ""}</div>` : ""}</div>
        <div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
        <p class="small muted">Only checked-in ${noun} go into the draw, so the format and the number of games are worked out from who has actually turned up. ${entered.length - here.length ? `<b>${entered.length - here.length} not checked in yet.</b>` : ""}</p>`
      : `<div class="spread"><div><div class="eyebrow">Entries</div><div class="reg-count"><b>${entered.length}</b> ${noun}</div></div></div><p class="small muted">Check-in is off, so every entered ${melee ? "player" : "team"} goes into the draw.</p>`}
      ${canEdit() ? `<label class="chk"><input type="checkbox" data-check="checkin" ${t.checkin ? "checked" : ""}> Teams must check in on the day before they're included in the draw</label>` : ""}
    </div>
    ${drawn ? `<div class="notice">${rolling && t.checkin ? `The draw has started. Anyone checked in now joins from the next round.` : rolling ? `The draw has started. New entries join from the next round.` : `The draw has been made, so new entries and check-ins won't be included. Withdrawn ${noun} stay in the draw already made.`}</div>` : ""}
    ${canEdit() ? `<div class="grid2">
      <form class="panel stack" id="add-form">
        <h3>Add ${melee ? "a player" : "a team"}</h3>
        ${melee ? `<label class="f"><span>Player name</span><input type="text" id="np-name" required></label>` :
        `<label class="f"><span>Team name (optional)</span><input type="text" id="nt-name" placeholder="Defaults to the players' names"></label>
         <div class="fields">${Array.from({ length: size }, (_, i) => `<label class="f"><span>Player ${i + 1}</span><input type="text" id="nt-p${i}"></label>`).join("")}</div>
         <label class="f"><span>Club</span><input type="text" id="nt-club"></label>`}
        ${t.checkin ? `<label class="chk"><input type="checkbox" id="add-here"> Here now (check in straight away)</label>` : ""}
        <div><button class="btn primary" type="submit">Add</button></div>
      </form>
      <form class="panel stack" id="bulk-form">
        <h3>Paste a list</h3>
        <p class="small muted">${melee ? "One player per line." : `One team per line. Use <code>Team name: Player, Player</code> or just the players' names separated by commas.`}</p>
        <textarea id="bulk" placeholder="${melee ? "Marie Dubois&#10;Tom Hart" : "Les Pointeurs: Marie Dubois, Tom Hart, Ana Silva&#10;Jo Bell, Raj Patel, Lee Chen"}"></textarea>
        <div><button class="btn" type="submit">Add all</button></div>
      </form>
    </div>` : ""}
    <div class="panel stack" style="gap:8px">
      <div class="spread"><h3>${melee ? "Players" : "Teams"}</h3>${list.length > 6 ? `<input type="search" id="reg-search" placeholder="Find a ${melee ? "player" : "team or player"}" value="${esc(S.regFilter || "")}" style="max-width:260px" aria-label="Search entries">` : ""}</div>
      ${list.length ? `<div class="elist">${list.map((e, i) => `<div class="erow ${e.active === false ? "out" : ""} ${t.checkin && e.checkedIn && e.active !== false ? "here" : ""}" data-row="${e.id}" ${match(e) ? "" : "hidden"} data-text="${esc([entName(t, e.id), ...(e.players || []), e.club || ""].join(" ").toLowerCase())}">
        <span class="num">${i + 1}</span>
        <div class="who">${melee ? `<b>${esc(e.name)}</b>` : `<b>${esc(entName(t, e.id))}</b><span class="small muted">${esc((e.players || []).filter(Boolean).join(", "))}${e.club ? " · " + esc(e.club) : ""}</span>`}</div>
        ${e.active === false ? `<span class="pill">Withdrawn</span>` : t.checkin ? (canEdit() ? `<button class="btn sm ${e.checkedIn ? "checked" : ""}" data-act="checkin" data-id="${e.id}" aria-pressed="${!!e.checkedIn}">${e.checkedIn ? "✓ Checked in" : "Check in"}</button>` : e.checkedIn ? `<span class="pill done">Checked in</span>` : `<span class="pill">Not here yet</span>`) : ""}
        ${canEdit() ? `<div class="row">
          ${t.seeding === "entry" && !drawn ? `<button class="btn sm ghost" data-act="up" data-id="${e.id}" aria-label="Move up" ${i === 0 ? "disabled" : ""}>↑</button>` : ""}
          <button class="btn sm ghost" data-act="toggle-e" data-id="${e.id}">${e.active === false ? "Reinstate" : "Withdraw"}</button>
          ${!usedInDraw(e.id) ? `<button class="btn sm ghost danger" data-act="del-e" data-id="${e.id}" aria-label="Remove">Remove</button>` : ""}
        </div>` : ""}
      </div>`).join("")}</div>` : `<div class="empty">No ${noun} yet. Add them above or paste a list.</div>`}
    </div>
  </div>`;
}
const usedInDraw = id => MS().some(m => ents(m).includes(id));

/* match card */
function matchCard(t, m, opts = {}) {
  const st = mStatus(m); const ro = !canScore() || st === "pending";
  const side = (s, sc, win) => `<div class="side ${m.done && m.b ? (win ? "win" : "lose") : ""}"><span class="nm">${s ? esc(sideName(t, s)) : `<span class="tbd">${m.stage === "ko" ? "Winner to come" : "To be decided"}</span>`}</span><span class="sc">${m.done || (sc !== null && sc !== undefined && st === "playing") ? (sc ?? "") : ""}</span></div>`;
  if (m.bye) return `<div class="match ro"><div class="meta"><span>${opts.ctx ? esc(matchContext(t, m)) : ""}</span><span class="pill">Bye</span></div>${side(m.a, m.sa, true)}<div class="small muted">Bye scored ${m.sa}–${m.sb}</div></div>`;
  const aw = m.done && m.sa > m.sb;
  const label = st === "playing" ? `<span class="court-tag">Piste ${esc(courtName(t, m.court))}</span>` : st === "done" ? (m.courtUsed ? `<span>Piste ${esc(courtName(t, m.courtUsed))}</span>` : "<span></span>") : st === "ready" ? `<span>Waiting for piste</span>` : `<span></span>`;
  const pill = { playing: `<span class="pill playing"><span class="dot"></span>Playing</span>`, done: `<span class="pill done">Finished</span>`, ready: `<span class="pill ready">Ready</span>`, pending: `<span class="pill">Pending</span>` }[st];
  return `<${ro ? "div" : "button"} class="match ${st} ${ro ? "ro" : ""}" ${ro ? "" : `data-match="${m.id}" type="button"`}>
    <div class="meta">${opts.ctx ? `<span>${esc(matchContext(t, m))}</span>` : label}${pill}</div>
    ${side(m.a, m.sa, aw)}${side(m.b, m.sb, m.done && !aw)}
    ${opts.ctx && st === "playing" ? `<div class="meta">${label}</div>` : ""}
  </${ro ? "div" : "button"}>`;
}

/* draw */
function renderDraw(t) {
  const ms = MS(); const n = activeIds(t).length;
  const sys = isMelee(t) ? "melee" : t.system;
  const wr = canEdit();
  const minNeeded = sys === "melee" ? SIZE[t.format] * 2 : 2;
  if (!t.draws.length) {
    return `<div class="stack"><h2>Draw & results</h2><div class="panel stack">
      <p>${n} ${isMelee(t) ? "players" : "teams"} ${t.checkin ? "checked in" : "entered"} · ${SYSTEM_LABEL[sys]} · ${t.courts.filter(c => c.active !== false).length} pistes</p>
      ${t.checkin && enteredIds(t).length > n ? `<div class="notice">${enteredIds(t).length - n} entered ${isMelee(t) ? "player" : "team"}${enteredIds(t).length - n === 1 ? " hasn't" : "s haven't"} checked in and won't be in the draw. <button class="btn sm ghost" data-tab="entries">Go to Registration</button></div>` : ""}
      ${n < minNeeded ? `<p class="muted">${t.checkin ? "Check in" : "Add"} at least ${minNeeded} ${isMelee(t) ? "players" : "teams"} on Registration before drawing.</p>` :
      wr ? `<div><button class="btn primary" data-act="first-draw">${{ swiss: "Draw round 1", melee: "Draw round 1", roundrobin: "Generate round robin schedule", snake: "Draw snake rounds", pools: "Draw pools", knockout: "Draw knockout bracket" }[sys]}</button></div>` : `<p class="muted">Waiting for the organiser to make the draw.</p>`}
    </div></div>`;
  }
  let html = `<div class="stack"><div class="spread"><h2>Draw & results</h2><div class="row">${canScore() ? `<button class="btn sm" data-act="assign">Fill free pistes</button>` : ""}${wr && S.downloads ? `<button class="btn sm" data-act="export">Export results (CSV)</button>` : ""}</div></div>`;
  // rounds (swiss / melee)
  const rounds = t.draws.filter(d => d.kind === "round").sort((a, b) => b.round - a.round);
  if (rounds.length) {
    const last = rounds[0]; const lastMs = ms.filter(m => m.group === last.id);
    const lastDone = lastMs.every(m => m.done);
    const finalsExist = (t.brackets || []).length > 0;
    html += `<div class="panel spread"><div><div class="eyebrow">${SYSTEM_LABEL[sys]}</div><b>Round ${last.round} of ${t.swissRounds} planned</b>${lastDone && last.round >= t.swissRounds && sys === "swiss" ? ` · <span style="color:var(--accent);font-weight:600">Morning complete</span>` : ""} · ${lastMs.filter(m => m.done).length}/${lastMs.length} games finished</div>
      ${wr && !finalsExist ? `<div class="row">${lastDone ? `<button class="btn primary" data-act="next-round">Draw round ${last.round + 1}</button>` : ""}
        ${!lastMs.some(m => m.done && !m.bye) ? `<button class="btn danger sm" data-act="undo" data-id="${last.id}">Undo round ${last.round}</button>` : ""}</div>` : ""}</div>`;
  }
  // afternoon knockout planner
  if (PLAN_SYSTEMS.includes(sys) && !(t.brackets || []).length && wr) {
    const ready = morningDone(t, ms);
    html += `<div class="panel stack" ${ready ? `style="border-color:var(--accent)"` : ""}>
      <div class="spread"><div><div class="eyebrow">Afternoon</div><h3>Knockouts</h3></div>
        ${ready ? `<button class="btn primary" data-act="start-kos">Draw the knockouts</button>` : `<span class="pill">${sys === "swiss" ? "Draw once the last round is finished" : "Draw once every game is finished"}</span>`}</div>
      ${ready && sys === "swiss" && rounds.length && rounds[0].round < t.swissRounds ? `<div class="notice">Only ${rounds[0].round} of ${t.swissRounds} planned rounds have been played. You can still draw the knockouts now, or play another round first.</div>` : ""}
      ${renderPlanEditor(t, { compact: true })}
    </div>`;
  }
  // brackets first if present (most recent stage)
  (t.brackets || []).forEach(b => html += renderBracket(t, b, ms));
  if (rounds.length) rounds.forEach(d => { const rm = ms.filter(m => m.group === d.id).sort(byOrder); html += `<section class="stack" style="gap:10px"><h3>${esc(d.label)}</h3><div class="mlist">${rm.map(m => matchCard(t, m)).join("")}</div></section>`; });
  // round robin and snake (whole schedule drawn at once)
  for (const [gid, label] of [["RR", "Round robin"], ["SN", "Snake"]]) if (t.draws.some(d => d.id === gid)) {
    const rr = ms.filter(m => m.group === gid); if (!rr.length) continue; const maxR = Math.max(...rr.map(m => m.round));
    html += `<div class="panel spread"><div><div class="eyebrow">${label}</div><b>${rr.filter(m => m.done).length}/${rr.length} games finished</b> · ${maxR} rounds</div>
      ${wr ? `<div class="row">${!rr.some(m => m.done && !m.bye) ? `<button class="btn danger sm" data-act="undo" data-id="${gid}">Undo schedule</button>` : ""}</div>` : ""}</div>`;
    for (let r = 1; r <= maxR; r++) { const rm = rr.filter(m => m.round === r).sort(byOrder); html += `<section class="stack" style="gap:10px"><h3>Round ${r}</h3><div class="mlist">${rm.map(m => matchCard(t, m)).join("")}</div></section>`; }
  }
  // pools
  if ((t.pools || []).length) {
    const ranks = t.pools.map(p => poolRanking(t, p, ms));
    const allDone = ranks.every(r => r.complete);
    const koStarted = (t.brackets || []).some(b => b.id === "A");

    while (t.courts.length < n) { const i = t.courts.length + 1; let id = "c" + i; while (t.courts.some(c => c.id === id)) id = "c" + uid(); t.courts.push({ id, name: String(i), active: true }); }
    const inUse = new Set(MS().filter(m => !m.done && m.court).map(m => m.court));
    while (t.courts.length > n && !inUse.has(t.courts[t.courts.length - 1].id)) t.courts.pop();
    if (t.courts.length > n) toast("Some pistes have games on them, so they weren't removed.");
  } else if (el.dataset.courtName !== undefined) t.courts[+el.dataset.courtName].name = el.value.trim() || String(+el.dataset.courtName + 1);
  else if (el.dataset.courtOn !== undefined) t.courts[+el.dataset.courtOn].active = el.checked;
  else if (el.dataset.list !== undefined) t[el.dataset.list] = el.value.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(x => x.includes("@"));
  else return;
  await guard(() => saveT(t));
  if (el.dataset.courtOn !== undefined || el.dataset.courts !== undefined) await guard(assignCourts);
});
document.addEventListener("input", e => {
  if (e.target.id !== "reg-search") return;
  S.regFilter = e.target.value; const q = S.regFilter.toLowerCase();
  document.querySelectorAll("[data-row]").forEach(r => r.hidden = !!q && !r.dataset.text.includes(q));
});
document.addEventListener("focusout", () => setTimeout(() => { if (S.pendingRender) render(); }, 0));
document.addEventListener("submit", async e => {
  e.preventDefault(); const t = clone(T()); if (!t) return;
  if (e.target.id === "add-form") {
    const hereNow = !!$("#add-here")?.checked; const ci = hereNow ? { checkedIn: true, checkedInAt: Date.now() } : {};
    if (isMelee(t)) { const nm = $("#np-name").value.trim(); if (!nm) return; t.players.push(Object.assign({ id: "p" + uid(), name: nm, active: true }, ci)); }
    else {
      const ps = Array.from({ length: SIZE[t.format] }, (_, i) => $("#nt-p" + i).value.trim());
      const name = $("#nt-name").value.trim(); if (!name && !ps.some(Boolean)) { toast("Enter a team name or at least one player."); return; }
      t.teams.push(Object.assign({ id: "e" + uid(), name, players: ps, club: $("#nt-club").value.trim(), active: true }, ci));
    }
    e.target.reset(); if ($("#add-here")) $("#add-here").checked = hereNow; document.activeElement?.blur();
    await guard(() => saveT(t)); e.target.querySelector("input")?.focus?.();
  }
  if (e.target.id === "bulk-form") {
    const lines = $("#bulk").value.split(/\n/).map(s => s.trim()).filter(Boolean); if (!lines.length) return;
    lines.forEach(l => {
      if (isMelee(t)) t.players.push({ id: "p" + uid(), name: l, active: true });
      else { let name = "", rest = l; const ci = l.indexOf(":"); if (ci > -1) { name = l.slice(0, ci).trim(); rest = l.slice(ci + 1); }
        const ps = rest.split(/[,;\/]/).map(s => s.trim()).filter(Boolean); t.teams.push({ id: "e" + uid(), name, players: ps, club: "", active: true }); }
    });
    $("#bulk").value = ""; document.activeElement?.blur();
    await guard(() => saveT(t)); toast(`${lines.length} added.`);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.modal) { S.modal = null; renderModal(); } });

async function exportCsv() {
  const t = T(); const rows = [["Stage", "Round", "Piste", isMelee(t) ? "Side A" : "Team A", "Score A", "Score B", isMelee(t) ? "Side B" : "Team B", "Status"]];
  MS().sort(byOrder).forEach(m => rows.push([matchContext(t, m), m.round, m.courtUsed || m.court ? courtName(t, m.courtUsed || m.court) : "", sideName(t, m.a) || "", m.sa ?? "", m.sb ?? "", m.bye ? "BYE" : sideName(t, m.b) || "", mStatus(m)]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  try { await S.downloads.save({ filename: `${t.name.replace(/[^\w\- ]+/g, "").trim() || "results"}.csv`, data: csv }); } catch (err) { if (err?.code !== "cancelled") toast("The file wasn't saved."); }
}

/* ---------------- boot ---------------- */
function watchMatches() {
  S.unsubM?.(); S.unsubM = null;
  if (!S.tid) return;
  const tid = S.tid;
  S.unsubM = S.store.watchMatches(tid, list => { if (S.tid !== tid) return; S.matches = {}; list.forEach(m => S.matches[m.id] = m); render(); }, err => console.error(err));
}
function startWatching() {
  S.store.watchTournaments(list => {
    S.tournaments = {}; list.forEach(t => S.tournaments[t.id] = t);
    S.loaded = true;
    if (!S.tid || !S.tournaments[S.tid]) { const first = list.sort((a, b) => (b.created || 0) - (a.created || 0))[0]; const changed = S.tid !== (first?.id || null); S.tid = first?.id || null; if (changed) { S.matches = {}; watchMatches(); } }
    if (T() && !canEdit() && (S.tab === "setup" || S.tab === "entries")) S.tab = canScore() ? "courts" : "draw";
    S.onTournaments?.();
    render();
  }, err => console.error(err));
  watchMatches();
}
/* ---------------- web build: Firebase storage, no-login access with share codes ---------------- */
// Beta access model: every device signs in anonymously (no account, nothing to type).
// The device that creates a competition owns it. Owners hand out two private codes:
//   organiser code -> full control, scorer code -> scores and pistes only.
// Helpers open a link containing the code (or type it in) and their device is remembered as a member.
const ADMIN_EMAILS = ["samuelcblakey@gmail.com"]; // site admins (enforced in firestore.rules too)
const isAdmin = () => !!(AUTH.user && !AUTH.user.isAnonymous && ADMIN_EMAILS.includes((AUTH.user.email || "").toLowerCase()));
const CONFIGURED = firebaseConfig && firebaseConfig.apiKey && !String(firebaseConfig.apiKey).startsWith("PASTE");
const AUTH = { user: null, ready: false };
const ROLE = {};   // tid -> "edit" | "score" (membership of this device)
const CODES = {};  // tid -> { edit, score } (only readable by organisers)
let FB = null, unsubRole = null, unsubCodes = null;
const JOINED_KEY = "carreau-joined";
const joined = () => { try { return JSON.parse(lsGet(JOINED_KEY) || "[]"); } catch { return []; } };
const remember = tid => { const j = joined(); if (!j.includes(tid)) { j.push(tid); lsSet(JOINED_KEY, JSON.stringify(j.slice(-50))); } };
const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newCode = () => { const a = new Uint32Array(8); crypto.getRandomValues(a); return [...a].map(x => ALPHA[x % ALPHA.length]).join(""); };

function fbStore() {
  const { db } = FB;
  let unsubs = [];
  return {
    mode: "firebase",
    watchTournaments(cb, onErr) {
      unsubs.forEach(u => u()); unsubs = [];
      const parts = {}; const expected = new Set();
      const emit = () => {
        if ([...expected].some(k => !(k in parts))) return; // wait until every source has answered once
        const m = {}; Object.values(parts).forEach(list => list.forEach(t => m[t.id] = t)); cb(Object.values(m));
      };
      const subQ = (key, q) => { expected.add(key); unsubs.push(onSnapshot(q, s => { parts[key] = s.docs.map(d => d.data()); emit(); }, e => { console.error(e); parts[key] = []; emit(); onErr?.(e); })); };
      const subD = (key, tid) => { expected.add(key); unsubs.push(onSnapshot(doc(db, "tournaments", tid), d => { parts[key] = d.exists() ? [d.data()] : []; emit(); }, () => { parts[key] = []; emit(); })); };
      const tc = collection(db, "tournaments");
      subQ("listed", query(tc, where("listed", "==", true), limit(100)));
      if (AUTH.user) subQ("mine", query(tc, where("ownerUid", "==", AUTH.user.uid), limit(200)));
      if (isAdmin()) subQ("all", query(tc, limit(300)));
      new Set([...joined(), S.tid].filter(Boolean)).forEach(tid => subD("t:" + tid, tid));
      return () => { unsubs.forEach(u => u()); unsubs = []; };
    },
    watchMatches(tid, cb, onErr) { return onSnapshot(collection(db, "tournaments", tid, "matches"), s => cb(s.docs.map(d => d.data())), onErr); },
    async setTournament(t) {
      const isNew = !!t._new; const body = clone(t); delete body._new;
      await setDoc(doc(db, "tournaments", t.id), body);
      if (isNew) { // first save of a new competition: create its private codes
        delete t._new; if (S.tournaments[t.id]) delete S.tournaments[t.id]._new;
        const codes = { edit: newCode(), score: newCode() };
        await setDoc(doc(db, "tournaments", t.id, "private", "codes"), codes); CODES[t.id] = codes; render();
      }
    },
    async deleteTournament(tid) {
      const s = await getDocs(collection(db, "tournaments", tid, "matches"));
      for (const d of s.docs) await deleteDoc(d.ref);
      try { await deleteDoc(doc(db, "tournaments", tid, "private", "codes")); } catch {}
      await deleteDoc(doc(db, "tournaments", tid));
    },
    setMatch(tid, m) { return setDoc(doc(db, "tournaments", tid, "matches", m.id), clone(m)); },
    updateMatch(tid, id, patch) { return updateDoc(doc(db, "tournaments", tid, "matches", id), clone(patch)); },
    deleteMatch(tid, id) { return deleteDoc(doc(db, "tournaments", tid, "matches", id)); }
  };
}

const isOwner = t => !!(AUTH.user && t && t.ownerUid === AUTH.user.uid);
S.permFn = t => {
  if (!AUTH.user || !t) return { edit: false, score: false };
  const r = isOwner(t) || isAdmin() ? "edit" : ROLE[t.id];
  return { edit: r === "edit", score: r === "edit" || r === "score" };
};
S.canCreate = () => !!AUTH.user;
S.canDelete = t => isOwner(t) || isAdmin();
S.decorateNew = nt => { nt.ownerUid = AUTH.user.uid; nt.listed = false; nt._new = true; remember(nt.id); };

const base = () => `${location.origin}${location.pathname}`;
const links = t => ({ watch: `${base()}#${t.id}`, edit: CODES[t.id] ? `${base()}#${t.id}.${CODES[t.id].edit}` : "", score: CODES[t.id] ? `${base()}#${t.id}.${CODES[t.id].score}` : "" });
S.headerExtra = () => {
  const t = T(); if (!CONFIGURED || !t) return "";
  const p = S.permFn(t);
  if (isAdmin()) return `<span class="pill done">Admin</span>`;
  if (isOwner(t)) return `<span class="pill done">Organiser</span>`;
  if (p.edit) return `<span class="pill done">Organiser</span>`;
  if (p.score) return `<span class="pill done">Scorer</span>`;
  return `<button class="btn sm ghost" data-act="enter-code">Organiser code</button>`;
};
S.welcomeExtra = () => `<p class="muted">Following a competition? Open the link the organiser sent you.</p>`;
const copyRow = (id, label, value, note) => `<div class="stack" style="gap:6px"><div class="eyebrow">${label}</div>
  <div class="row" style="flex-wrap:nowrap"><input type="text" id="${id}" readonly value="${esc(value)}" aria-label="${label}"><button class="btn" data-act="copy" data-target="${id}">Copy</button></div>
  <p class="small muted">${note}</p></div>`;
S.setupExtra = t => {
  if (!CONFIGURED) return "";
  const l = links(t);
  return `<div class="panel stack">
    <h3>Sharing</h3>
    ${copyRow("share-watch", "Link for players and spectators", l.watch, "Anyone with this link can follow the draw and results live. They can't change anything.")}
    ${l.edit ? `${copyRow("share-edit", "Organiser link", l.edit, `Gives full control, including registration, setup, draws and scores. Keep it to your organising team, and keep a copy for yourself in case you change device. Organiser code: <b>${esc(CODES[t.id].edit)}</b>`)}` : `<p class="small muted">Loading the private codes…</p>`}
    <label class="chk"><input type="checkbox" data-check="listed" ${t.listed ? "checked" : ""}> Show this competition on the site's front page</label>
  </div>`;
};
S.extraAction = async (act, a) => {
  if (act === "copy") { const el = document.getElementById(a.dataset.target); try { await navigator.clipboard.writeText(el.value); toast("Copied."); } catch { el.select(); } }
  if (act === "enter-code") openCodeBox();
  if (act === "admin-in") { try { await signInWithPopup(FB.auth, new GoogleAuthProvider()); } catch (e) { if (e?.code !== "auth/popup-closed-by-user" && e?.code !== "auth/cancelled-popup-request") toast("Sign-in didn't complete. Allow pop-ups for this site and try again."); return; }
    if (!isAdmin()) { toast("That Google account isn't an admin for this site."); await signOut(FB.auth); } else toast("Signed in as admin."); }
  if (act === "admin-out") { await signOut(FB.auth); toast("Signed out."); }
  if (act === "code-close") closeCodeBox();
  if (act === "code-submit") { const v = document.getElementById("code-input").value; if (await joinWithCode(S.tid, v)) closeCodeBox(); }
};
function openCodeBox() {
  document.getElementById("modal").innerHTML = `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="Enter a code">
    <div class="spread"><h3>Enter a code</h3><button type="button" class="btn ghost" data-act="code-close" aria-label="Close">✕</button></div>
    <p class="muted">Organisers get a code from the person running the competition.</p>
    <input type="text" id="code-input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. K7RM2QXP" style="font-size:22px;letter-spacing:.12em;text-transform:uppercase">
    <div><button class="btn primary" type="button" data-act="code-submit">Join</button></div>
  </div></div>`;
  localize(document.getElementById("modal"));
  document.getElementById("code-input").focus();
}
function closeCodeBox() { document.getElementById("modal").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "code-input") { e.preventDefault(); document.querySelector('[data-act="code-submit"]')?.click(); } });

async function joinWithCode(tid, raw) {
  const code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!code || !tid || !AUTH.user) return false;
  const ref = doc(FB.db, "tournaments", tid, "members", AUTH.user.uid);
  for (const role of ["edit", "score"]) {
    try {
      await setDoc(ref, { role, code, joinedAt: Date.now() });
      ROLE[tid] = role; remember(tid); restart(); render();
      toast(role === "edit" ? "You're now an organiser for this competition." : "You can now enter scores for this competition.");
      return true;
    } catch (e) { /* not this role: try the next */ }
  }
  toast("That code didn't work. Check it with the organiser.");
  return false;
}

function watchRole() {
  unsubRole?.(); unsubRole = null; unsubCodes?.(); unsubCodes = null;
  if (!FB || !AUTH.user || !S.tid) return;
  const tid = S.tid;
  unsubRole = onSnapshot(doc(FB.db, "tournaments", tid, "members", AUTH.user.uid),
    d => { ROLE[tid] = d.exists() ? d.data().role : undefined; if (d.exists()) remember(tid); render(); watchCodes(tid); },
    () => { ROLE[tid] = undefined; render(); watchCodes(tid); });
}
function watchCodes(tid) {
  if (unsubCodes || tid !== S.tid) return;
  const t = S.tournaments[tid];
  if (!(isOwner(t) || isAdmin() || ROLE[tid] === "edit")) return;
  unsubCodes = onSnapshot(doc(FB.db, "tournaments", tid, "private", "codes"), d => { if (d.exists()) { CODES[tid] = d.data(); render(); } }, () => {});
}
function restart() { if (!FB) return; startWatching(); watchRole(); renderFooter(); }
function renderFooter() {
  let f = document.getElementById("site-foot");
  if (!f) { document.body.insertAdjacentHTML("beforeend", `<footer id="site-foot" class="wrap" style="padding-block:8px 28px;display:flex;justify-content:flex-end;gap:8px;align-items:center" class="small"></footer>`); f = document.getElementById("site-foot"); }
  f.innerHTML = isAdmin()
    ? `<span class="small muted">Admin: ${esc(AUTH.user.email)}</span><button class="btn sm ghost" data-act="admin-out">Sign out</button>`
    : `<button class="btn sm ghost" data-act="admin-in">Admin sign in</button>`;
  localize(f);
}
S.onSelect = () => { history.replaceState(null, "", S.tid ? "#" + S.tid : location.pathname); restart(); };
S.onTournaments = () => { if (S.tid) watchCodes(S.tid); };

// links look like #<competition id> or #<competition id>.<code>
function readHash() { const [tid, code] = location.hash.slice(1).split("."); return { tid: tid || null, code: code || null }; }
async function handleHash() {
  const { tid, code } = readHash(); if (!tid) return;
  if (tid !== S.tid) { S.tid = tid; S.matches = {}; restart(); }
  if (code && AUTH.user) { history.replaceState(null, "", "#" + tid); await joinWithCode(tid, code); }
}
window.addEventListener("hashchange", handleHash);

S.downloads = { async save({ filename, data }) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/csv" })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); } };

function boot() {
  const h = readHash(); if (h.tid) S.tid = h.tid;
  if (!CONFIGURED) { startWatching(); setTimeout(() => toast("Firebase isn't set up yet, so this is saving on this device only."), 600); return; }
  const app = initializeApp(firebaseConfig);
  FB = { db: getFirestore(app), auth: getAuth(app) };
  if (window.__CARREAU_EMULATOR) { // local testing only
    connectFirestoreEmulator(FB.db, "127.0.0.1", 8080); connectAuthEmulator(FB.auth, "http://127.0.0.1:9099", { disableWarnings: true });
    window.__testGoogle = (email) => signInWithCredential(FB.auth, GoogleAuthProvider.credential(JSON.stringify({ sub: email, email, email_verified: true })));
  }
  S.store = fbStore();
  onAuthStateChanged(FB.auth, async u => {
    if (!u) { try { await signInAnonymously(FB.auth); } catch (e) { console.error(e); toast("Couldn't connect. Check your internet connection and reload."); } return; }
    AUTH.user = u; AUTH.ready = true; restart(); render();
    await handleHash();
  });
}
render();
boot();

// expose internals for testing in local mode only
if (!window.claude || window.__testHook) window.__carreau = { S, genSnake, render, startWatching, watchMatches, toast, esc, clone, startKnockouts, savePlan, getPlan, drawSwissRound, drawMeleeRound, genRoundRobin, drawPools, createBracket, recordResult, addDraw, MS, T };
})();
