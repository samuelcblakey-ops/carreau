rs (lone boule, boule behind the jack, boule between two boules, boule behind an obstacle, the jack), each shot from 6, 7, 8 and 9 m. Every shot scores 0, 1, 3 or 5, so a scorecard is out of 100.":"Os atiradores inscrevem-se individualmente. Tiro de precisão segundo as regras da FIPJP: 5 ateliers (bola isolada, bola atrás do bolim, bola entre duas bolas, bola atrás de um obstáculo, o bolim), cada tiro a 6, 7, 8 e 9 m. Cada tiro vale 0, 1, 3 ou 5, por isso uma ficha vale até 100.","Qualifying → top 8 knockout":"Qualificação → eliminatórias dos 8","Qualifying → top 16 knockout":"Qualificação → eliminatórias dos 16","Qualifying → final":"Qualificação → final","Shooters in the final":"Atiradores na final","Everyone shoots a qualifying scorecard. The top shooters then shoot a final scorecard, and the highest final score wins.":"Todos atiram uma ficha de qualificação. Os melhores atiram depois uma ficha final e vence o maior total na final.","Everyone shoots a qualifying scorecard. The top {n} go into a knockout (1st v {n}th, and so on). Each knockout game is a duel: both shooters shoot a full scorecard and the higher total goes through.":"Todos atiram uma ficha de qualificação. Os {1} primeiros entram nas eliminatórias (1.º contra {2}.º, etc.). Cada jogo é um duelo: os dois atiradores atiram uma ficha completa e passa o maior total.","Third-place duel":"Duelo do 3.º lugar","Shooting order":"Ordem de tiro","Entry order":"Ordem de inscrição","Archive competition":"Arquivar torneio","Archived":"Arquivado","Archive…":"Arquivar…","Archive":"Arquivar","Restore":"Restaurar","Competition restored.":"Torneio restaurado.","Only the site admin can see this competition. Restore it to make it visible again.":"Só o administrador do site pode ver este torneio. Restaure-o para voltar a ficar visível.","Once the competition has finished, archive it to hide it from everyone except the site admin.":"Quando o torneio terminar, arquive-o para o ocultar de todos exceto do administrador do site.","Once the competition has finished, archive it to hide it from everyone except the site admin. Some games aren't finished yet.":"Quando o torneio terminar, arquive-o para o ocultar de todos exceto do administrador do site. Alguns jogos ainda não terminaram.","Archive “{x}”? Only the admin will be able to see it.":"Arquivar “{1}”? Só o administrador o poderá ver.","Competition archived. Only the admin can see it now.":"Torneio arquivado. Agora só o administrador o pode ver.","Competition archived. Only the site admin can see it now.":"Torneio arquivado. Agora só o administrador do site o pode ver.","Archived. Only the site admin can see this competition.":"Arquivado. Só o administrador do site pode ver este torneio.","{x} (archived)":"{1} (arquivado)","This correction changes who went through.":"Esta correção altera quem passou.","These later games were already played and will be reset so they can be replayed or re-entered:":"Estes jogos seguintes já foram jogados e serão reiniciados para serem rejogados ou reintroduzidos:","Override and reset these games":"Forçar e reiniciar estes jogos","Cancel":"Cancelar","Ask the organiser to make this correction.":"Peça ao organizador para fazer esta correção.","Result corrected and later games reset.":"Resultado corrigido e jogos seguintes reiniciados.","Corrected":"Corrigido","Corrected (was {n}–{n}).":"Corrigido (era {1}–{2}).","To correct a wrong score, change it and press Update result. If the winner changes and a later game has already been played, you'll be asked to confirm an override.":"Para corrigir um resultado errado, altere-o e prima Atualizar resultado. Se o vencedor mudar e um jogo seguinte já tiver sido jogado, terá de confirmar que quer forçar.","To correct a wrong score, change it and press Update result. If the winner changes and a later game has already been played, you'll be asked to confirm an override (only possible for the current and previous round).":"Para corrigir um resultado errado, altere-o e prima Atualizar resultado. Se o vencedor mudar e um jogo seguinte já tiver sido jogado, terá de confirmar que quer forçar (só possível na ronda atual e na anterior).","Only the current and previous round can be corrected.":"Só a ronda atual e a anterior podem ser corrigidas.","This result has already moved two rounds on, so it can't be corrected here.":"Este resultado já avançou duas rondas, por isso não pode ser corrigido aqui.","Fit":"Ajustar","Zoom in":"Aproximar","Zoom out":"Afastar","Open testing":"Teste aberto","Admin back end":"Administração","Back to competitions":"Voltar aos torneios","Open testing is on: everyone who opens a competition can run it, including registration, setup, draws and scores. Spectator and organiser links are switched off while it's on.":"O teste aberto está ligado: quem abrir um torneio pode geri-lo, incluindo inscrições, configuração, sorteios e resultados. Os links de espectador e organizador ficam desligados enquanto estiver ativo.","Link to this competition":"Link para este torneio","Anyone with this link can run this competition while open testing is on.":"Quem tiver este link pode gerir este torneio enquanto o teste aberto estiver ligado.","Everyone can run every competition (beta testing). Spectator and organiser links are switched off.":"Todos podem gerir todos os torneios (teste beta). Os links de espectador e organizador ficam desligados.","Off: spectators see the draw, results, standings and big screen; organisers use their organiser link or code.":"Desligado: os espectadores veem o sorteio, resultados, classificação e ecrã grande; os organizadores usam o seu link ou código de organizador.","Turn open testing off":"Desligar o teste aberto","Turn open testing on":"Ligar o teste aberto","Open testing is on.":"Teste aberto ligado.","Open testing is off.":"Teste aberto desligado.","Sign in with the admin Google account to change site settings.":"Inicie sessão com a conta Google de admin para alterar as definições do site.","Sign in with Google":"Iniciar sessão com Google","Signed in as {x}":"Sessão iniciada como {1}","Competitions":"Torneios","Test mode":"Modo de teste","That setting didn't save.":"Essa definição não foi guardada.","Admin":"Admin","Admin sign in":"Entrada de admin","Sign out":"Terminar sessão","Signed out.":"Sessão terminada.","Signed in as admin.":"Sessão iniciada como admin.","Admin: {x}":"Admin: {1}","That Google account isn't an admin for this site.":"Essa conta Google não é admin deste site.","Sign-in didn't complete. Allow pop-ups for this site and try again.":"O início de sessão não terminou. Permita pop-ups para este site e tente novamente.","That code didn't work. Check it with the organiser.":"Esse código não funcionou. Confirme-o com o organizador.","You're now an organiser for this competition.":"Agora é organizador deste torneio.","You can now enter scores for this competition.":"Agora pode introduzir resultados neste torneio.","Couldn't connect. Check your internet connection and reload.":"Sem ligação. Verifique a ligação à internet e recarregue.","Firebase isn't set up yet, so this is saving on this device only.":"O Firebase ainda não está configurado, por isso os dados ficam só neste dispositivo.","Scorers open this once on their phone and can then enter scores and move games between pistes. Scorer code":"Os marcadores abrem isto uma vez no telemóvel e depois podem introduzir resultados e mover jogos entre pistas. Código de marcador","Gives full control, including registration, setup, draws and scores. Keep it to your organising team, and keep a copy for yourself in case you change device. Organiser code":"Dá controlo total, incluindo inscrições, configuração, sorteios e resultados. Partilhe só com a equipa organizadora e guarde uma cópia caso mude de dispositivo. Código de organizador","Last {n}":"Ronda dos {1}","Last 16":"Oitavos de final","Last 32":"Dezasseis-avos de final","Last 64":"Trinta-e-dois-avos de final"},

tition name":"ชื่อการแข่งขัน","Date":"วันที่","Venue":"สถานที่","Club or boulodrome":"สโมสรหรือสนามเปตอง","Format locked after the first draw":"ล็อกรูปแบบหลังจับสลากครั้งแรก","Entries":"ผู้สมัคร","Entry type":"ประเภทการสมัคร","Format":"รูปแบบ","Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.":"ผู้เล่นสมัครแบบเดี่ยว ทุกรอบจะสุ่มทีมใหม่ โดยผสมทีม 2 คนและทีม 3 คนเมื่อจำนวนหารไม่ลงตัว และพยายามไม่ให้คู่ซ้ำ จัดอันดับเป็นรายบุคคล","Points to win":"แต้มที่ต้องได้เพื่อชนะ","Bye counts as":"บายนับเป็น","Competition system":"ระบบการแข่งขัน","Mêlée competitions play a set number of rounds.":"การแข่งขัน Mêlée เล่นตามจำนวนรอบที่กำหนด","Planned rounds":"จำนวนรอบที่วางไว้","Rounds":"รอบ","Round {n} is random. After that, teams on the same number of wins play each other and rematches are avoided. Ties are split by points difference, then Buchholz (opponents' wins).":"รอบ {1} เป็นการสุ่ม หลังจากนั้นทีมที่ชนะเท่ากันจะพบกันโดยไม่ซ้ำคู่เดิม หากเสมอตัดสินด้วยผลต่างแต้ม แล้วตามด้วย Buchholz (จำนวนชนะของคู่แข่ง)","Rounds are drawn one at a time once the previous round is finished.":"จับสลากทีละรอบเมื่อรอบก่อนหน้าจบแล้ว","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice ({n} teams allow up to {n} rounds). With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"ทีมยืนเป็นสองแถว ทุกรอบแถวหนึ่งจะขยับไปหนึ่งตำแหน่ง ทีม {1} จึงพบกับคู่ที่ทีม {2} เพิ่งเจอ ทีม {3} พบกับคู่ที่ทีม {4} เพิ่งเจอ ไปเรื่อยๆ จับสลากทุกรอบพร้อมกันและไม่มีใครเจอทีมเดิมซ้ำ ({5} ทีมเล่นได้สูงสุด {6} รอบ) ถ้าจำนวนทีมเป็นเลขคี่ แต่ละรอบจะมีหนึ่งทีมได้บาย จัดอันดับแบบระบบสวิส: ชนะ ผลต่างแต้ม Buchholz และ Fine Buchholz","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"ทีมยืนเป็นสองแถว ทุกรอบแถวหนึ่งจะขยับไปหนึ่งตำแหน่ง ทีม {1} จึงพบกับคู่ที่ทีม {2} เพิ่งเจอ ทีม {3} พบกับคู่ที่ทีม {4} เพิ่งเจอ ไปเรื่อยๆ จับสลากทุกรอบพร้อมกันและไม่มีใครเจอทีมเดิมซ้ำ ถ้าจำนวนทีมเป็นเลขคี่ แต่ละรอบจะมีหนึ่งทีมได้บาย จัดอันดับแบบระบบสวิส: ชนะ ผลต่างแต้ม Buchholz และ Fine Buchholz","Pool size":"ขนาดกลุ่ม","Pool games":"เกมในกลุ่ม","French poule ({n} wins qualify)":"พูลแบบฝรั่งเศส (ชนะ {1} เกมผ่านเข้ารอบ)","French poules need {n} teams: game {n} is drawn, then winners play winners and losers play losers, and a barrage decides second place. Pools of other sizes play round robin.":"พูลแบบฝรั่งเศสต้องมี {1} ทีม: เกม {2} จับสลาก จากนั้นผู้ชนะพบผู้ชนะ ผู้แพ้พบผู้แพ้ และเกมตัดสิน (barrage) หาอันดับสอง กลุ่มขนาดอื่นเล่นแบบพบกันหมด","First-round losers play a consolante":"ทีมที่แพ้รอบแรกเล่นสายปลอบใจ","Third-place play-off":"ชิงอันดับ 3","Seeding":"การจัดมือวาง","Random draw":"จับสลากแบบสุ่ม","Entry order is seeding":"ลำดับการสมัครเป็นลำดับมือวาง","Afternoon knockouts":"รอบน็อคเอาท์ช่วงบ่าย","Afternoon":"ช่วงบ่าย","Knockouts":"รอบน็อคเอาท์","What happens after the Swiss rounds. You can change this any time before the knockouts are drawn.":"สิ่งที่เกิดขึ้นหลังรอบระบบสวิส เปลี่ยนได้ตลอดก่อนจับสลากรอบน็อคเอาท์","What happens after the pools. You can change this any time before the knockouts are drawn.":"สิ่งที่เกิดขึ้นหลังรอบกลุ่ม เปลี่ยนได้ตลอดก่อนจับสลากรอบน็อคเอาท์","What happens after the round robin. You can change this any time before the knockouts are drawn.":"สิ่งที่เกิดขึ้นหลังรอบพบกันหมด เปลี่ยนได้ตลอดก่อนจับสลากรอบน็อคเอาท์","What happens after the snake rounds. You can change this any time before the knockouts are drawn.":"สิ่งที่เกิดขึ้นหลังรอบงูเลื้อย เปลี่ยนได้ตลอดก่อนจับสลากรอบน็อคเอาท์","Quick set-ups":"ตั้งค่าด่วน","Draw for the knockouts":"จับสลากรอบน็อคเอาท์","Seeded by standings ({n} v {n}, {n} v {n}…)":"ตามอันดับ ({1} พบ {2}, {3} พบ {4}…)","Seeded (pool winners kept apart)":"จัดมือวาง (แยกแชมป์กลุ่มออกจากกัน)","Random draw (tirage au sort)":"จับสลากสุ่มทั้งหมด","Knockout name":"ชื่อสายน็อคเอาท์","Ranks":"อันดับ","Pool places":"อันดับในกลุ่ม","3rd-place game":"ชิงอันดับ 3","From":"จาก","To":"ถึง","to":"ถึง","Remove knockout":"ลบสายน็อคเอาท์","+ Add another knockout":"+ เพิ่มสายน็อคเอาท์","Every place from {n} down":"ทุกอันดับตั้งแต่ที่ {1} ลงไป","Everyone from {n} down":"ทุกคนตั้งแต่อันดับ {1} ลงไป","Silver competition":"การแข่งขัน Silver","everyone who doesn't make the {x} plays their own knockout":"ทุกคนที่ไม่ได้เข้า {1} จะเล่นสายน็อคเอาท์ของตัวเอง","starts at final":"เริ่มที่รอบชิง","starts at semi-finals":"เริ่มที่รอบรองฯ","starts at quarter-finals":"เริ่มที่รอบ 8 ทีม","starts at last {n}":"เริ่มที่รอบ {1} ทีม","Pick which finishing places in each pool go into each knockout, e.g. {n}st–{n}nd into the A, {n}rd–{n}th into the B.":"เลือกว่าอันดับใดของแต่ละกลุ่มจะไปสายใด เช่น อันดับ 1–2 ไปสาย A อันดับ 3–4 ไปสาย B","Pick which overall ranks go into each knockout. Numbers that aren't a power of two get byes for the top seeds, so top {n} gives seeds {n} and {n} a bye into the semi-finals.":"เลือกว่าอันดับรวมใดจะไปสายใด ถ้าจำนวนไม่ใช่เลขยกกำลังสอง มือวางอันดับต้นจะได้บาย เช่น {1} อันดับแรก มือวาง {2} และ {3} ได้บายเข้ารอบรองฯ","not enough teams":"ทีมไม่พอ","{n} teams · starts at final":"{1} ทีม · เริ่มที่รอบชิง","{n} teams · starts at semi-finals":"{1} ทีม · เริ่มที่รอบรองฯ","{n} teams · starts at quarter-finals":"{1} ทีม · เริ่มที่รอบ 8 ทีม","{n} teams · starts at last {n}":"{1} ทีม · เริ่มที่รอบ {2} ทีม","{n} byes for the top seeds":"{1} บายสำหรับมือวาง","{n} bye for the top seed":"{1} บายสำหรับมือวางอันดับ 1","Final (top {n}
