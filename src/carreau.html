r changes and a later game has already been played, you'll be asked to confirm an override (only possible for the current and previous round).":"Para corrigir um resultado errado, altere-o e prima Atualizar resultado. Se o vencedor mudar e um jogo seguinte já tiver sido jogado, terá de confirmar que quer forçar (só possível na ronda atual e na anterior).","Only the current and previous round can be corrected.":"Só a ronda atual e a anterior podem ser corrigidas.","This result has already moved two rounds on, so it can't be corrected here.":"Este resultado já avançou duas rondas, por isso não pode ser corrigido aqui.","Fit":"Ajustar","Zoom in":"Aproximar","Zoom out":"Afastar","Open testing":"Teste aberto","Admin back end":"Administração","Back to competitions":"Voltar aos torneios","Open testing is on: everyone who opens a competition can run it, including registration, setup, draws and scores. Spectator and organiser links are switched off while it's on.":"O teste aberto está ligado: quem abrir um torneio pode geri-lo, incluindo inscrições, configuração, sorteios e resultados. Os links de espectador e organizador ficam desligados enquanto estiver ativo.","Link to this competition":"Link para este torneio","Anyone with this link can run this competition while open testing is on.":"Quem tiver este link pode gerir este torneio enquanto o teste aberto estiver ligado.","Everyone can run every competition (beta testing). Spectator and organiser links are switched off.":"Todos podem gerir todos os torneios (teste beta). Os links de espectador e organizador ficam desligados.","Off: spectators see the draw, results, standings and big screen; organisers use their organiser link or code.":"Desligado: os espectadores veem o sorteio, resultados, classificação e ecrã grande; os organizadores usam o seu link ou código de organizador.","Turn open testing off":"Desligar o teste aberto","Turn open testing on":"Ligar o teste aberto","Open testing is on.":"Teste aberto ligado.","Open testing is off.":"Teste aberto desligado.","Sign in with the admin Google account to change site settings.":"Inicie sessão com a conta Google de admin para alterar as definições do site.","Sign in with Google":"Iniciar sessão com Google","Signed in as {x}":"Sessão iniciada como {1}","Competitions":"Torneios","Test mode":"Modo de teste","That setting didn't save.":"Essa definição não foi guardada.","Admin":"Admin","Admin sign in":"Entrada de admin","Sign out":"Terminar sessão","Signed out.":"Sessão terminada.","Signed in as admin.":"Sessão iniciada como admin.","Admin: {x}":"Admin: {1}","That Google account isn't an admin for this site.":"Essa conta Google não é admin deste site.","Sign-in didn't complete. Allow pop-ups for this site and try again.":"O início de sessão não terminou. Permita pop-ups para este site e tente novamente.","That code didn't work. Check it with the organiser.":"Esse código não funcionou. Confirme-o com o organizador.","You're now an organiser for this competition.":"Agora é organizador deste torneio.","You can now enter scores for this competition.":"Agora pode introduzir resultados neste torneio.","Couldn't connect. Check your internet connection and reload.":"Sem ligação. Verifique a ligação à internet e recarregue.","Firebase isn't set up yet, so this is saving on this device only.":"O Firebase ainda não está configurado, por isso os dados ficam só neste dispositivo.","Scorers open this once on their phone and can then enter scores and move games between pistes. Scorer code":"Os marcadores abrem isto uma vez no telemóvel e depois podem introduzir resultados e mover jogos entre pistas. Código de marcador","Gives full control, including registration, setup, draws and scores. Keep it to your organising team, and keep a copy for yourself in case you change device. Organiser code":"Dá controlo total, incluindo inscrições, configuração, sorteios e resultados. Partilhe só com a equipa organizadora e guarde uma cópia caso mude de dispositivo. Código de organizador","Last {n}":"Ronda dos {1}","Last 16":"Oitavos de final","Last 32":"Dezasseis-avos de final","Last 64":"Trinta-e-dois-avos de final"},
  "th": {"Watch how it works":"ดูวิธีใช้งาน","A 2½-minute walk-through of a first competition":"วิดีโอแนะนำ 2 นาทีครึ่งสำหรับการแข่งขันครั้งแรก","Guides":"คู่มือ","Short videos that walk you through the competition desk, step by step.":"วิดีโอสั้นที่พาคุณใช้งานโต๊ะจัดการแข่งขันทีละขั้นตอน","Your first competition":"การแข่งขันครั้งแรกของคุณ","Running a shooting competition":"การจัดการแข่งขันยิงแม่นยำ","From a blank page to round 1 on the pistes: create a competition, add teams, check in, share the link, draw and enter scores.":"จากหน้าว่างจนถึงรอบที่ 1 บนสนาม: สร้างการแข่งขัน เพิ่มทีม เช็คอิน แชร์ลิงก์ จับสลาก และกรอกคะแนน","Tir de précision: qualifying scorecards with the live scorer, then a knockout to the final and the podium.":"Tir de précision: ใบคะแนนรอบคัดเลือกด้วยตัวนับคะแนนสด ตามด้วยรอบแพ้คัดออกจนถึงรอบชิงและโพเดียม","New to the desk? Watch the 2-minute walk-through.":"มาใหม่ใช่ไหม? ดูวิดีโอแนะนำ 2 นาที","Running a shooting day? Watch how it works (3 min).":"จัดการแข่งขันยิงแม่นยำ? ดูวิธีการ (3 นาที)","The videos are in English.":"วิดีโอเป็นภาษาอังกฤษ","{n} teams lost their first game and are ready to play.":"{1} ทีมแพ้เกมแรกและพร้อมแข่งแล้ว","Available once every team has played its first game.":"ใช้ได้เมื่อทุกทีมเล่นเกมแรกแล้ว","Not enough teams lost their first game to make a consolante.":"มีทีมที่แพ้เกมแรกไม่พอสำหรับสายปลอบใจ","At least 2 teams are needed for a knockout.":"ต้องมีอย่างน้อย 2 ทีมสำหรับการแข่งแบบแพ้คัดออก","{n} teams → barrage sizes {x}":"{1} ทีม → ขนาดกลุ่ม {2}","Round {n} · Cross-over":"รอบ {1} · ข้ามกลุ่ม","{n} cross-over game(s) this round (teams with different results).":"รอบนี้มีเกมข้ามกลุ่ม {1} เกม (ทีมที่ผลต่างกัน)","{n} cross-over game(s) this round (teams with different results). {n} rematch(es) were unavoidable this round.":"รอบนี้มีเกมข้ามกลุ่ม {1} เกม (ทีมที่ผลต่างกัน) รอบนี้เลี่ยงคู่ซ้ำไม่ได้ {2} คู่","In loving memory of Steve Noel":"ด้วยรักและระลึกถึง Steve Noel","SN Pétanque · In loving memory of Steve Noel":"SN Pétanque · ด้วยรักและระลึกถึง Steve Noel","Competition desk":"โต๊ะจัดการแข่งขัน","+ New competition":"+ การแข่งขันใหม่","New competition":"การแข่งขันใหม่","Competition":"การแข่งขัน","Sections":"ส่วน","This device only":"เฉพาะอุปกรณ์นี้","Saved in this browser only":"บันทึกไว้ในเบราว์เซอร์นี้เท่านั้น","Registration":"ลงทะเบียน","Setup":"ตั้งค่า","Draw & results":"จับสลากและผล","Pistes":"สนาม","Standings":"อันดับ","Big screen":"จอใหญ่","Loading competitions…":"กำลังโหลดการแข่งขัน…","No competitions yet":"ยังไม่มีการแข่งขัน","Set up a competition, add teams or players, then draw rounds, pools or a knockout. Pistes are allocated as games finish and scores go live for everyone with the link.":"สร้างการแข่งขัน เพิ่มทีมหรือผู้เล่น แล้วจับสลากรอบ กลุ่ม หรือรอบน็อคเอาท์ ระบบจะจัดสนามให้เมื่อเกมจบ และทุกคนที่มีลิงก์จะเห็นคะแนนสด","Create a competition":"สร้างการแข่งขัน","The organiser hasn't created a competition yet.":"ผู้จัดยังไม่ได้สร้างการแข่งขัน","This is an example competition with made-up teams, so you can see how everything works. Create your own from the menu above, then delete this one in Setup.":"นี่คือการแข่งขันตัวอย่างที่ใช้ทีมสมมติ เพื่อให้เห็นว่าทุกอย่างทำงานอย่างไร สร้างของคุณเองจากเมนูด้านบน แล้วลบอันนี้ในหน้าตั้งค่า","Close":"ปิด","Delete":"ลบ","Delete…":"ลบ…","Keep it":"เก็บไว้","Remove":"นำออก","Add":"เพิ่ม","Copy":"คัดลอก","Join":"เข้าร่วม","Singles":"เดี่ยว","Doubles":"ทีม 2 คน","Triples":"ทีม 3 คน","Singles (tête-à-tête)":"เดี่ยว (tête-à-tête)","Fixed teams":"ทีมคงที่","Mêlée (random teams)":"Mêlée (สุ่มทีม)","Mêlée":"Mêlée","Mêlée rounds":"รอบ Mêlée","Swiss":"ระบบสวิส","Swiss rounds":"รอบระบบสวิส","Snake":"งูเลื้อย","Snake rounds":"รอบงูเลื้อย","Pools → KO":"กลุ่ม → น็อคเอาท์","Pools → knockout":"กลุ่ม → รอบน็อคเอาท์","Knockout":"น็อคเอาท์","Round robin":"พบกันหมด","Round robin schedule":"ตารางแข่งพบกันหมด","Pools":"กลุ่ม","Competition name":"ชื่อการแข่งขัน","Date":"วันที่","Venue":"สถานที่","Club or boulodrome":"สโมสรหรือสนามเปตอง","Format locked after the first draw":"ล็อกรูปแบบหลังจับสลากครั้งแรก","Entries":"ผู้สมัคร","Entry type":"ประเภทการสมัคร","Format":"รูปแบบ","Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.":"ผู้เล่นสมัครแบบเดี่ยว ทุกรอบจะสุ่มทีมใหม่ โดยผสมทีม 2 คนและทีม 3 คนเมื่อจำนวนหารไม่ลงตัว และพยายามไม่ให้คู่ซ้ำ จัดอันดับเป็นรายบุคคล","Points to win":"แต้มที่ต้องได้เพื่อชนะ","Bye counts as":"บายนับเป็น","Competition system":"ระบบการแข่งขัน","Mêlée competitions play a set number of rounds.":"การแข่งขัน Mêlée เล่นตามจำนวนรอบที่กำหนด","Planned rounds":"จำนวนรอบที่วางไว้","Rounds":"รอบ","Round {n} is random. After that, teams on the same number of wins play each other and rematches are avoided. Ties are split by points difference, then Buchholz (opponents' wins).":"รอบ {1} เป็นการสุ่ม หลังจากนั้นทีมที่ชนะเท่ากันจะพบกันโดยไม่ซ้ำคู่เดิม หากเสมอตัดสินด้วยผลต่างแต้ม แล้วตามด้วย Buchholz (จำนวนชนะของคู่แข่ง)","Rounds are drawn one at a time once the previous round is finished.":"จับสลากทีละรอบเมื่อรอบก่อนหน้าจบแล้ว","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice ({n} teams allow up to {n} rounds). With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"ทีมยืนเป็นสองแถว ทุกรอบแถวหนึ่งจะขยับไปหนึ่งตำแหน่ง ทีม {1} จึงพบกับคู่ที่ทีม {2} เพิ่งเจอ ทีม {3} พบกับคู่ที่ทีม {4} เพิ่งเจอ ไปเรื่อยๆ จับสลากทุกรอบพร้อมกันและไม่มีใครเจอทีมเดิมซ้ำ ({5} ทีมเล่นได้สูงสุด {6} รอบ) ถ้าจำนวนทีมเป็นเลขคี่ แต่ละรอบจะมีหนึ่งทีมได้บาย จัดอันดับแบบระบบสวิส: ชนะ ผลต่างแต้ม Buchholz และ Fine Buchholz","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"ทีมยืนเป็นสองแถว ทุกรอบแถวหนึ่งจะขยับไปหนึ่งตำแหน่ง ทีม {1} จึงพบกับคู่ที่ทีม {2} เพิ่งเจอ ทีม {3} พบกับคู่ที่ทีม {4} เพิ่งเจอ ไปเรื่อยๆ จับสลากทุกรอบพร้อมกันและไม่มีใครเจอทีมเดิมซ้ำ ถ้าจำนวนทีมเป็นเลขคี่ แต่ละรอบจะมีหนึ่งทีมได้บาย จัดอันดับแบบระบบสวิส: ชนะ ผลต่างแต้ม Buchholz และ Fine Buchholz","Pool size":"ขนาดกลุ่ม","Pool games":"เกมในกลุ่ม","French poule ({n} wins qualify)":"พูลแบบฝรั่งเศส (ชนะ {1} เกมผ่านเข้ารอบ)","French poules need {n} teams: game {n} is drawn, then winners play winners and losers play losers, and a barrage decides second place. Pools of other sizes play round robin.":"พูลแบบฝรั่งเศสต้องมี {1} ทีม: เกม {2} จับสลาก จากนั้นผู้ชนะพบผู้ชนะ ผู้แพ้พบผู้แพ้ และเกมตัดสิน (barrage) หาอันดับสอง กลุ่มขนาดอื่นเล่นแบบพบกันหมด","First-round losers play a consolante":"ทีมที่แพ้รอบแรกเล่นสายปลอบใจ","Third-place play-off":"ชิงอันดับ 3","Seeding":"การจัดมือวาง","Random draw":"จับสลากแบบสุ่ม","Entry order is seeding":"ลำดับการสมัครเป็นลำดับมือวาง","Afternoon knockouts":"รอบน็อคเอาท์ช่วงบ่าย","Afternoon":"ช่วงบ่าย","Knockouts":"รอบน็อคเอาท์","What happens after the Swiss rounds. You can change this any time before the knockouts are drawn.":"สิ่งที่เกิดขึ้นหลังรอบระบบสวิส เปลี่ยนได้ตลอดก่อนจับสลากรอบน็อคเอาท์","What happens after the pools. You can change this any time before the knockouts are drawn.":"สิ่งที่เกิดขึ้นหลังรอบกลุ่ม เปลี่ยนได้ตลอดก่อนจับสลากรอบน็อคเอาท์","What happens after the round robin. You can change this any time before the knockouts are drawn.":"สิ่งที่เกิดขึ้นหลังรอบพบกันหมด เปลี่ยนได้ตลอดก่อนจับสลากรอบน็อคเอาท์","What happens after the snake rounds. You can change this any time before the knockouts are drawn.":"สิ่งที่เกิดขึ้นหลังรอบงูเลื้อย เปลี่ยนได้ตลอดก่อนจับสลากรอบน็อคเอาท์","Quick set-up /* Swiss ranking-order strings */
Object.assign(FR_TEXT, {"Round 1 is random. After that, teams play teams on the same number of wins, and within a group the teams closest in the standings play each other (1st v 2nd, 3rd v 4th). When a group has an odd number of teams, one team crosses over to the next group; a team that has already crossed over is passed over where possible, and never crosses in back-to-back rounds unless there is no other way. Rematches are avoided, nobody gets a second bye while others are still waiting for one, and the leaders never get the bye. Places in the standings, and so the pairings, follow the ranking order below.": "La partie 1 est tirée au sort. Ensuite, les équipes rencontrent des équipes au même nombre de victoires, et dans un groupe les équipes les plus proches au classement se rencontrent (1re contre 2e, 3e contre 4e). Quand un groupe compte un nombre impair d'équipes, une équipe passe dans le groupe suivant ; une équipe qui a déjà changé de groupe est évitée autant que possible, et jamais deux parties de suite sauf s'il n'y a pas d'autre solution. On évite de rejouer le même adversaire, personne n'est exempt deux fois tant que d'autres attendent encore, et les équipes en tête ne sont jamais exemptes. Le classement, et donc les appariements, suivent l'ordre de classement ci-dessous.", "Ranking order": "Ordre de classement", "Points difference first": "Goal-average d'abord", "Buchholz first": "Buchholz d'abord", "Wins": "Victoires", "Points difference": "Goal-average", "Buchholz": "Buchholz", "Fine Buchholz": "Buchholz fin", "Points for": "Points marqués", "Fewest points against": "Moins de points encaissés", "Drawn lot": "Tirage au sort", "Opponents' total wins": "Total des victoires des adversaires", "Opponents' Buchholz added up": "Somme des Buchholz des adversaires", "Anything still level": "En cas d'égalité persistante", "Switch tie-breaks on or off and move them up or down. Changes apply straight away to the standings and to the next round's pairings.": "Activez ou désactivez les critères et changez leur ordre. Les changements s'appliquent tout de suite au classement et aux appariements de la partie suivante.", "Byes count as a {n}–{n} win.": "Un exempt compte comme une victoire {1}–{2}.", "Move up": "Monter", "Move down": "Descendre"});
Object.assign(LANG_TEXT.es, {"Round 1 is random. After that, teams play teams on the same number of wins, and within a group the teams closest in the standings play each other (1st v 2nd, 3rd v 4th). When a group has an odd number of teams, one team crosses over to the next group; a team that has already crossed over is passed over where possible, and never crosses in back-to-back rounds unless there is no other way. Rematches are avoided, nobody gets a second bye while others are still waiting for one, and the leaders never get the bye. Places in the standings, and so the pairings, follow the ranking order below.": "La ronda 1 es por sorteo. Después, cada equipo juega con equipos que tienen el mismo número de victorias, y dentro de cada grupo se enfrentan los equipos más cercanos en la clasificación (1.º contra 2.º, 3.º contra 4.º). Si un grupo tiene un número impar de equipos, uno pasa al grupo siguiente; se evita que un equipo que ya cambió de grupo vuelva a hacerlo, y nunca en dos rondas seguidas salvo que no haya otra opción. Se evitan las revanchas, nadie descansa dos veces mientras otros esperan y los líderes nunca descansan. La clasificación, y por tanto los emparejamientos, siguen el orden de clasificación de abajo.", "Ranking order": "Orden de clasificación", "Points difference first": "Diferencia de puntos primero", "Buchholz first": "Buchholz primero", "Wins": "Victorias", "Points difference": "Diferencia de puntos", "Buchholz": "Buchholz", "Fine Buchholz": "Buchholz fino", "Points for": "Puntos a favor", "Fewest points against": "Menos puntos en contra", "Drawn lot": "Sorteo", "Opponents' total wins": "Victorias totales de los rivales", "Opponents' Buchholz added up": "Suma del Buchholz de los rivales", "Anything still level": "Si sigue el empate", "Switch tie-breaks on or off and move them up or down. Changes apply straight away to the standings and to the next round's pairings.": "Activa o desactiva los desempates y cambia su orden. Los cambios se aplican al momento a la clasificación y a los emparejamientos de la siguiente ronda.", "Byes count as a {n}–{n} win.": "Un descanso cuenta como victoria por {1}–{2}.", "Move up": "Subir", "Move down": "Bajar"});
Object.assign(LANG_TEXT.it, {"Round 1 is random. After that, teams play teams on the same number of wins, and within a group the teams closest in the standings play each other (1st v 2nd, 3rd v 4th). When a group has an odd number of teams, one team crosses over to the next group; a team that has already crossed over is passed over where possible, and never crosses in back-to-back rounds unless there is no other way. Rematches are avoided, nobody gets a second bye while others are still waiting for one, and the leaders never get the bye. Places in the standings, and so the pairings, follow the ranking order below.": "Il turno 1 è sorteggiato. Poi ogni squadra affronta squadre con lo stesso numero di vittorie, e nel gruppo si affrontano le squadre più vicine in classifica (1ª contro 2ª, 3ª contro 4ª). Se un gruppo ha un numero dispari di squadre, una passa al gruppo successivo; si evita che una squadra già spostata lo sia di nuovo, e mai in due turni di fila salvo non ci sia altra scelta. Si evitano le rivincite, nessuno riposa due volte finché altri aspettano e chi è in testa non riposa mai. La classifica, e quindi gli accoppiamenti, seguono l'ordine di classifica qui sotto.", "Ranking order": "Ordine di classifica", "Points difference first": "Prima la differenza punti", "Buchholz first": "Prima il Buchholz", "Wins": "Vittorie", "Points difference": "Differenza punti", "Buchholz": "Buchholz", "Fine Buchholz": "Buchholz fine", "Points for": "Punti fatti", "Fewest points against": "Meno punti subiti", "Drawn lot": "Sorteggio", "Opponents' total wins": "Vittorie totali degli avversari", "Opponents' Buchholz added up": "Somma dei Buchholz degli avversari", "Anything still level": "Se resta la parità", "Switch tie-breaks on or off and move them up or down. Changes apply straight away to the standings and to the next round's pairings.": "Attiva o disattiva gli spareggi e cambiane l'ordine. Le modifiche valgono subito per la classifica e gli accoppiamenti del turno successivo.", "Byes count as a {n}–{n} win.": "Un turno di riposo vale una vittoria {1}–{2}.", "Move up": "Sposta su", "Move down": "Sposta giù"});
Object.assign(LANG_TEXT.de, {"Round 1 is random. After that, teams play teams on the same number of wins, and within a group the teams closest in the standings play each other (1st v 2nd, 3rd v 4th). When a group has an odd number of teams, one team crosses over to the next group; a team that has already crossed over is passed over where possible, and never crosses in back-to-back rounds unless there is no other way. Rematches are avoided, nobody gets a second bye while others are still waiting for one, and the leaders never get the bye. Places in the standings, and so the pairings, follow the ranking order below.": "Runde 1 wird ausgelost. Danach spielen Teams gegen Teams mit gleich vielen Siegen, und innerhalb einer Gruppe spielen die in der Tabelle nächsten Teams gegeneinander (1. gegen 2., 3. gegen 4.). Hat eine Gruppe eine ungerade Zahl von Teams, wechselt ein Team in die nächste Gruppe; ein Team, das schon gewechselt hat, wird möglichst übergangen und wechselt nie in zwei Runden hintereinander, außer es geht nicht anders. Wiederholungen werden vermieden, niemand bekommt ein zweites Freilos, solange andere noch keines hatten, und die Führenden bekommen nie das Freilos. Die Tabelle und damit die Paarungen folgen der Wertungsreihenfolge unten.", "Ranking order": "Wertungsreihenfolge", "Points difference first": "Punktdifferenz zuerst", "Buchholz first": "Buchholz zuerst", "Wins": "Siege", "Points difference": "Punktdifferenz", "Buchholz": "Buchholz", "Fine Buchholz": "Feinbuchholz", "Points for": "Erzielte Punkte", "Fewest points against": "Wenigste Gegenpunkte", "Drawn lot": "Los", "Opponents' total wins": "Siege der Gegner zusammen", "Opponents' Buchholz added up": "Buchholz der Gegner zusammen", "Anything still level": "Bei weiterem Gleichstand", "Switch tie-breaks on or off and move them up or down. Changes apply straight away to the standings and to the next round's pairings.": "Feinwertungen ein- oder ausschalten und verschieben. Änderungen gelten sofort fü Object.assign(LANG_TEXT.nl, {"Round 1 is random. After that, teams play teams on the same number of wins, and within a group the teams closest in the standings play each other (1st v 2nd, 3rd v 4th). When a group has an odd number of teams, one team crosses over to the next group; a team that has already crossed over is passed over where possible, and never crosses in back-to-back rounds unless there is no other way. Rematches are avoided, nobody gets a second bye while others are still waiting for one, and the leaders never get the bye. Places in the standings, and so the pairings, follow the ranking order below.": "Ronde 1 wordt geloot. Daarna spelen teams tegen teams met evenveel overwinningen, en binnen een groep spelen de teams die het dichtst bij elkaar staan in de stand tegen elkaar (1e tegen 2e, 3e tegen 4e). Heeft een groep een oneven aantal teams, dan schuift één team door naar de volgende groep; een team dat al eens doorschoof wordt zo veel mogelijk overgeslagen, en nooit twee rondes achter elkaar tenzij het niet anders kan. Herhalingen worden vermeden, niemand krijgt een tweede bye zolang anderen er nog geen hadden, en de koplopers krijgen nooit de bye. De stand, en dus de indeling, volgt de rangschikking hieronder.", "Ranking order": "Rangschikking", "Points difference first": "Puntenverschil eerst", "Buchholz first": "Buchholz eerst", "Wins": "Overwinningen", "Points difference": "Puntenverschil", "Buchholz": "Buchholz", "Fine Buchholz": "Fijne Buchholz", "Points for": "Punten voor", "Fewest points against": "Minste punten tegen", "Drawn lot": "Loting", "Opponents' total wins": "Totaal aantal zeges van de tegenstanders", "Opponents' Buchholz added up": "Opgetelde Buchholz van de tegenstanders", "Anything still level": "Bij verdere gelijke stand", "Switch tie-breaks on or off and move them up or down. Changes apply straight away to the standings and to the next round's pairings.": "Zet tiebreaks aan of uit en verschuif ze. Wijzigingen gelden meteen voor function newTournament() {

function tiebreakPanel(t) {

    return `<div class="tb-row ${active ? "" : "off"}"><span class="tb-n">${active ? i + 2 : "–"}</span><span class="tb-name"><b>${d.label}</b>${d.hint ? `<span class="small muted">${d.hint}</span>` : ""}</span>

  return `<div class="stack tb" style="gap:8px"><div class="eyebrow">Ranking order</div>
    <div class="seg" role="group"><button type="button" data-act="tb-preset" data-p="diff" aria-pressed="${isPreset("diff")}">Points difference first</button><button type="button" data-act="tb-preset" data-p="buch" aria-pressed="${isPreset("buch")}">Buchholz first</button></div>

// a list of games: one compact line per game once every game is finished, the full cards while any is still to play

}
function resultRow(t, m) {

    <div class="tw"><table><thead><tr><th>#</th><th>${isIndiv(t) ? "Player" : "Team"}</th><th class="n" title="Wins">W</th><th class="n" title="Losses">L</th><th class="n" title="Points for">For</th><th class="n" title="Points against">Agst</th><th class="n" title="Points difference">+/-</th></tr></thead><tbody>
      ${rk.rows.map((s, i) => `<tr class="${!s.unplaced && i < getPlan(t).brackets[0].to && i >= getPlan(t).brackets[0].from - 1 && rk.complete ? "q" : ""}"><td>${s.unplaced ? "–" : i + 1}</td><td class="wrap">${esc(entName(t, s.id))}</td><td class="n"><b>${s.w}</b></td><td class="n">${s.l}</td><td class="n">${s.pf}</td><td class="n">${s.pa}</td><td class="n">${s.diff > 0 ? "+" : ""}${s.diff}</td></tr>`).join("")}
