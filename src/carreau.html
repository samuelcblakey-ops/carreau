<title>Carreau Competition Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: compact app bar + tab strip, one working column; courts and brackets as grids that wrap or scroll in place. */
:root{
  --bg:#eceeea; --surface:#ffffff; --surface-2:#f5f6f3; --ink:#1a2320; --muted:#5d6a64; --line:#d3d9d5;
  --accent:#1d6a54; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --jack:#d48d0b; --jack-soft:#fbefd6; --danger:#b3261e; --danger-soft:#f8e0de; --wire:#b9c3be;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a211e; --surface-2:#202825; --ink:#e5ebe8; --muted:#97a49e; --line:#2d3833;
  --accent:#5fc19d; --accent-ink:#0b1511; --accent-soft:#1f3a30;
  --jack:#f0b443; --jack-soft:#3a2f17; --danger:#ef7a70; --danger-soft:#3d1f1d; --wire:#3e4b45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a211e; --surface-2:#202825; --ink:#e5ebe8; --muted:#97a49e; --line:#2d3833;
  --accent:#5fc19d; --accent-ink:#0b1511; --accent-soft:#1f3a30;
  --jack:#f0b443; --jack-soft:#3a2f17; --danger:#ef7a70; --danger-soft:#3d1f1d; --wire:#3e4b45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{flex:none}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.tsel select{max-width:260px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:26px}
h3{font-size:19px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.ghost{background:none;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f>span{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.seg{display:inline-flex;align-self:flex-start;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface-2);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.playing{background:var(--jack-soft);color:var(--jack)}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.ready{background:var(--surface-2);color:var(--ink);border:1px dashed var(--line)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.notice{padding:10px 14px;border-radius:8px;background:var(--jack-soft);color:var(--ink);font-size:14px}
.notice.example{background:var(--accent-soft)}
/* matches */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;cursor:pointer;min-width:0}
.match:hover{border-color:var(--muted)}
.match.ro{cursor:default}
.match.playing{border-color:var(--jack);box-shadow:inset 3px 0 0 var(--jack)}
.match .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.side{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.side .nm{min-width:0;overflow-wrap:anywhere;font-weight:500}
.side.win .nm{font-weight:700}
.side .sc{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.side.win .sc{color:var(--accent)}
.side.lose .sc{color:var(--muted)}
.court-tag{font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink);letter-spacing:.03em}
.tbd{color:var(--muted);font-style:italic}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:160px}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.rank{font-family:var(--display);font-weight:700;font-size:17px}
/* courts */
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.court{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.court .cn{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;display:flex;justify-content:space-between;align-items:center}
.court.free{background:var(--surface-2);border-style:dashed}
.court.off{opacity:.5}
/* bracket */
/* bracket: every round column is the same height and each match sits in an equal share of it,
   so a match always lines up halfway between the two games that feed it; wires are drawn with borders */
.bk-scroll{overflow:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;max-width:100%}
.bk-tools{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bk-tools .btn{min-width:36px;justify-content:center}
.bk-tools .zv{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:4ch;text-align:center}
.bk{--gap:40px;display:grid;grid-auto-columns:minmax(200px,230px);grid-template-rows:auto 1fr;column-gap:var(--gap);width:max-content;min-width:100%}
.bk h4{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;grid-row:1}
.bk-col{grid-row:2;display:flex;flex-direction:column}
.bk-pair{flex:1;display:flex;flex-direction:column;position:relative}
.bk-slot{flex:1;display:flex;align-items:center;position:relative;padding-block:5px}
.bk-slot>*{width:100%}
.bk-col.out .bk-slot::after{content:"";position:absolute;right:calc(var(--gap) / -2);width:calc(var(--gap) / 2);top:50%;border-top:2px solid var(--wire)}
.bk-col.out .bk-pair::after{content:"";position:absolute;right:calc(var(--gap) / -2);top:25%;bottom:25%;border-right:2px solid var(--wire)}
.bk-col.in .bk-slot::before{content:"";position:absolute;left:calc(var(--gap) / -2);width:calc(var(--gap) / 2);top:50%;border-top:2px solid var(--wire)}
.bk-col.out .bk-slot.done::after{border-color:var(--accent)}
.bkm{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:left;padding:0;cursor:pointer;font-size:14px}
.bkm.ro{cursor:default}
button.bkm:hover{border-color:var(--muted)}
.bkm.playing{border-color:var(--jack);box-shadow:inset 3px 0 0 var(--jack)}
.bkm.bye{opacity:.6;background:var(--surface-2);border-style:dashed}
.bkm-row{display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:34px}
.bkm-row+.bkm-row{border-top:1px solid var(--line)}
.bkm-row .sd{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.6ch;text-align:right}
.bkm-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkm-row .sc{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.bkm-row.win .nm{font-weight:700}.bkm-row.win .sc{color:var(--accent)}
.bkm-row.lose .nm,.bkm-row.lose .sc{color:var(--muted)}
.bkm-row .tbd{font-size:13px}
.bkm-foot{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;background:var(--surface-2);color:var(--muted);border-top:1px solid var(--line)}
.bkm.playing .bkm-foot{background:var(--jack-soft);color:var(--jack)}
.bk-champ{border:2px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.bk-champ b{font-family:var(--display);font-size:22px;line-height:1.1;overflow-wrap:anywhere}
.bk-champ.tbc{border-style:dashed;border-color:var(--wire);background:none}
.bk-third{display:flex;justify-content:flex-end}
.bk-third>div{width:230px;max-width:100%}
.bk-third h4{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0}
/* pools */
.pools{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
/* entries */
.elist{display:flex;flex-direction:column}
.erow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.erow .num{font-family:var(--display);font-weight:700;color:var(--muted);width:2.5ch;text-align:right;font-variant-numeric:tabular-nums}
.erow .who{flex:1;min-width:0}
.erow .who b{display:block}
.erow.out{opacity:.5}
.erow.here .num{color:var(--accent)}
.btn.checked{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.reg-count{font-family:var(--display);font-size:22px}.reg-count b{font-size:30px}
.meter{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);transition:width .2s}
input[type=search]{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;color:var(--ink)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;max-width:520px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.scorer{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.scorer .who{min-width:0}
.scorer .who b{display:block;font-size:17px;overflow-wrap:anywhere}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer}
.stepper input{width:64px;text-align:center;font-family:var(--display);font-size:30px;font-weight:700;padding:4px}
.stepper input.padbox{cursor:pointer;caret-color:transparent}.stepper input.padbox.on{outline:3px solid var(--accent);outline-offset:1px}
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:-2px 0 6px}
.pad button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:var(--display);font-size:20px;font-weight:700;cursor:pointer}
.pad button.win{border-color:var(--accent)}.pad button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.err{color:var(--danger);font-size:14px;font-weight:600}
.modal.wide{max-width:680px}
table.shots td,table.shots th{padding:5px 6px}
select.shot{width:58px;padding:5px 6px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
/* display mode */
.disp{display:flex;flex-direction:column;gap:20px}
.disp .court .cn{font-size:40px}
.disp .court .side .nm{font-size:20px}
.disp .court .side .sc{font-size:34px}
.disp h2{font-size:38px}
@media (max-width:560px){h2{font-size:22px}.stepper button{width:40px;height:40px}}
@media (prefers-reduced-motion:no-preference){.match,.btn{transition:border-color .12s}}
</style>

<header class="app">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="10" cy="14" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 11.5c3.5 1.5 7.5 1.5 11 0M4.5 16.5c3.5-1.5 7.5-1.5 11 0" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="21" cy="6" r="3" fill="var(--jack)"/></svg>
        Carreau <small>Competition desk</small>
      </div>
      <div class="tsel" id="tsel"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Loading competitions…</div></main>
<div id="modal"></div>
<div id="toast" hidden class="toast"></div>

<script>
(() => {
"use strict";
/* ---------------- utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const SIZE = { singles: 1, doubles: 2, triples: 3 };
const FORMAT_LABEL = { singles: "Singles (tête-à-tête)", doubles: "Doubles", triples: "Triples" };
const SYSTEM_LABEL = { swiss: "Swiss rounds", pools: "Pools → knockout", knockout: "Knockout", roundrobin: "Round robin", snake: "Snake", melee: "Mêlée rounds" };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

/* ---------------- French translation ----------------
   Keys are the English text as it appears on screen. {n} matches a number and {x} any text
   (a team name, say); in the French, {1}, {2}… refer to those matches in order. */
const FR_TEXT = {
  // header, tabs, general
  "Carreau": "Carreau", "Competition desk": "Bureau du concours", "+ New competition": "+ Nouveau concours", "New competition": "Nouveau concours",
  "Competition": "Concours", "Sections": "Sections", "This device only": "Cet appareil uniquement", "Saved in this browser only": "Enregistré dans ce navigateur uniquement",
  "Registration": "Inscriptions", "Setup": "Paramètres", "Draw & results": "Tirage et résultats", "Pistes": "Pistes", "Standings": "Classement", "Big screen": "Grand écran",
  "Loading competitions…": "Chargement des concours…", "No competitions yet": "Aucun concours pour l'instant",
  "Set up a competition, add teams or players, then draw rounds, pools or a knockout. Pistes are allocated as games finish and scores go live for everyone with the link.": "Créez un concours, ajoutez des équipes ou des joueurs, puis tirez les parties, les poules ou un tableau. Les pistes sont attribuées au fil des parties et les scores s'affichent en direct pour tous ceux qui ont le lien.",
  "Create a competition": "Créer un concours", "The organiser hasn't created a competition yet.": "L'organisateur n'a pas encore créé de concours.",
  "This is an example competition with made-up teams, so you can see how everything works. Create your own from the menu above, then delete this one in Setup.": "Ceci est un concours d'exemple avec des équipes fictives, pour voir comment tout fonctionne. Créez le vôtre depuis le menu ci-dessus, puis supprimez celui-ci dans Paramètres.",
  "Close": "Fermer", "Delete": "Supprimer", "Delete…": "Supprimer…", "Keep it": "Le garder", "Remove": "Retirer", "Add": "Ajouter", "Copy": "Copier", "Join": "Rejoindre",
  // formats & systems
  "Singles": "Tête-à-tête", "Doubles": "Doublettes", "Triples": "Triplettes", "Singles (tête-à-tête)": "Tête-à-tête",
  "Fixed teams": "Équipes formées", "Mêlée (random teams)": "Mêlée (équipes tirées au sort)", "Mêlée": "Mêlée", "Mêlée rounds": "Parties en mêlée",
  "Swiss": "Suisse", "Swiss rounds": "Système suisse", "Snake": "Serpent", "Snake rounds": "Parties en serpent", "Pools → KO": "Poules → tableau", "Pools → knockout": "Poules → tableau",
  "Knockout": "Élimination directe", "Round robin": "Tous contre tous", "Round robin schedule": "Calendrier tous contre tous", "Pools": "Poules",
  // setup
  "Competition name": "Nom du concours", "Date": "Date", "Venue": "Lieu", "Club or boulodrome": "Club ou boulodrome",
  "Format locked after the first draw": "Format verrouillé après le premier tirage", "Entries": "Engagés", "Entry type": "Type d'inscription", "Format": "Format",
  "Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.": "Les joueurs s'inscrivent individuellement. À chaque partie, de nouvelles équipes sont tirées au sort, en mélangeant doublettes et triplettes si le nombre ne tombe pas juste, en évitant si possible les mêmes partenaires. Le classement est individuel.",
  "Points to win": "Points pour gagner", "Bye counts as": "L'exempt compte pour", "Competition system": "Système de jeu",
  "Mêlée competitions play a set number of rounds.": "Les concours en mêlée se jouent sur un nombre de parties fixé.",
  "Planned rounds": "Parties prévues", "Rounds": "Parties",
  "Round {n} is random. After that, teams on the same number of wins play each other and rematches are avoided. Ties are split by Buchholz (opponents' wins), then points difference.": "La partie {1} est tirée au sort. Ensuite, les équipes ayant le même nombre de victoires se rencontrent, sans revanche. Les égalités sont départagées au Buchholz (victoires des adversaires), puis au goal-average.",
  "Rounds are drawn one at a time once the previous round is finished.": "Les parties sont tirées une par une, quand la précédente est terminée.",
  "Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice ({n} teams allow up to {n} rounds). With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, Buchholz, fine Buchholz, points difference.": "Les équipes forment deux lignes. À chaque partie, une ligne avance d'une place : l'équipe {1} joue contre l'adversaire que l'équipe {2} vient d'affronter, l'équipe {3} contre celui de l'équipe {4}, et ainsi de suite. Toutes les parties sont tirées d'un coup et personne ne rencontre deux fois la même équipe ({5} équipes permettent jusqu'à {6} parties). Avec un nombre impair, une équipe est exempte à chaque partie. Classement comme en suisse : victoires, Buchholz, Buchholz fin, goal-average.",
  "Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, Buchholz, fine Buchholz, points difference.": "Les équipes forment deux lignes. À chaque partie, une ligne avance d'une place : l'équipe {1} joue contre l'adversaire que l'équipe {2} vient d'affronter, l'équipe {3} contre celui de l'équipe {4}, et ainsi de suite. Toutes les parties sont tirées d'un coup et personne ne rencontre deux fois la même équipe. Avec un nombre impair, une équipe est exempte à chaque partie. Classement comme en suisse : victoires, Buchholz, Buchholz fin, goal-average.",

/* ---------------- storage: shared db, or local fallback ---------------- */

  const emitT = () => setTimeout(() => subsT.forEach(cb => cb(Object.values(data.t).map(clone))));
  const emitM = tid => setTimeout(() => (subsM.get(tid) || new Set()).forEach(cb => cb(Object.values(data.m[tid] || {}).map(clone))));
  return {
    mode: "local",
    watchTournaments(cb) { subsT.add(cb); emitT(); return () => subsT.delete(cb); },
    watchMatches(tid, cb) { if (!subsM.has(tid)) subsM.set(tid, new Set()); subsM.get(tid).add(cb); emitM(tid); return () => subsM.get(tid).delete(cb); },
    async setTournament(t) { data.t[t.id] = clone(t); persist(); emitT(); },
    async deleteTournament(tid) { delete data.t[tid]; delete data.m[tid]; persist(); emitT(); },
    async setMatch(tid, m) { (data.m[tid] ||= {})[m.id] = clone(m); persist(); emitM(tid); },
    async updateMatch(tid, id, patch) { const m = data.m[tid]?.[id]; if (!m) throw { code: "invalid_argument" }; Object.assign(m, clone(patch)); persist(); emitM(tid); },

}

    watchMatches(tid, cb, onErr) { return db.collection(`tournaments/${tid}/matches`).limit(1000).onSnapshot(s => cb(s.docs.map(d => clone(d.data()))), onErr); },
    setTournament(t) { return db.doc(`tournaments/${t.id}`).set(clone(t)); },

  const pad = k => ro || S.modal.pad !== k ? "" : `<div class="pad">${Array.from({ length: t.target + 1 }, (_, n) => `<button type="button" data-act="pick" data-k="${k}" data-n="${n}" class="${n === S.modal[k] ? "on" : ""} ${n === t.target ? "win" : ""}">${n}</button>`).join("")}</div>`;

function matchContext(t, m) {
  if (m.stage === "ko") { const b = (t.brackets || []).find(b => b.id === m.bracket); return `${b?.name || "Knockout"} · ${m.third ? "Third-place game" : roundLabel(b?.rounds || 1, m.round)}`; }
  if (m.stage === "pool") { const p = (t.pools || []).find(p => p.id === m.pool); return `${p?.name || "Pool"} · ${m.label || "Game " + m.round}`; }
  if (m.stage === "rr") return `Round robin · Round ${m.round}`;
  if (m.stage === "snake") return `Snake · Round ${m.round}`;
  return `Round ${m.round}`;
}
function readModalScores() {
  const a = parseInt($("#sc-sa")?.value, 10), b = parseInt($("#sc-sb")?.value, 10);
  S.modal.sa = isNaN(a) ? 0 : a; S.modal.sb = isNaN(b) ? 0 : b; S.modal.early = !!$("#early")?.checked;
}
async function modalAction(act, k, a) {
  const t = T(); const md = S.modal; if (!md) return;
  if (act === "close" || act === "close-bg") { S.modal = null; renderModal(); return; }
  if (act === "shoot-save") { await saveShooting(a?.dataset.final === "1"); return; }
  if (act === "override") {
    if (md.pending?.shoot) { md.override = true; md.blocked = null; renderModal(); await saveShooting(true); return; }
    const pd = md.pending || {};
    const res = await guard(() => recordResult(md.id, pd.sa, pd.sb, pd.done !== false, { override: true }));
    if (res === true) { S.modal = null; renderModal(); toast("Result corrected and later games reset."); }
    return;
  }
  readModalScores();
  if (act === "pad") { md.pad = md.pad === k ? null : k; renderModal(); return; }
  if (act === "pick") { md[k] = +a.dataset.n; md.err = ""; md.pad = k === "sa" && !md.pickedB ? "sb" : null; if (k === "sb") md.pickedB = true; renderModal(); return; }
  if (act === "inc") { md[k] = Math.min(t.target, md[k] + 1); renderModal(); return; }
  if (act === "dec") { md[k] = Math.max(0, md[k] - 1); renderModal(); return; }
  const m = S.matches[md.id];
  if (act === "save-final") {
    const { sa, sb } = md;
    if (sa === sb) { md.err = "Scores can't be level. Petanque games always have a winner."; renderModal(); return; }
    if (Math.max(sa, sb) > t.target) { md.err = `Scores can't go above ${t.target}.`; renderModal(); return; }
    if (!md.early && Math.max(sa, sb) !== t.target) { md.err = `The winner needs ${t.target} points, or tick the time-limit box.`; renderModal(); return; }
    const ok = await guard(() => recordResult(md.id, sa, sb, true));
    if (ok && ok.blocked) { md.blocked = ok.blocked; md.pending = { sa, sb, done: true }; renderModal(); return; }
    if (ok) { S.modal = null; renderModal(); toast("Result saved."); }
    return;
  }
  if (act === "save-live") {
    const c = $("#mcourt")?.value || null;
    await guard(async () => {
      const patch = { sa: md.sa, sb: md.sb };
      if (c !== (m.court || null)) patch.court = c;
      Object.assign(S.matches[md.id], patch);
      await S.store.updateMatch(S.tid, md.id, patch);
    });
    S.modal = null; renderModal(); toast("Live score saved."); return;
  }
  if (act === "reopen") {
    const ok = await guard(() => recordResult(md.id, m.sa, m.sb, false));
    if (ok && ok.blocked) { md.blocked = ok.blocked; md.pending = { sa: m.sa, sb: m.sb, done: false }; renderModal(); return; }
    if (ok) { S.modal = null; renderModal(); toast("Match reopened."); }
  }
}

    const tp = ms.find(m => m.bracket === b.id && m.third);

    html += `<div class="panel stack" style="gap:6px"><h3>${esc(b.name)}</h3>${f?.done ? `<div><span class="eyebrow">Winner</span> <b>${esc(sideName(t, winnerSide(f)))}</b></div><div><span class="eyebrow">Runner-up</span> ${esc(sideName(t, loserSide(f)) || "")}</div>${tp?.done ? `<div><span class="eyebrow">Third</span> ${esc(sideName(t, winnerSide(tp)))}</div><div><span class="eyebrow">Fourth</span> ${esc(sideName(t, loserSide(tp)) || "")}</div>` : semis.length ? `<div><span class="eyebrow">Semi-finalists</span> ${semis.map(m => esc(sideName(t, loserSide(m)))).join(", ")}</div>` : ""}` : `<span class="muted">In progress. See Draw & results for the bracket.</span>`}</div>`;
  });
  if (sys === "swiss" || sys === "melee" || sys === "snake") {
    if (!ms.some(m => m.stage === sys)) html += `<div class="empty">Standings appear once round 1 is drawn.</div>`;
    else html += `<div class="panel">${standingsTable(t, overallTable(t, sys), { buch: sys !== "melee" })}</div><p class="small muted">${sys !== "melee" ? "Ranked by wins, then Buchholz (opponents' total wins), then fine Buchholz (their opponents' Buchholz), then points difference, then points scored. Anything still level is split by a lot drawn for each entry when it was added." : "Ranked by wins, then points difference, then points scored. Anything still level is split by a lot drawn for each entry when it was added."} Byes count as a ${t.byeScore[0]}–${t.byeScore[1]} win.</p>`;
  } else if (sys === "roundrobin") {
    if (!ms.length) html += `<div class="empty">Standings appear once the schedule is generated.</div>`;
    else html += `<div class="panel">${standingsTable(t, overallTable(t, "rr"))}</div><p class="small muted">Ranked by wins, then points difference, then points scored. Two teams still level are split by their game against each other, then by a lot drawn for each entry when it was added.</p>`;
  } else if (sys === "pools") {
    if (!(t.pools || []).length) html += `<div class="empty">Pool tables appear once pools are drawn.</div>`;
    else html += `<div class="pools">${t.pools.map(p => { const rk = poolRanking(t, p, ms); return `<div class="panel stack" style="gap:8px"><h3>${esc(p.name)}</h3>${standingsTable(t, rk.rows)}</div>`; }).join("")}</div>`;
  } else if (sys === "shooting") html += shootStandings(t);
  else if (!(t.brackets || []).length) html += `<div class="empty">Results appear once the bracket is drawn.</div>`;
  return html + `</div>`;
}

/* big screen */
function renderDisplay(t) {
  const ms = MS(); const live = ms.filter(m => !m.done && m.court);
  const waiting = ms.filter(m => mStatus(m) === "ready").sort(byOrder).slice(0, 8);
  const sys = sysOf(t);
  let table = "";
  if ((sys === "swiss" || sys === "melee" || sys === "snake") && ms.some(m => m.stage === sys)) table = standingsTable(t, overallTable(t, sys).slice(0, 12), { buch: sys !== "melee" });
  else if (sys === "roundrobin" && ms.length) table = standingsTable(t, overallTable(t, "rr").slice(0, 12));
  else if (sys === "shooting" && ms.length) table = shootStandings(t);
  const curRound = t.draws.filter(d => d.kind === "round").length;
  return `<div class="disp">
    <div class="spread"><div><div class="eyebrow">${esc(t.venue || "")}${t.venue ? " · " : ""}${esc(t.date || "")}</div><h2>${esc(t.name)}</h2></div>
      <div class="row">${(t.brackets || []).length ? `<span class="pill playing" style="font-size:15px;padding:4px 12px">Knockouts</span>` : curRound ? `<span class="pill playing" style="font-size:15px;padding:4px 12px">Round ${curRound}</span>` : ""}<button class="btn sm" data-act="fullscreen">Full screen</button></div></div>
    <div class="courts">${t.courts.filter(c => c.active !== false).map(c => { const m = live.find(x => x.court === c.id);
      return m ? `<div class="court"><div class="cn">${esc(c.name)}<span class="small muted" style="font-family:var(--body);font-size:12px;font-weight:600">${esc(matchContext(t, m))}</span></div>${["a", "b"].map(k => `<div class="side"><span class="nm">${esc(sideName(t, m[k]))}</span><span class="sc">${m["s" + k] ?? 0}</span></div>`).join("")}</div>`
        : `<div class="court free"><div class="cn">${esc(c.name)}</div><span class="muted">Free</span></div>`; }).join("")}</div>
    ${waiting.length ? `<section class="stack" style="gap:8px"><h3>Next up</h3><div class="mlist">${waiting.map(m => `<div class="match ro"><div class="meta"><span>${esc(matchContext(t, m))}</span></div><div class="side"><span class="nm">${esc(sideName(t, m.a))}</span></div><div class="side"><span class="nm">${esc(sideName(t, m.b))}</span></div></div>`).join("")}</div></section>` : ""}
    ${(t.brackets || []).map(b => `<section class="panel stack" style="gap:8px"><h3>${esc(b.name)}</h3>${bracketGrid(t, b, ms)}</section>`).join("")}
    ${table && !(t.brackets || []).length ? `<section class="panel stack" style="gap:8px"><h3>Standings</h3>${table}</section>` : ""}
  </div>`;
}

/* ---------------- events ---------------- */
document.addEventListener("click", async e => {
  const bz = e.target.closest('[data-act="bk-zoom"]');
  if (bz) {
    const key = S.tid + ":" + bz.dataset.b; const cur = bkZoomFor({ id: bz.dataset.b }); const z = bz.dataset.z;
    if (z === "fit") delete S.bkZoom[key]; else S.bkZoom[key] = z === "in" ? Math.min(1.5, +(cur + 0.1).toFixed(2)) : z === "out" ? Math.max(0.3, +(cur - 0.1).toFixed(2)) : 1;
    render();
    if (z === "fit") { const sc = document.querySelector(`[data-scroll-key="bk-${bz.dataset.b}"]`); if (sc) { sc.scrollLeft = 0; sc.scrollTop = 0; } }
    return;
  }
  const lg = e.target.closest("[data-lang]");
  if (lg) { I18N.lang = lg.dataset.lang; lsSet("carreau-lang", I18N.lang); document.documentElement.lang = I18N.lang; render(); if (S.modal) renderModal(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { S.tab = tab.dataset.tab; lsSet("carreau-tab", S.tab); render(); return; }
  const sc = e.target.closest("[data-shoot]");
  if (sc) { openMatch(sc.dataset.shoot); return; }
  const mc = e.target.closest("[data-match]");
  if (mc) { openMatch(mc.dataset.match); return; }
  const setb = e.target.closest("[data-set]");
  if (setb && canEdit() && setb.dataset.set === "plan-seeding") { const v = setb.dataset.val; await savePlan(pl => pl.seeding = v); return; }
  if (setb && canEdit()) { const t = clone(T()); t[setb.dataset.set] = setb.dataset.val; if (setb.dataset.set === "entry" && t.entry === "shooting") { t.system = "knockout"; t.shootFormat = t.shootFormat || "ko8"; t.format = "singles"; }
    if (setb.dataset.set === "entry" && t.entry === "melee") t.system = "swiss"; await guard(() => saveT(t)); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (a.closest("#modal") && S.modal) { if (act === "close-bg" && e.target !== a) return; modalAction(act, a.dataset.k, a); return; }
  const t = T();
  switch (act) {
    case "new-t": { const nt = newTournament(); if (S.decorateNew) S.decorateNew(nt); S.tid = nt.id; lsSet("carreau-tid", nt.id); S.tab = "entries"; S.matches = {}; await guard(() => saveT(nt)); S.onSelect?.(); watchMatches(); break; }
    case "del-t": S.confirmDelete = true; render(); break;
    case "del-t-no": S.confirmDelete = false; render(); break;
    case "del-t-yes": { S.confirmDelete = false; const id = t.id; delete S.tournaments[id]; S.tid = Object.keys(S.tournaments)[0] || null; S.matches = {}; watchMatches(); render(); await guard(() => S.store.deleteTournament(id)); S.onSelect?.(); toast("Competition deleted."); break; }
    case "first-draw": {
      const sys = sysOf(t);
      if (sys === "shooting") await guard(() => addDraw(drawShootQualifying(t)));
      else if (sys === "swiss") await guard(() => addDraw(drawSwissRound(t, MS())));
      else if (sys === "melee") await guard(() => addDraw(drawMeleeRound(t, MS())));
      else if (sys === "roundrobin") await guard(() => addDraw(genRoundRobin(t)));
      else if (sys === "snake") await guard(() => addDraw(genSnake(t)));
      else if (sys === "pools") await guard(() => addDraw(drawPools(t)));
      else if (sys === "knockout") { const ids = t.seeding === "entry" ? activeIds(t) : shuffle(activeIds(t)); await guard(() => addDraw(createBracket(t, "A", "Main knockout", ids, { third: t.koThird }))); }
      break;
    }
    case "shoot-next": await guard(() => addDraw((t.shootFormat || "ko8") === "final" ? drawShootFinal(t) : drawShootKnockout(t))); break;
    case "archive": S.confirmArchive = true; render(); break;
    case "archive-no": S.confirmArchive = false; render(); break;
    case "archive-yes": S.confirmArchive = false; await archiveCompetition(true); break;
    case "restore": await archiveCompetition(false); break;
    case "next-round": await guard(() => addDraw(isMelee(t) ? drawMeleeRound(t, MS()) : drawSwissRound(t, MS()))); break;
    case "undo": await guard(() => undoDraw(a.dataset.id)); break;
    case "assign": { const n = await guard(assignCourts); toast(n ? `${n} game(s) sent to pistes.` : "No free piste or no game ready."); render(); break; }
    case "start-kos": await guard(startKnockouts); break;
    case "plan-preset": { const pr = planPresets(t)[+a.dataset.i]; if (pr) await savePlan(pl => { const sil = pl.brackets.find(b => b.silver); pl.brackets = pr[1].map(([name, from, to], i) => ({ id: "ABCDEF"[i], name, from, to, third: !!pl.brackets[i]?.third })); if (sil) pl.brackets.push(sil); }); break; }
    case "plan-add": await savePlan(pl => { const others = pl.brackets.filter(b => !b.silver); const last = others[others.length - 1] || { from: 0, to: 0 }; const id = "ABCDEF".split("").find(x => !pl.brackets.some(b => b.id === x)); const span = last.to - last.from + 1; pl.brackets.push({ id, name: `${id} knockout`, from: last.to + 1, to: last.to + span, third: false }); }); break;
    case "plan-del": await savePlan(pl => pl.brackets.splice(+a.dataset.i, 1)); break;
    case "start-cons": {
      const losers = MS().filter(m => m.bracket === "A" && m.round === 1 && !m.bye && m.done).sort(byOrder).map(m => loserSide(m)[0]);
      await guard(() => addDraw(createBracket(t, "B", "Consolante", losers, { third: t.koThird }))); break;
    }
    case "checkin": { const nt = clone(t); const e2 = entities(nt).find(x => x.id === a.dataset.id); e2.checkedIn = !e2.checkedIn; e2.checkedInAt = e2.checkedIn ? Date.now() : null; await guard(() => saveT(nt)); break; }
    case "checkin-all": { const nt = clone(t); entities(nt).forEach(x => { if (x.active !== false && !x.checkedIn) { x.checkedIn = true; x.checkedInAt = Date.now(); } }); await guard(() => saveT(nt)); toast("Everyone is checked in."); break; }
    case "checkin-clear": { if (!S.confirmClear) { S.confirmClear = true; toast("Tap Clear check-ins again to confirm."); setTimeout(() => S.confirmClear = false, 4000); break; } S.confirmClear = false; const nt = clone(t); entities(nt).forEach(x => { x.checkedIn = false; x.checkedInAt = null; }); await guard(() => saveT(nt)); toast("Check-ins cleared."); break; }
    case "toggle-e": { const nt = clone(t); const e2 = entities(nt).find(x => x.id === a.dataset.id); e2.active = e2.active === false; await guard(() => saveT(nt)); break; }
    case "del-e": { const nt = clone(t); if (isIndiv(nt)) nt.players = nt.players.filter(x => x.id !== a.dataset.id); else nt.teams = nt.teams.filter(x => x.id !== a.dataset.id); await guard(() => saveT(nt)); break; }
    case "up": { const nt = clone(t); const arr = entities(nt); const i = arr.findIndex(x => x.id === a.dataset.id); if (i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; await guard(() => saveT(nt)); break; }
    case "fullscreen": { try { await document.documentElement.requestFullscreen(); } catch { toast("Full screen isn't available here."); } break; }
    case "export": exportCsv(); break;
    default: if (S.extraAction) await S.extraAction(act, a);
  }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "tpick") { S.tid = el.value; lsSet("carreau-tid", S.tid); S.matches = {}; S.onSelect?.(); watchMatches(); render(); return; }
  if (!canEdit() || !T()) return;
  if (el.closest("#modal")) return;
  if (S.extraChange && await S.extraChange(el)) return;
  if (el.dataset.plansilver !== undefined) { const on = el.checked; await savePlan(pl => { pl.brackets = pl.brackets.filter(b => !b.silver); if (on) pl.brackets.push({ id: "S", name: "Silver", silver: true, from: 1, to: 9999, third: false }); }); return; }
  if (el.dataset.plan) { const i = +el.dataset.i, f = el.dataset.plan; const v = f === "third" ? el.checked : f === "name" ? (el.value.trim() || "Knockout") : parseInt(el.value, 10); if (f !== "name" && f !== "third" && isNaN(v)) return; await savePlan(pl => pl.brackets[i][f] = v); return; }
  const t = clone(T());
  if (el.dataset.field) {
    let v = el.value; if (el.dataset.num !== undefined) { v = parseInt(v, 10); if (isNaN(v)) return; }
    const [k, idx] = el.dataset.field.split(".");
    if (idx !== undefined) t[k][+idx] = v; else t[k] = v;
  } else if (el.dataset.check) t[el.dataset.check] = el.checked;
  else if (el.dataset.courts !== undefined) {
    const n = Math.max(1, Math.min(200, parseInt(el.value, 10) || 1));
    while (t.courts.length < n) { const i = t.courts.length + 1; let id = "c" + i; while (t.courts.some(c => c.id === id)) id = "c" + uid(); t.courts.push({ id, name: String(i), active: true }); }
    const inUse = new Set(MS().filter(m => !m.done && m.court).map(m => m.court));
    while (t.courts.length > n && !inUse.has(t.courts[t.courts.length - 1].id)) t.courts.pop();
    if (t.courts.length > n) toast("Some pistes have games on them, so they weren't removed.");
  } else if (el.dataset.courtName !== undefined) t.courts[+el.dataset.courtName].name = el.value.trim() || String(+el.dataset.courtName + 1);
  else if (el.dataset.courtOn !== undefined) t.courts[+el.dataset.courtOn].active = el.checked;
  else if (el.dataset.list !== undefined) t[el.dataset.list] = el.value.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(x => x.includes("@"));
  else return;
  await guard(() => saveT(t));
  if (el.dataset.courtOn !== undefined || el.dataset.courts !== undefined) await guard(assignCourts);
});
document.addEventListener("input", e => {
  if (e.target.id !== "reg-search") return;
  S.regFilter = e.target.value; const q = S.regFilter.toLowerCase();
  document.querySelectorAll("[data-row]").forEach(r => r.hidden = !!q && !r.dataset.text.includes(q));
});
document.addEventListener("focusout", () => setTimeout(() => { if (S.pendingRender) render(); }, 0));
document.addEventListener("submit", async e => {
  e.preventDefault(); const t = clone(T()); if (!t) return;
  if (e.target.id === "add-form") {
    const hereNow = !!$("#add-here")?.checked; const ci = hereNow ? { checkedIn: true, checkedInAt: Date.now() } : {};
    if (isIndiv(t)) { const nm = $("#np-name").value.trim(); if (!nm) return; t.players.push(Object.assign({ id: "p" + uid(), name: nm, active: true }, ci)); }
    else {
      const ps = Array.from({ length: SIZE[t.format] }, (_, i) => $("#nt-p" + i).value.trim());
      const name = $("#nt-name").value.trim(); if (!name && !ps.some(Boolean)) { toast("Enter a team name or at least one player."); return; }
      t.teams.push(Object.assign({ id: "e" + uid(), name, players: ps, club: $("#nt-club").value.trim(), active: true }, ci));
    }
    e.target.reset(); if ($("#add-here")) $("#add-here").checked = hereNow; document.activeElement?.blur();
    await guard(() => saveT(t)); e.target.querySelector("input")?.focus?.();
  }
  if (e.target.id === "bulk-form") {
    const lines = $("#bulk").value.split(/\n/).map(s => s.trim()).filter(Boolean); if (!lines.length) return;
    lines.forEach(l => {
      if (isIndiv(t)) t.players.push({ id: "p" + uid(), name: l, active: true });
      else { let name = "", rest = l; const ci = l.indexOf(":"); if (ci > -1) { name = l.slice(0, ci).trim(); rest = l.slice(ci + 1); }
        const ps = rest.split(/[,;\/]/).map(s => s.trim()).filter(Boolean); t.teams.push({ id: "e" + uid(), name, players: ps, club: "", active: true }); }
    });
    $("#bulk").value = ""; document.activeElement?.blur();
    await guard(() => saveT(t)); toast(`${lines.length} added.`);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.modal) { S.modal = null; renderModal(); } });

async function exportCsv() {
  const t = T(); const rows = [["Stage", "Round", "Piste", isIndiv(t) ? "Side A" : "Team A", "Score A", "Score B", isIndiv(t) ? "Side B" : "Team B", "Status"]];
  MS().sort(byOrder).forEach(m => rows.push([matchContext(t, m), m.round, m.courtUsed || m.court ? courtName(t, m.courtUsed || m.court) : "", sideName(t, m.a) || "", m.sa ?? "", m.sb ?? "", m.bye ? "BYE" : sideName(t, m.b) || "", mStatus(m)]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  try { await S.downloads.save({ filename: `${t.name.replace(/[^\w\- ]+/g, "").trim() || "results"}.csv`, data: csv }); } catch (err) { if (err?.code !== "cancelled") toast("The file wasn't saved."); }
}

/* ---------------- boot ---------------- */
function watchMatches() {
  S.unsubM?.(); S.unsubM = null;
  if (!S.tid) return;
  const tid = S.tid;
  S.unsubM = S.store.watchMatches(tid, list => { if (S.tid !== tid) return; S.matches = {}; list.forEach(m => S.matches[m.id] = m); render(); }, err => console.error(err));
}
function startWatching() {
  S.store.watchTournaments(list => {
    S.tournaments = {}; list.filter(t => !t.archived || S.canSeeArchived()).forEach(t => S.tournaments[t.id] = t);
    S.loaded = true;
    if (!S.tid || !S.tournaments[S.tid]) { const first = list.sort((a, b) => (b.created || 0) - (a.created || 0))[0]; const changed = S.tid !== (first?.id || null); S.tid = first?.id || null; if (changed) { S.matches = {}; watchMatches(); } }
    if (T() && !canEdit() && (S.tab === "setup" || S.tab === "entries")) S.tab = canScore() ? "courts" : "draw";
    S.onTournaments?.();
    render();
  }, err => console.error(err));
  watchMatches();
}
/* @@BOOT-START */
async function boot() {
  let db = null, user = null;
  if (window.claude?.use) {
    try { [db, user, S.downloads] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("downloads")]); } catch {}
  }
  if (db) {
    S.store = dbStore(db);
    if (user) { try { const w = await user.can("data.write"); if (w === false) S.canWrite = false; } catch {} try { S.ownerViewer = await user.isOwner(); } catch {} }
    S.canSeeArchived = () => !!S.ownerViewer;
    if (!S.canWrite && !["draw", "standings", "display"].includes(S.tab)) S.tab = "draw";
  }
  startWatching();
}
render();
boot();
/* @@BOOT-END */
// expose internals for testing in local mode only
if (!window.claude || window.__testHook) window.__carreau = { S, genSnake, render, overrideAllowed, shootRanking, shotTotal, archiveCompetition, startWatching, watchMatches, toast, esc, clone, startKnockouts, savePlan, getPlan, drawSwissRound, drawMeleeRound, genRoundRobin, drawPools, createBracket, recordResult, addDraw, MS, T };
})();
</script>
