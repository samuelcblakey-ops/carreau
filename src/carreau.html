/* Layout: compact app bar + tab strip, one working column; courts and brackets as grids that wrap or scroll in place. */
:root{
  --bg:#eceeea; --surface:#ffffff; --surface-2:#f5f6f3; --ink:#1a2320; --muted:#5d6a64; --line:#d3d9d5;
  --accent:#1d6a54; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --jack:#d48d0b; --jack-ink:#8a5a00; --jack-soft:#fbefd6; --danger:#b3261e; --danger-soft:#f8e0de; --wire:#b9c3be;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a211e; --surface-2:#202825; --ink:#e5ebe8; --muted:#97a49e; --line:#2d3833;
  --accent:#5fc19d; --accent-ink:#0b1511; --accent-soft:#1f3a30;
  --jack:#f0b443; --jack-ink:#f0b443; --jack-soft:#3a2f17; --danger:#ef7a70; --danger-soft:#3d1f1d; --wire:#3e4b45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a211e; --surface-2:#202825; --ink:#e5ebe8; --muted:#97a49e; --line:#2d3833;
  --accent:#5fc19d; --accent-ink:#0b1511; --accent-soft:#1f3a30;
  --jack:#f0b443; --jack-ink:#f0b443; --jack-soft:#3a2f17; --danger:#ef7a70; --danger-soft:#3d1f1d; --wire:#3e4b45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1}.brand-name{white-space:nowrap}
.memorial{font-family:var(--body);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px;white-space:nowrap}
.site-foot{font-size:12px;color:var(--muted);text-align:center;padding:12px 16px 24px}.site-foot a{color:inherit}
.disp-memorial{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:8px}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.tsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.picker-wrap{position:relative}
.picker-btn{display:flex;align-items:center;gap:10px;max-width:320px;min-width:200px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.picker-btn .pb-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.picker-btn .pb-chev{color:var(--muted)}
.picker{position:absolute;z-index:40;top:calc(100% + 6px);right:0;width:min(440px,calc(100vw - 32px));max-height:min(70vh,560px);display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:0 12px 40px rgba(0,0,0,.18)}
.picker-list{overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.pick-group .eyebrow{padding:4px 6px}
.pick-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.pick-row:hover{background:var(--surface-2)}.pick-row.on{background:var(--accent-soft)}
.pick-row .pr-main{flex:1;min-width:0;display:flex;flex-direction:column}.pick-row .pr-main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-row .pr-tick{color:var(--accent);font-weight:700}
@media (max-width:560px){.picker-wrap{flex:1 1 100%}.picker-btn{max-width:none;width:100%}.picker{left:0;right:auto;width:calc(100vw - 32px)}}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .t-ic,nav.tabs .t-short{display:none}
/* ---------- phones ---------- */
@media (max-width:640px){
  input,select,textarea{font-size:16px} /* stops iPhone zooming in on tap */
  .bar{gap:8px;padding-block:10px}
  .brand{font-size:20px}.brand small{font-size:10.5px}
  .tsel{width:100%;flex-wrap:nowrap}.tsel .picker-wrap{flex:1 1 auto;min-width:0}.picker-btn{min-width:0}
  .tsel .pill,.hide-sm{display:none}
  .new-t{font-size:20px;padding:6px 12px;line-height:1}
  nav.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;gap:0;background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  nav.tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-bottom:0;border-radius:10px;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:0}
  nav.tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
  nav.tabs .t-ic,nav.tabs .t-short{display:block}nav.tabs .t-long{display:none}
  main{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .site-foot{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  body .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  main .seg{display:flex;width:100%}main .seg button{flex:1 1 auto;padding:9px 10px}
  header .seg{flex:none;flex-wrap:nowrap}header .seg button{padding:7px 10px}
  .btn{min-height:40px}.btn.sm{min-height:34px}
  h2{font-size:23px}
}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:26px}
h3{font-size:19px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.rp-live{border-color:var(--danger);background:var(--danger-soft);box-shadow:inset 0 0 0 1px var(--danger)}
.panel.rp-ready{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.rp-state{font-weight:600}.rp-live .rp-state{color:var(--danger)}.rp-ready .rp-state{color:var(--accent)}
.btn.wait:disabled{opacity:.7;color:var(--danger);border-color:var(--danger);background:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.ghost{background:none;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f>span{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
/* date boxes: iPhone Safari gives native date inputs their own width, which pushed them past the panel edge */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:40px;line-height:1.3;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-datetime-edit{padding:0}
label.f,.fields>*{min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.seg{display:inline-flex;align-self:flex-start;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface-2);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.playing{background:var(--jack-soft);color:var(--jack-ink)}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.ready{background:var(--surface-2);color:var(--ink);border:1px dashed var(--line)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.notice{padding:10px 14px;border-radius:8px;background:var(--jack-soft);color:var(--ink);font-size:14px}
.notice.example{background:var(--accent-soft)}
/* matches */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;cursor:pointer;min-width:0}
.match:hover{border-color:var(--muted)}
.match.ro{cursor:default}
.match.playing{border-color:var(--jack);box-shadow:inset 3px 0 0 var(--jack)}
.match .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.side{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.side .nm{min-width:0;overflow-wrap:anywhere;font-weight:500}
.side.win .nm{font-weight:700}
.side .sc{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.side.win .sc{color:var(--accent)}
.side.lose .sc{color:var(--muted)}
.court-tag{font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink);letter-spacing:.03em}
.tbd{color:var(--muted);font-style:italic}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:160px}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.rank{font-family:var(--display);font-weight:700;font-size:17px}
/* courts */
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.court{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.court .cn{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;display:flex;justify-content:space-between;align-items:center}
.court.free{background:var(--surface-2);border-style:dashed}
.court.off{opacity:.5}
/* bracket */
/* bracket: every round column is the same height and each match sits in an equal share of it,
   so a match always lines up halfway between the two games that feed it; wires are drawn with borders */
.bk-scroll{overflow:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;max-width:100%}
.bk-tools{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bk-tools .btn{min-width:36px;justify-content:center}
.bk-tools .zv{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:4ch;text-align:center}
.bk{--gap:40px;display:grid;grid-auto-columns:minmax(200px,230px);grid-template-rows:auto 1fr;column-gap:var(--gap);width:max-content;min-width:100%}
.bk h4{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;grid-row:1}
.bk-col{grid-row:2;display:flex;flex-direction:column}
.bk-pair{flex:1;display:flex;flex-direction:column;position:relative}
.bk-slot{flex:1;display:flex;align-items:center;position:relative;padding-block:5px}
.bk-slot>*{width:100%}
.bk-col.out .bk-slot::after{content:"";position:absolute;right:calc(var(--gap) / -2);width:calc(var(--gap) / 2);top:50%;border-top:2px solid var(--wire)}
.bk-col.out .bk-pair::after{content:"";position:absolute;right:calc(var(--gap) / -2);top:25%;bottom:25%;border-right:2px solid var(--wire)}
.bk-col.in .bk-slot::before{content:"";position:absolute;left:calc(var(--gap) / -2);width:calc(var(--gap) / 2);top:50%;border-top:2px solid var(--wire)}
.bk-col.out .bk-slot.done::after{border-color:var(--accent)}
.bkm{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:left;padding:0;cursor:pointer;font-size:14px}
.bkm.ro{cursor:default}
button.bkm:hover{border-color:var(--muted)}
.bkm.playing{border-color:var(--jack);box-shadow:inset 3px 0 0 var(--jack)}
.bkm.bye{opacity:.6;background:var(--surface-2);border-style:dashed}
.bkm-row{display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:34px}
.bkm-row+.bkm-row{border-top:1px solid var(--line)}
.bkm-row .sd{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.6ch;text-align:right}

róneo, cámbialo y pulsa Actualizar resultado. Si cambia el ganador y ya se jugó una partida posterior, se te pedirá confirmar el forzado.","To correct a wrong score, change it and press Update result. If the winner changes and a later game has already been played, you'll be asked to confirm an override (only possible for the current and previous round).":"Para corregir un resultado erróneo, cámbialo y pulsa Actualizar resultado. Si cambia el ganador y ya se jugó una partida posterior, se te pedirá confirmar el forzado (solo posible para la ronda actual y la anterior).","Only the current and previous round can be corrected.":"Solo se pueden corregir la ronda actual y la anterior.","This result has already moved two rounds on, so it can't be corrected here.":"Este resultado ya ha avanzado dos rondas, así que no se puede corregir aquí.","Fit":"Ajustar","Zoom in":"Acercar","Zoom out":"Alejar","Open testing":"Prueba abierta","Admin back end":"Panel de administración","Back to competitions":"Volver a los torneos","Open testing is on: everyone who opens a competition can run it, including registration, setup, draws and scores. Spectator and organiser links are switched off while it's on.":"La prueba abierta está activada: cualquiera que abra un torneo puede gestionarlo, incluidas inscripciones, ajustes, sorteos y resultados. Los enlaces de espectador y organizador están desactivados mientras tanto.","Link to this competition":"Enlace a este torneo","Anyone with this link can run this competition while open testing is on.":"Cualquiera con este enlace puede gestionar este torneo mientras la prueba abierta esté activada.","Everyone can run every competition (beta testing). Spectator and organiser links are switched off.":"Todos pueden gestionar todos los torneos (prueba beta). Los enlaces de espectador y organizador están desactivados.","Off: spectators see the draw, results, standings and big screen; organisers use their organiser link or code.":"Desactivada: los espectadore → tabellone","Pools → knockout":"Gironi → eliminazione","Knockout":"Eliminazione diretta","Round robin":"Girone all'italiana","Round robin schedule":"Calendario all'italiana","Pools":"Gironi","Competition name":"Nome della gara","Date":"Data","Venue":"Luogo","Club or boulodrome":"Club o bocciodromo","Format locked after the first draw":"Formula bloccata dopo il primo sorteggio","Entries":"Iscritti","Entry type":"Tipo di iscrizione","Format":"Formula","Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.":"I giocatori si iscrivono singolarmente. A ogni turno si sorteggiano nuove squadre, mescolando coppie e terne se i numeri non tornano, evitando se possibile gli stessi compagni. La classifica è individuale.","Points to win":"Punti per vincere","Bye counts as":"Il riposo vale","Competition system":"Sistema di gara","Mêlée competitions play a set number of rounds.":"Le gare a mêlée si giocano su un numero fisso di turni.","Planned rounds":"Turni previsti","Rounds":"Turni","Round {n} is random. After that, teams on the same number of wins play each other and rematches are avoided. Ties are split by points difference, then Buchholz (opponents' wins).":"Il turno {1} è sorteggiato. Poi si affrontano le squadre con lo stesso numero di vittorie, evitando rivincite. Le parità si risolvono con la differenza punti, poi il Buchholz (vittorie degli avversari).","Rounds are drawn one at a time once the previous round is finished.":"I turni si sorteggiano uno alla volta, finito il precedente.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice ({n} teams allow up to {n} rounds). With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"Le squadre formano due file. A ogni turno una fila avanza di un posto: la squadra {1} gioca con chi ha appena affrontato la squadra {2}, la squadra {3} con chi ha appena affrontato la squadra {4}, e così via. Tutti i turni si sorteggiano insieme e nessuno incontra due volte la stessa squadra ({5} squadre consentono fino a {6} turni). Con un numero dispari di squadre, una riposa a ogni turno e ottiene il riposo. Classifica come nello svizzero: vittorie, differenza punti, Buchholz, Buchholz fine.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"Le squadre formano due file. A ogni turno una fila avanza di un posto: la squadra {1} gioca con chi ha appena affrontato la squadra {2}, la squadra {3} con chi ha appena affrontato la squadra {4}, e così via. Tutti i turni si sorteggiano insieme e nessuno incontra due volte la stessa squadra. Con un numero dispari di squadre, una riposa a ogni turno e ottiene il riposo. Classifica come nello svizzero: vittorie, differenza punti, Buchholz, Buchholz fine.","Pool size":"Dimensione gironi","Pool games":"Partite di girone","French poule ({n} wins qualify)":"Girone alla francese ({1} vittorie qualificano)","French poules need {n} teams: game {n} is drawn, then winners play winners and losers play losers, and a barrage decides second place. Pools of other sizes play round robin.":"I gironi alla francese sono da {1} squadre: la partita {2} è sorteggiata, poi vincenti contro vincenti e perdenti contro perdenti, e uno spareggio decide il secondo posto. I gironi di altre dimensioni si giocano all'italiana.","First-round losers play a consolante":"I perdenti del primo turno giocano una consolazione","Third-place play-off":"Finale 3°/4° posto","Seeding":"Teste di serie","Random draw":"Sorteggio libero","Entry order is seeding":"L'ordine di iscrizione decide le teste di serie","Afternoon knockouts":"Tabelloni del pomeriggio","Afternoon":"Pomeriggio","Knockouts":"Tabelloni","What happens after the Swiss rounds. You can change this any time before the knockouts are drawn.":"Cosa segue ai turni a sistema svizzero. Modificabile fino al sorteggio dei tabelloni.","What happens after the pools. You can change this any time before the knockouts are drawn.":"Cosa segue ai gironi. Modificabile fino al sorteggio dei tabelloni.","What happens after the round robin. You can change this any time before the knockouts are drawn.":"Cosa segue al girone all'italiana. Modificabile fino al sorteggio dei tabelloni.","What happens after the snake rounds. You can change this any time before the knockouts are drawn.":"Cosa segue ai turni a serpentina. Modificabile fino al sorteggio dei tabelloni.","Quick set-ups":"Formule rapide","Draw for the knockouts":"Sorteggio dei tabelloni","Seeded by standings ({n} v {n}, {n} v {n}…)":"Secondo classifica ({1} contro {2}, {3} contro {4}…)","Seeded (pool winners kept apart)":"Teste di serie (primi dei gironi separati)","Random draw (tirage au sort)":"Sorteggio integrale","Knockout name":"Nome del tabellone","Ranks":"Posizioni","Pool places":"Posizioni nel girone","3rd-place game":"Finale 3°/4° posto","From":"Da","To":"A","to":"a","Remove knockout":"Rimuovi tabellone","+ Add another knockout":"+ Aggiungi un tabellone","Every place from {n} down":"Tutte le posizioni dalla {1}ª","Everyone from {n} down":"Tutti dal {1}° in giù","Silver competition":"Gara Silver","everyone who doesn't make the {x} plays their own knockout":"chi non entra nel {1} gioca un proprio tabellone","starts at final":"parte dalla finale","starts at semi-finals":"parte dalle semifinali","starts at quarter-finals":"parte dai quarti ,"Shooters enter individually. Tir de précision to FIPJP rules: 5 ateliers (lone boule, boule behind the jack, boule between two boules, boule behind an obstacle, the jack), each shot from 6, 7, 8 and 9 m. Every shot scores 0, 1, 3 or 5, so a scorecard is out of 100.":"I tiratori si iscrivono singolarmente. Tiro di precisione secondo regolamento FIPJP: 5 atelier (boccia sola, boccia dietro il pallino, boccia tra due bocce, boccia dietro un ostacolo, il pallino), ognuno tirato da 6, 7, 8 e 9 m. Ogni tiro vale 0, 1, 3 o 5, quindi un cartellino vale al massimo 100.","Qualifying → top 8 knockout":"Qualificazione → tabellone a 8","Qualifying → top 16 knockout":"Qualificazione → tabellone a 16","Qualifying → final":"Qualificazione → finale","Shooters in the final":"Tiratori in finale","Everyone shoots a qualifying scorecard. The top shooters then shoot a final scorecard, and the highest final score wins.":"Tutti tirano un cartellino di qualificazione. I migliori tirano poi un cartellino di finale, e vince il punteggio di finale più alto.","Everyone shoots a qualifying scorecard. The top {n} go into a knockout (1st v {n}th, and so on). Each knockout game is a duel: both shooters shoot a full scorecard and the higher total goes through.":"Tutti tirano un cartellino di qualificazione. I primi {1} entrano in un tabellone (1° contro {2}°, ecc.). Ogni incontro è un duello: entrambi tirano un cartellino completo e passa il totale più alto.","Third-place duel":"Duello per il 3° posto","Shooting order":"Ordine di tiro","Entry order":"Ordine di iscrizione","Archive competition":"Archivia gara","Archived":"Archiviata","Archive…":"Archivia…","Archive":"Archivia","Restore":"Ripristina","Competition restored.":"Gara ripristinata.","Only the site admin can see this competition. Restore it to make it visible again.":"Solo l'amministratore del sito può vedere questa gara. Ripristinala per renderla di nuovo visibile.","Once the competition has finished, archive it to hide it from everyone except the site admin.":"Finita la gara, archiviala per nasconderla a tutti tranne all'amministratore del sito.","Once the competition has finished, archive it to hide it from everyone except the site admin. Some games aren't finished yet.":"Finita la gara, archiviala per nasconderla a tutti tranne all'amministratore del sito. Alcune partite non sono ancora finite.","Archive “{x}”? Only the admin will be able to see it.":"Archiviare “{1}”? Solo l'amministratore potrà vederla.","Competition archived. Only the admin can see it now.":"Gara archiviata. Ora solo l'amministratore può vederla.","Competition archived. Only the site admin can see it now.":"Gara archiviata. Ora solo l'amministratore del sito può vederla.","Archived. Only the site admin can see this competition.":"Archiviata. Solo l'amministratore del sito può vedere questa gara.","{x} (archived)":"{1} (archiviata)","This correction changes who went through.":"Questa correzione cambia chi è passato.","These later games were already played and will be reset so they can be replayed or re-entered:":"Queste partite successive sono già state giocate e verranno azzerate per essere rigiocate o reinserite:","Override and reset these games":"Forza e azzera queste partite","Cancel":"Annulla","Ask the organiser to make this correction.":"Chiedi all'organizzatore di fare questa correzione.","Result corrected and later games reset.":"Risultato corretto e partite successive azzerate.","Corrected":"Corretto","Corrected (was {n}–{n}).":"Corretto (era {1}–{2}).","To correct a wrong score, change it and press Update result. If the winner changes and a later game has already been played, you'll be asked to confirm an override.":"Per correggere un punteggio sbagliato, modificalo e premi Aggiorna risultato. Se cambia il vincitore e una partita successiva è già stata giocata, ti verrà chiesto di confermare la forzatura.","To correct a wrong score, change it and press Update result. If the winner changes and a later game has already been played, you'll be asked to confirm an override (only possible for the current and previous round).":"Per correggere un punteggio sbagliato, modificalo e premi Aggiorna risultato. Se cambia il vincitore e una partita successiva è già stata giocata, ti verrà chiesto di confermare la forzatura (possibile solo per il turno attuale e il precedente).","Only the current and previous round can be corrected.":"Si possono correggere solo il turno attuale e il precedente.","This result has already moved two rounds on, so it can't be corrected here.":"Questo risultato è già avanzato di due turni, quindi non si può correggere qui.","Fit":"Adatta","Zoom in":"Ingrandisci","Zoom out":"Riduci","Open testing":"Test aperto","Admin back end":"Pannello di amministrazione","Back to competitions":"Torna alle gare","Open testing is on: everyone who opens a competition can run it, including registration, setup, draws and scores. Spectator and organiser links are switched off while it's on.":"Il test aperto è attivo: chiunque apra una gara può gestirla, comprese iscrizioni, impostazioni, sorteggi e punteggi. I link spettatore e organizzatore sono disattivati nel frattempo.","Link to this competition":"Link a questa gara","Anyone with this link can run this competition while open testing is on.":"Chiunque abbia questo link può gestire questa gara finché il test aperto è attivo.","Everyone can run every competition (beta testing). Spectator and organiser links are switched off.":"Tutti possono gestire tutte le gare (beta test). I link spettatore e organizzatore sono disattivati.","Off: spectators see the draw, results, standings and big screen; organisers use their organiser link or code.":"Disattivato: gli spettatori vedono sorteggio, risultati, classifica e maxischermo; gli organizzatori usano il loro link o codice organizzatore.","Turn open testing off":"Disattiva il test aperto","Turn open testing on":"Attiva il test aperto","Open testing is on.":"Test aperto attivo.","Open testing is off.":"Test aperto disattivato.","Sign in with the admin Google account to change site settings.":"Accedi con l'account Google admin per modificare le impostazioni del sito.","Sign in with Google":"Accedi con Google","Signed in as {x}":"Accesso come {1}","Competitions":"Gare","Test mode":"Modalità test","That setting didn't save.":"L'impostazione non è stata salvata.","Admin":"Admin","Admin sign in":"Accesso admin","Sign out":"Esci","Signed out.":"Disconnesso.","Signed in as admin.":"Accesso come admin.","Admin: {x}":"Admin: {1}","That Google account isn't an admin for this site.":"Quell'account Google non è amministratore di questo sito.","Sign-in didn't complete. Allow pop-ups for this site and try again.":"Accesso non completato. Consenti i pop-up per questo sito e riprova.","That code didn't work. Check it with the organiser.":"Quel codice non funziona. Verificalo con l'organizzatore.","You're now an organiser for this competition.":"Ora sei organizzatore di questa gara.","You can now enter scores for this competition.":"Ora puoi inserire i punteggi di questa gara.","Couldn't connect. Check your internet connection and reload.":"Connessione non riuscita. Controlla la connessione internet e ricarica.","Firebase isn't set up yet, so this is saving on this device only.":"Firebase non è ancora configurato, quindi si salva solo su questo dispositivo.","Scorers open this once on their phone and can then enter scores and move games between pistes. Scorer code":"I segnapunti lo aprono una volta sul telefono, poi possono inserire punteggi e spostare partite tra i campi. Codice segnapunti","Gives full control, including registration, setup, draws and scores. Keep it to your organising team, and keep a copy for yourself in case you change device. Organiser code":"Dà il controllo totale: iscrizioni, impostazioni, sorteggi e punteggi. Riservalo al tuo staff organizzativo e tienine una copia nel caso cambi dispositivo. Codice organizzatore","Last {n}":"Turno dei {1}","Last   "de": {"In loving memory of Steve Noel":"In liebevoller Erinnerung an Steve Noel","SN Pétanque · In loving memory of Steve Noel":"SN Pétanque · In liebevoller Erinnerung an Steve Noel","Competition desk":"Turnierleitung","+ New competition":"+ Neues Turnier","New competition":"Neues Turnier","Competition":"Turnier","Sections":"Bereiche","This device only":"Nur dieses Gerät","Saved in this browser only":"Nur in diesem Browser gespeichert","Registration":"Anmeldung","Setup":"Einstellungen","Draw & results":"Auslosung & Ergebnisse","Pistes":"Bahnen","Standings":"Tabelle","Big screen":"Großbildschirm","Loading competitions…":"Turniere werden geladen…","No competitions yet":"Noch keine Turniere","Set up a competition, add teams or players, then draw rounds, pools or a knockout. Pistes are allocated as games finish and scores go live for everyone with the link.":"Lege ein Turnier an, füge Teams oder Spieler hinzu und lose dann Runden, Gruppen oder eine KO-Runde aus. Bahnen werden vergeben, sobald Spiele enden, und die Ergebnisse sind für alle mit dem Link live zu sehen.","Create a competition":"Turnier anlegen","The organiser hasn't created a competition yet.":"Der Organisator hat noch kein Turnier angelegt.","This is an example competition with made-up teams, so you can see how everything works. Create your own from the menu above, then delete this one in Setup.":"Dies ist ein Beispielturnier mit erfundenen Teams, damit du siehst, wie alles funktioniert. Lege über das Menü oben dein eigenes an und lösche dieses dann in den Einstellungen.","Close":"Schließen","Delete":"Löschen","Delete…":"Löschen…","Keep it":"Behalten","Remove":"Entfernen","Add":"Hinzufügen","Copy":"Kopieren","Join":"Beitreten","Singles":"Tête-à-tête","Doubles":"Doublette","Triples":"Triplette","Singles (tête-à-tête)":"Tête-à-tête","Fixed teams":"Feste Teams","Mêlée (random teams)":"Mêlée (zugeloste Teams)","Mêlée":"Mêlée","Mêlée rounds":"Mêlée-Runden","Swiss":"Schweizer","Swiss rounds":"Schweizer System","Snake":"Schlange","Snake rounds":"Schlangen-Runden","Pools → KO":"Gruppen → KO","Pools → knockout":"Gruppen → KO-Runde","Knockout":"KO-System","Round robin":"Jeder gegen jeden","Round robin schedule":"Spielplan jeder gegen jeden","Pools":"Gruppen","Competition name":"Turniername","Date":"Datum","Venue":"Ort","Club or boulodrome":"Verein oder Boulodrome","Format locked after the first draw":"Format nach der ersten Auslosung gesperrt","Entries":"Meldungen","Entry type":"Meldeart","Format":"Format","Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.":"Spieler melden sich einzeln. Jede Runde werden neue Teams zugelost – bei ungerader Zahl gemischt aus Doubletten und Tripletten –, und wiederholte Partner werden möglichst vermieden. Gewertet wird jeder Spieler einzeln.","Points to win":"Punkte zum Sieg","Bye counts as":"Freilos zählt als","Competition system":"Turniersystem","Mêlée competitions play a set number of rounds.":"Mêlée-Turniere spielen eine feste Anzahl Runden.","Planned rounds":"Geplante Runden","Rounds":"Runden","Round {n} is random. After that, teams on the same number of wins play each other and rematches are avoided. Ties are split by points difference, then Buchholz (opponents' wins).":"Runde {1} wird zugelost. Danach spielen Teams mit gleich vielen Siegen gegeneinander, Wiederholungen werden vermieden. Bei Gleichstand entscheidet die Punktdifferenz, dann Buchholz (Siege der Gegner).","Rounds are drawn one at a time once the previous round is finished.":"Runden werden einzeln ausgelost, sobald die vorige Runde beendet ist.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice ({n} teams allow up to {n} rounds). With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"Die Teams stehen in zwei Reihen. Jede Runde rückt eine Reihe einen Platz weiter: Team {1} spielt gegen den letzten Gegner von Team {2}, Team {3} gegen den von Team {4} usw. Alle Runden werden auf einmal ausgelost, niemand trifft zweimal auf dasselbe Team ({5} Teams erlauben bis zu {6} Runden). Bei ungerader Teamzahl setzt jede Runde ein Team aus und erhält ein Freilos. Wertung wie im Schweizer System: Siege, Punktdifferenz, Buchholz, Fein-Buchholz.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"Die Teams stehen in zwei Reihen. Jede Runde rückt eine Reihe einen Platz weiter: Team {1} spielt gegen den letzten Gegner von Team {2}, Team {3} gegen den von Team {4} usw. Alle Runden werden auf einmal ausgelost, niemand trifft zweimal auf dasselbe Team. Bei ungerader Teamzahl setzt jede Runde ein Team aus und erhält ein Freilos. Wertung wie im Schweizer System: Siege, Punktdifferenz, Buchholz, Fein-Buchholz.","Pool size":"Gruppengröße","Pool games":"Gruppenspiele","French poule ({n} wins qualify)":"Französische Poule ({1} Siege qualifizieren)","French poules need {n} teams: game {n} is drawn, then winners play winners and losers play losers, and a barrage decides second place. Pools of other sizes play round robin.":"Französische Poules brauchen {1} Teams: Spiel {2} wird ausgelost, dann spielen Sieger gegen Sieger und Verlierer gegen Verlierer, und eine Barrage entscheidet Platz zwei. Gruppen anderer Größe spielen jeder gegen jeden.","First-round losers play a consolante":"Verlierer der ersten Runde spielen eine Consolante","Third-place play-off":"Spiel um Platz 3","Seeding":"Setzliste","Random draw":"Freie Auslosung","Entry order is seeding":"Meldereihenfolge = Setzliste","Afternoon knockouts":"KO-Runden am Nachmittag","Afternoon":"Nachmittag","Knockouts":"KO-Runden","What happens after the Swiss rounds. You can change this any time before the knockouts are drawn.":"Was nach den Schweizer Runden folgt. Bis zur Auslosung der KO-Runden jederzeit änderbar.","What happens after the pools. You can change this any time before the knockouts are drawn.":"Was nach den Gruppen folgt. Bis zur Auslosung der KO-Runden jederzeit änderbar.","What happens after the round robin. You can change this any time before the knockouts are drawn.":"Was nach jeder gegen jeden folgt. Bis zur Auslosung der KO-Runden jederzeit änderbar.","What happens after the snake rounds. You can change this any time before the knockouts are drawn.":"Was nach den Schlangen-Runden folgt. Bis zur Auslosung der KO-Runden jederzeit änderbar.","Quick set-ups":"Schnellvorlagen","Draw for the knockouts":"Auslosung der KO-Runden","Seeded by standings ({n} v {n}, {n} v {n}…)":"Nach Tabelle gesetzt ({1} gg. {2}, {3} gg. {4}…)","Seeded (pool winners kept apart)":"Gesetzt (Gruppensieger getrennt)","Random draw (tirage au sort)":"Freie Auslosung (tirage au sort)","Knockout name":"Name der KO-Runde","Ranks":"Plätze","Pool places":"Gruppenplätze","3rd-place game":"Spiel um Platz 3","From":"Von","To":"Bis","to":"bis","Remove knockout":"KO-Runde entfernen","+ Add another knockout":"+ Weitere KO-Runde","Every place from {n} down":"Alle Plätze ab {1}","Everyone from {n} down":"Alle ab Platz {1}","Silver competition":"Silver-Turnier","everyone who doesn't make the {x} plays their own knockout":"wer nicht ins {1} kommt, spielt eine eigene KO-Runde","starts at final":"beginnt mit dem Finale","starts at semi-finals":"beginnt mit dem Halbfinale","starts at quarter-finals":"beginnt mit dem Viertelfinale","starts at last {n}":"beginnt mit der Runde ualifikation → Finale (beste {1})","Precision shooting · Qualifying → top {n} knockout":"Präzisionsschießen · Qualifikation → KO der besten {1}","{n} shooters checked in":"{1} Schießer eingecheckt","{n} shooters entered":"{1} Schießer gemeldet","Check in at least 2 shooters on Registration first.":"Checke zuerst mindestens 2 Schießer unter Anmeldung ein.","Add at least 2 shooters on Registration first.":"Füge zuerst mindestens 2 Schießer unter Anmeldung hinzu.","Start the qualifying round":"Qualifikation starten","Waiting for the organiser to start.":"Warten auf den Start durch den Organisator.","{n}/{n} scorecards":"{1}/{2} Bögen","Shooter":"Schießer","Continue":"Weiter","Done":"Fertig","Shooting":"Schießt","Final for the top {n}":"Finale der besten {1}","Knockout for the top {n}":"KO-Runde der besten {1}","Start the final":"Finale starten","Draw the knockout":"KO-Runde auslosen","Available once every qualifying scorecard is finished":"Verfügbar, sobald alle Qualifikationsbögen fertig sind","Qualifying round":"Qualifikation","Shooting knockout (top {n})":"Schieß-KO (beste {1})","Standings appear once the qualifying round starts.":"Die Tabelle erscheint, sobald die Qualifikation beginnt.","Qualifying round. A1 lone boule, A2 boule behind the jack, A3 boule between two boules, A4 boule behind an obstacle, A5 the jack. Shooters on the same total are listed in entry order.":"Qualifikation. A1 einzelne Kugel, A2 Kugel hinter der Sau, A3 Kugel zwischen zwei Kugeln, A4 Kugel hinter Hindernis, A5 die Sau. Schießer mit gleicher Summe stehen in Meldereihenfolge.","Shooters enter individually. Tir de précision to FIPJP rules: 5 ateliers (lone boule, boule behind the jack, boule between two boules, boule behind an obstacle, the jack), each shot from 6, 7, 8 and 9 m. Every shot scores 0, 1, 3 or 5, so a scorecard is out of 100.":"Schießer melden sich einzeln. Präzisionsschießen nach FIPJP-Regeln: 5 Ateliers (einzelne Kugel, Kugel hinter der Sau, Kugel zwischen zwei Kugeln, Kugel hinter Hindernis, die Sau), je ein Schuss aus 6, 7, 8 und 9 m. Jeder Schuss zählt 0, 1, 3 oder 5, maximal also 100 pro Bogen.","Qualifying → top 8 knockout":"Qualifikation → KO der besten 8","Qualifying → top 16 knockout":"Qualifikation → KO der besten 16","Qualifying → final":"Qualifikation → Finale","Shooters in the final":"Schießer im Finale","Everyone shoots a qualifying scorecard. The top shooters then shoot a final scorecard, and the highest final score wins.":"Alle schießen einen Qualifikationsbogen. Die Besten schießen dann einen Finalbogen, die höchste Finalsumme gewinnt.","Everyone shoots a qualifying scorecard. The top {n} go into a knockout (1st v {n}th, and so on). Each knockout game is a duel: both shooters shoot a full scorecard and the higher total goes through.":"Alle schießen einen Qualifikationsbogen. Die besten {1} kommen in eine KO-Runde (1. gg. {2}. usw.). Jedes KO-Spiel ist ein Duell: Beide schießen einen vollen Bogen, die höhere Summe kommt weiter.","Third-place duel":"Duell um Platz 3","Shooting order":"Schießreihenfolge","Entry order":"Meldereihenfolge","Archive competition":"Turnier archivieren","Archived":"Archiviert","Archive…":"Archivieren…","Archive":"Archivieren","Restore":"Wiederherstellen","Competition restored.":"Turnier wiederhergestellt.","Only the site admin can see this competition. Restore it to make it visible again.":"Nur der Site-Admin sieht dieses Turnier. Stelle es wieder her, um es sichtbar zu machen.","Once the competition has finished, archive it to hide it from everyone except the site admin.":"Ist das Turnier beendet, archiviere es, um es vor allen außer dem Site-Admin zu verbergen.","Once the competition has finished, archive it to hide it from everyone except the site admin. Some games aren't finished yet.":"Ist das Turnier beendet, archiviere es, um es vor allen außer dem Site-Admin zu verbergen. Einige Spiele sind noch nicht beendet.","Archive “{x}”? Only the admin will be able to see it.":"„{1}“ archivieren? Nur der Admin kann es dann sehen.","Competition archived. Only the admin can see it now.":"Turnier archiviert. Nur der Admin kann es jetzt sehen.","Competition archived. Only the site admin can see it now.":"Turnier archiviert. Nur der Site-Admin kann es jetzt sehen.","Archived. Only the site admin can see this competition.":"Archiviert. Nur der Site-Admin sieht dieses Turnier.","{x} (archived)":"{1} (archiviert)","This correction changes who went through.":"Diese Korrektur ändert, wer weiterkommt.","These later games were already played and will be reset so they can be replayed or re-entered:":"Diese späteren Spiele wurden schon gespielt und werden zurückgesetzt, damit sie neu gespielt oder eingetragen werden können:","Override and reset these games":"Überschreiben und Spiele zurücksetzen","Cancel":"Abbrechen","Ask the organiser to make this correction.":"Bitte den Organisator, diese Korrektur vorzunehmen.","Result corrected and later games reset.":"Ergebnis korrigiert, spätere Spiele zurückgesetzt.","Corrected":"Korrigiert","Corrected (was {n}–{n}).":"Korrigiert (vorher {1}–{2}).","To correct a wrong score, change it and press Update result. If the winner changes and a later game has already been played, you'll be asked to confirm an override.":"Um ein falsches Ergebnis zu korrigieren, ändere es und tippe auf Ergebnis ändern. Ändert sich der Sieger und wurde ein späteres Spiel schon gespielt, musst du das Überschreiben bestätigen.","To correct a wrong score, change it and press Update result. If the winner changes and a later game has already been played, you'll be asked to confirm an override (only possible for the current and previous round).":"Um ein falsches Ergebnis zu korrigieren, ändere es und tippe auf Ergebnis ändern. Ändert sich der Sieger und wurde ein späteres Spiel schon gespielt, musst du das Überschreiben bestätigen (nur für die aktuelle und vorige Runde möglich).","Only the current and previous round can be corrected.":"Nur die aktuelle und die vorige Runde können korrigiert werden.","This result has already moved two rounds on, so it can't be corrected here.":"Dieses Ergebnis ist schon zwei Runden weiter, daher kann es hier nicht korrigiert werden.","Fit":"Einpassen","Zoom in":"Vergrößern","Zoom out":"Verkleinern","Open testing":"Offener Test","Admin back end":"Admin-Bereich","Back to competitions":"Zurück zu den Turnieren","Open testing is on: everyone who opens a competition can run it, including registration, setup, draws and scores. Spectator and organiser links are switched off while it's on.":"Offener Test ist an: Jeder, der ein Turnier öffnet, kann es leiten, inklusive Anmeldung, Einstellungen, Auslosungen und Ergebnissen. Zuschauer- und Organisator-Links sind solange abgeschaltet.","Link to this competition":"Link zu diesem Turnier","Anyone with this link can run this competition while open testing is on.":"Mit diesem Link kann jeder das Turnier leiten, solange der offene Test an ist.","Everyone can run every competition (beta testing). Spectator and organiser links are switched off.":"Jeder kann jedes Turnier leiten (Betatest). Zuschauer- und Organisator-Links sind abgeschaltet.","Off: spectators see the draw, results, standings and big screen; organisers use their organiser link or code.":"Aus: Zuschauer sehen Auslosung, Ergebnisse, Tabelle und Großbildschirm; Organisatoren nutzen ihren Organisator-Link oder -Code.","Turn open testing off":"Offenen Test ausschalten","Turn open testing on":"Offenen Test einschalten","Open testing is on.":"Offener Test ist an.","Open testing is off.":"Offener Test ist aus.","Sign in with the admin Google account to change site settings.":"Melde dich mit dem Admin-Google-Konto an, um Website-Einstellungen zu ändern.","Sign in with Google":"Mit Google anmelden","Signed in as {x}":"Angemeldet als {1}","Competitions":"Turniere","Test mode":"Testmodus","That setting didn't save.":"Die Einstellung wurde nicht gespeichert.","Admin":"Admin","Admin sign in":"Admin-Anmeldung","Sign out":"Abmelden","Signed out.":"Abgemeldet.","Signed in as admin.":"Als Admin angemeldet.","Admin: {x}":"Admin: {1}","That Google account isn't an admin for this site.":"Dieses Google-Konto ist kein Admin dieser Website.","Sign-in didn't complete. Allow pop-ups for this site and try again.":"Anmeldung nicht abgeschlossen. Erlaube Pop-ups für diese Website und versuche es erneut.","That code didn't work. Check it with the organiser.":"Dieser Code funktioniert nicht. Prüfe ihn mit dem Organisator.","You're now an organiser for this competition.":"Du bist jetzt Organisator dieses Turniers.","You can now enter scores for this competition.":"Du kannst jetzt Ergebnisse für dieses Turnier eintragen.","Couldn't connect. Check your internet connection and reload.":"Keine Verbindung. Prüfe deine Internetverbindung und lade neu.","Firebase isn't set up yet, so this is saving on this device only.":"Firebase ist noch nicht eingerichtet, daher wird nur auf diesem Gerät gespeichert.","Scorers open this once on their phone and can then enter scores and move games between pistes. Scorer code":"Schreiber öffnen dies einmal auf ihrem Handy und können dann Ergebnisse eintragen und Spiele zwischen Bahnen verschieben. Schreiber-Code","Gives full control, including registration, setup, draws and scores. Keep it to your organising team, and keep a copy for yourself in case you change device. Organiser code":"Gibt volle Kontrolle, inklusive Anmeldung, Einstellungen, Auslosungen und Ergebnissen. Nur für dein Orga-Team – und behalte selbst eine Kopie, falls du das Gerät wechselst. Organisator-Code","Last {n}":"Runde der letzten {1}","Last 16":"Achtelfinale","Last 32":"Sechzehntelfinale","Last 64":"1/32-Finale"},
  "nl": {"In loving memory of Steve Noel":"Ter liefdevolle nagedachtenis aan Steve Noel","SN Pétanque · In loving memory of Steve Noel":"SN Pétanque · Ter liefdevolle nagedachtenis aan Steve Noel","Competition desk":"Wedstrijdtafel","+ New competition":"+ Nieuw toernooi","New competition":"Nieuw toernooi","Competition":"Toernooi","Sections":"Onderdelen","This device only":"Alleen dit apparaat","Saved in this browser only":"Alleen in deze browser opgeslagen","Registration":"Inschrijving","Setup":"Instellingen","Draw & results":"Loting & uitslagen","Pistes":"Banen","Standings":"Klassement","Big screen":"Groot scherm","Loading competitions…":"Toernooien laden…","No competitions yet":"Nog geen toernooien","Set up a competition, add teams or players, then draw rounds, pools or a knockout. Pistes are allocated as games finish and scores go live for everyone with the link.":"Maak een toernooi aan, voeg teams of spelers toe en loot dan rondes, poules of een afvalschema. Banen worden toegewezen zodra partijen klaar zijn, en de scores zijn live te volgen voor iedereen met de link.","Create a competition":"Toernooi aanmaken","The organiser hasn't created a competition yet.":"De organisator heeft nog geen toernooi aangemaakt.","This is an example competition with made-up teams, so you can see how everything works. Create your own from the menu above, then delete this one in Setup.":"Dit is een voorbeeldtoernooi met verzonnen teams, zodat je ziet hoe alles werkt. Maak je eigen toernooi via het menu hierboven en verwijder dit dan bij Instellingen.","Close":"Sluiten","Delete":"Verwijderen","Delete…":"Verwijderen…","Keep it":"Behouden","Remove":"Weghalen","Add":"Toevoegen","Copy":"Kopiëren","Join":"Deelnemen","Singles":"Tête-à-tête","Doubles":"Doubletten","Triples":"Tripletten","Singles (tête-à-tête)":"Tête-à-tête","Fixed teams":"Vaste teams","Mêlée (random teams)":"Mêlée (geloote teams)","Mêlée":"Mêlée","Mêlée rounds":"Mêlée-rondes","Swiss":"Zwitsers","Swiss rounds":"Zwitsers systeem","Snake":"Slang","Snake rounds":"Slangrondes","Pools → KO":"Poules → KO","Pools → knockout":"Poules → afvalschema","Knockout":"Afvalsysteem","Round robin":"Iedereen tegen iedereen","Round robin schedule":"Schema iedereen tegen iedereen","Pools":"Poules","Competition name":"Naam toernooi","Date":"Datum","Venue":"Locatie","Club or boulodrome":"Club of boulodrome","Format locked after the first draw":"Formule vast na de eerste loting","Entries":"Inschrijvingen","Entry type":"Soort inschrijving","Format":"Formule","Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.":"Spelers schrijven zich individueel in. Elke ronde worden nieuwe teams geloot, met doubletten en tripletten door elkaar als het aantal niet uitkomt, en waar mogelijk zonder dezelfde partners. Het klassement is individueel.","Points to win":"Punten om te winnen","Bye counts as":"Vrijloting telt als","Competition system":"Speelsysteem","Mêlée competitions play a set number of rounds.":"Mêlée-toernooien spelen een vast aantal rondes.","Planned rounds":"Geplande rondes","Rounds":"Rondes","Round {n} is random. After that, teams on the same number of wins play each other and rematches are avoided. Ties are split by points difference, then Buchholz (opponents' wins).":"Ronde {1} wordt geloot. Daarna spelen teams met evenveel overwinningen tegen elkaar en worden herhalingen vermeden. Bij gelijkstand beslist het puntensaldo, dan Buchholz (overwinningen van de tegenstanders).","Rounds are drawn one at a time once the previous round is finished.":"Rondes worden één voor één geloot zodra de vorige ronde klaar is.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice ({n} teams allow up to {n} rounds). With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"De teams staan in twee rijen. Elke ronde schuift één rij een plaats op: team {1} speelt tegen de vorige tegenstander van team {2}, team {3} tegen die van team {4}, enzovoort. Alle rondes worden in één keer geloot en niemand treft twee keer hetzelfde team ({5} teams geven maximaal {6} rondes). Bij een oneven aantal teams heeft elke ronde één team een vrijloting. Klassement zoals Zwitsers: overwinningen, puntensaldo, Buchholz, fijne Buchholz.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"De teams staan in twee rijen. Elke ronde schuift één rij een plaats op: team {1} speelt tegen de vorige tegenstander van team {2}, team {3} tegen die van team {4}, enzovoort. Alle rondes worden in één keer geloot en niemand treft twee keer hetzelfde team. Bij een oneven aantal teams heeft elke ronde één team een vrijloting. Klassement zoals Zwitsers: overwinningen, puntensaldo, Buchholz, fijne Buchholz.","Pool size":"Poulegrootte","Pool games":"Poulepartijen","French poule ({n} wins qualify)":"Franse poule ({1} zeges plaatsen zich)","French poules need {n} teams: game {n} is drawn, then winners play winners and losers play losers, and a barrage decides second place. Pools of other sizes play round robin.":"Franse poules hebben {1} teams nodig: partij {2} wordt geloot, daarna spelen winnaars tegen winnaars en verliezers tegen verliezers, en een barrage beslist over de tweede plaats. Poules van een andere grootte spelen iedereen tegen iedereen.","First-round losers play a consolante":"Verliezers van de eerste ronde spelen een consolante","Third-place play-off":"Kleine finale","Seeding":"Reekshoofden","Random draw":"Vrije loting","Entry order is seeding":"Volgorde van inschrijving = reekshoofden","Afternoon knockouts":"Afvalschema's 's middags","Afternoon":"Middag","Knockouts":"Afvalschema's","What happens after the Swiss rounds. You can change this any time before the knockouts are drawn.":"Wat er na de Zwitserse rondes komt. Je kunt dit wijzigen tot de afvalschema's geloot zijn.","What happens after the pools. You can change this any time before the knockouts are drawn.":"Wat er na de poules komt. Je kunt dit wijzigen tot de afvalschema's geloot zijn.","What happens after the round robin. You can change this any time before the knockouts are drawn.":"Wat er na iedereen tegen iedereen komt. Je kunt dit wijzigen tot de afvalschema's geloot zijn.","What happens after the snake rounds. You can change this any time before the knockouts are drawn.":"Wat er na de slangrondes komt. Je kunt dit wijzigen tot de afvalschema's geloot zijn.","Quick set-ups":"Snelle formules","Draw for the knockouts":"Loting voor de afvalschema's","Seeded by standings ({n} v {n}, {n} v {n}…)":"Volgens klassement ({1} tegen {2}, {3} tegen {4}…)","Seeded (pool winners kept apart)":"Met reekshoofden (poulewinnaars gescheiden)","Random draw (tirage au sort)":"Vrije loting (tirage au sort)","Knockout name":"Naam afvalschema","Ranks":"Plaatsen","Pool places":"Pouleplaatsen","3rd-place game":"Kleine finale","From":"Van","To":"Tot","to":"tot","Remove knockout":"Afvalschema weghalen","+ Add another knockout":"+ Nog een afvalschema","Every place from {n} down":"Alle plaatsen vanaf {1}","Everyone from {n} down":"Iedereen vanaf plaats {1}","Silver competition":"Silver-toernooi","everyone who doesn't make the {x} plays their own knockout":"wie niet in de {1} komt, speelt een eigen afvalschema","starts at final":"begint bij de finale","starts at semi-finals":"begint bij de halve finales","starts at quarter-final nd. Kies de winnaar.","Precision shooting · Qualifying → final (top {n})":"Precisieschieten · Kwalificatie → finale (beste {1})","Precision shooting · Qualifying → top {n} knockout":"Precisieschieten · Kwalificatie → afvalschema beste {1}","{n} shooters checked in":"{1} schutters ingecheckt","{n} shooters entered":"{1} schutters ingeschreven","Check in at least 2 shooters on Registration first.":"Check eerst minstens 2 schutters in bij Inschrijving.","Add at least 2 shooters on Registration first.":"Voeg eerst minstens 2 schutters toe bij Inschrijving.","Start the qualifying round":"Kwalificatieronde starten","Waiting for the organiser to start.":"Wachten tot de organisator start.","{n}/{n} scorecards":"{1}/{2} scorekaarten","Shooter":"Schutter","Continue":"Doorgaan","Done":"Klaar","Shooting":"Schiet","Final for the top {n}":"Finale voor de beste {1}","Knockout for the top {n}":"Afvalschema voor de beste {1}","Start the final":"Finale starten","Draw the knockout":"Afvalschema loten","Available once every qualifying scorecard is finished":"Beschikbaar zodra alle kwalificatiekaarten klaar zijn","Qualifying round":"Kwalificatieronde","Shooting knockout (top {n})":"Schietschema (beste {1})","Standings appear once the qualifying round starts.":"Het klassement verschijnt zodra de kwalificatieronde begint.","Qualifying round. A1 lone boule, A2 boule behind the jack, A3 boule between two boules, A4 boule behind an obstacle, A5 the jack. Shooters on the same total are listed in entry order.":"Kwalificatieronde. A1 losse boule, A2 boule achter het but, A3 boule tussen twee boules, A4 boule achter een obstakel, A5 het but. Schutters met hetzelfde totaal staan in volgorde van inschrijving.","Shooters enter individually. Tir de précision to FIPJP rules: 5 ateliers (lone boule, boule behind the jack, boule between two boules, boule behind an obstacle, the jack), each shot from 6, 7, 8 and 9 m. Every shot scores 0, 1, 3 or 5, so a scorecard is out of 100.":"Schutters schrijven zich individueel in. Tir de précision volgens de FIPJP-regels: 5 ateliers (losse boule, boule achter het but, boule tussen twee boules, boule achter een obstakel, het but), elk geschoten vanaf 6, 7, 8 en 9 m. Elke worp telt 0, 1, 3 of 5, dus een scorekaart is op 100.","Qualifying → top 8 knockout":"Kwalificatie → afvalschema beste 8","Qualifying → top 16 knockout":"Kwalificatie → afvalschema beste 16","Qualifying → final":"Kwalificatie → finale","Shooters in the final":"Schutters in de finale","Everyone shoots a qualifying scorecard. The top shooters then shoot a final scorecard, and the highest final score wins.":"Iedereen schiet een kwalificatiekaart. De beste schutters schieten daarna een finalekaart, en de hoogste finalescore wint.","Everyone shoots a qualifying scorecard. The top {n} go into a knockout (1st v {n}th, and so on). Each knockout game is a duel: both shooters shoot a full scorecard and the higher total goes through.":"Iedereen schiet een kwalificatiekaart. De beste {1} gaan naar een afvalschema (1e tegen {2}e, enzovoort). Elke partij is een duel: beide schutters schieten een volle kaart en het hoogste totaal gaat door.","Third-place duel":"Duel om de derde plaats","Shooting order":"Schietvolgorde","Entry order":"Volgorde van inschrijving","Archive competition":"Toernooi archiveren","Archived":"Gearchiveerd","Archive…":"Archiveren…","Archive":"Archiveren","Restore":"Herstellen","Competition restored.":"Toernooi hersteld.","Only the site admin can see this competition. Restore it to make it visible again.":"Alleen de sitebeheerder ziet dit toernooi. Herstel het om het weer zichtbaar te maken.","Once the competition has finished, archive it to hide it from everyone except the site admin.":"Is het toernooi afgelopen, archiveer het dan om het te verbergen voor iedereen behalve de sitebeheerder.","Once the competition has finished, archive it to hide it from everyone except the site admin. Some games aren't finished yet.":"Is het toernooi afgelopen, archiveer het dan om het te verbergen voor iedereen behalve de sitebeheerder. Sommige partijen zijn nog niet klaar.","Archive “{x}”? Only the admin will be able to see it.":"“{1}” archiveren? Alleen de beheerder kan het dan zien.","Competition archived. Only the admin can see it now.":"Toernooi gearchiveerd. Alleen de beheerder kan het nu zien.","Competition archived. Only the site admin can see it now.":"Toernooi gearchiveerd. Alleen de sitebeheerder kan het nu zien.","Archived. Only the site admin can see this competition.":"Gearchiveerd. Alleen de sitebeheerder ziet dit toernooi.","{x} (archived)":"{1} (gearchiveerd)","This correction changes who went through.":"Deze correctie verandert wie doorgaat.","These later games were already played and will be reset so they can be replayed or re-entered:":"Deze latere partijen zijn al gespeeld en worden teruggezet zodat ze opnieuw gespeeld of ingevoerd kunnen worden:","Override and reset these games":"Doorzetten en deze partijen terugzetten","Cancel":"Annuleren","Ask the organiser to make this correction.":"Vraag de organisator om deze correctie te doen.","Result corrected and later games reset.":"Uitslag gecorrigeerd en latere partijen teruggezet.","Corrected":"Gecorrigeerd","Corrected (was {n}–{n}).":"Gecorrigeerd (was {1}–{2}).","To correct a wrong score, change it and press Update result. If the winner changes and a later game has already been played, you'll be asked to confirm an override.":"Om een verkeerde score te corrigeren, wijzig je die en druk je op Uitslag wijzigen. Verandert de winnaar en is een latere partij al gespeeld, dan moet je het doorzetten bevestigen.","To correct a wrong score, change it and press Update result. If the winner changes and a later game has already been played, you'll be asked to confirm an override (only possible for the current and previous round).":"Om een verkeerde score te corrigeren, wijzig je die en druk je op Uitslag wijzigen. Verandert de winnaar en is een latere partij al gespeeld, dan moet je het doorzetten bevestigen (alleen mogelijk voor de huidige en vorige ronde).","Only the current and previous round can be corrected.":"Alleen de huidige en vorige ronde kunnen gecorrigeerd worden.","This result has already moved two rounds on, so it can't be corrected here.":"Deze uitslag is al twee rondes verder, dus hij kan hier niet gecorrigeerd worden.","Fit":"Passend","Zoom in":"Inzoomen","Zoom out":"Uitzoomen","Open testing":"Open test","Admin back end":"Beheeromgeving","Back to competitions":"Terug naar toernooien","Open testing is on: everyone who opens a competition can run it, including registration, setup, draws and scores. Spectator and organiser links are switched off while it's on.":"Open test staat aan: iedereen die een toernooi opent, kan het leiden, inclusief inschrijving, instellingen, lotingen en scores. Toeschouwers- en organisatorlinks staan zolang uit.","Link to this competition":"Link naar dit toernooi","Anyone with this link can run this competition while open testing is on.":"Iedereen met deze link kan dit toernooi leiden zolang de open test aan staat.","Everyone can run every competition (beta testing). Spectator and organiser links are switched off.":"Iedereen kan elk toernooi leiden (bètatest). Toeschouwers- en organisatorlinks staan uit.","Off: spectators see the draw, results, standings and big screen; organisers use their organiser link or code.":"Uit: toeschouwers zien loting, uitslagen, klassement en groot scherm; organisatoren gebruiken hun organisatorlink of -code.","Turn open testing off":"Open test uitzetten","Turn open testing on":"Open test aanzetten","Open testing is on.":"Open test staat aan.","Open testing is off.":"Open test staat uit.","Sign in with the admin Google account to change site settings.":"Log in met het Google-beheerdersaccount om site-instellingen te wijzigen.","Sign in with Google":"Inloggen met Google","Signed in as {x}":"Ingelogd als {1}","Competitions":"Toernooien","Test mode":"Testmodus","That setting didn't save.":"Die instelling is niet opgeslagen.","Admin":"Admin","Admin sign in":"Admin-login","Sign out":"Uitloggen","Signed out.":"Uitgelogd.","Signed in as admin.":"Ingelogd als admin.","Admin: {x}":"Admin: {1}","That Google account isn't an admin for this site.":"Dat Google-account is geen beheerder van deze site.","Sign-in didn't complete. Allow pop-ups for this site and try again.":"Inloggen is niet gelukt. Sta pop-ups toe voor deze site en probeer opnieuw.","That code didn't work. Check it with the organiser.":"Die code werkt niet. Controleer hem bij de organisator.","You're now an organiser for this competition.":"Je bent nu organisator van dit toernooi.","You can now enter scores for this competition.":"Je kunt nu scores invoeren voor dit toernooi.","Couldn't connect. Check your internet connection and reload.":"Geen verbinding. Controleer je internetverbinding en herlaad de pagina.","Firebase isn't set up yet, so this is saving on this device only.":"Firebase is nog niet ingesteld, dus er wordt alleen op dit apparaat opgeslagen.","Scorers open this once on their phone and can then enter scores and move games between pistes. Scorer code":"Scoretellers openen dit één keer op hun telefoon en kunnen dan scores invoeren en partijen tussen banen verplaatsen. Scoretellercode","Gives full control, including registration, setup, draws and scores. Keep it to your organising team, and keep a copy for yourself in case you change device. Organiser code":"Geeft volledige controle, inclusief inschrijving, instellingen, lotingen en scores. Alleen voor je organisatieteam – en bewaar zelf een kopie voor als je van apparaat wisselt. Organisatorcode","Last {n}":"Laatste {1}","Last 16":"Achtste finales","Last 32":"Zestiende finales","Last 64":"Tweeëndertigste finales"},
  "pt": {"In loving memory of Steve Noel":"Em memória de Steve Noel","SN Pétanque · In loving memory of Steve Noel":"SN Pétanque · Em memória de Steve Noel","Competition desk":"Mesa do torneio","+ New competition":"+ Novo torneio","New competition":"Novo torneio","Competition":"Torneio","Sections":"Secções","This device only":"Só neste dispositivo","Saved in this browser only":"Guardado só neste navegador","Registration":"Inscrições","Setup":"Configuração","Draw & results":"Sorteio e resultados","Pistes":"Pistas","Standings":"Classificação","Big screen":"Ecrã grande","Loading competitions…":"A carregar torneios…","No competitions yet":"Ainda sem torneios","Set up a competition, add teams or players, then draw rounds, pools or a knockout. Pistes are allocated as games finish and scores go live for everyone with the link.":"Crie um torneio, adicione equipas ou jogadores e sorteie rondas, grupos ou um quadro eliminatório. As pistas são atribuídas à medida que os jogos terminam e os resultados aparecem em direto para quem tiver o link.","Create a competition":"Criar um torneio","The organiser hasn't created a competition yet.":"O organizador ainda não criou um torneio.","This is an example competition with made-up teams, so you can see how everything works. Create your own from the menu above, then delete this one in Setup.":"Este é um torneio de exemplo com equipas fictícias, para ver como tudo funciona. Crie o seu no menu acima e depois apague este em Configuração.","Close":"Fechar","Delete":"Apagar","Delete…":"Apagar…","Keep it":"Manter","Remove":"Remover","Add":"Adicionar","Copy":"Copiar","Join":"Entrar","Singles":"Individual","Doubles":"Duplas","Triples":"Triplas","Singles (tête-à-tête)":"Individual (tête-à-tête)","Fixed teams":"Equipas fixas","Mêlée (random teams)":"Mêlée (equipas sorteadas)","Mêlée":"Mêlée","Mêlée rounds":"Rondas mêlée","Swiss":"Suíço","Swiss rounds":"Rondas sistema suíço","Snake":"Serpentina","Snake rounds":"Rondas serpentina","Pools → KO":"Grupos → KO","Pools → knockout":"Grupos → eliminatórias","Knockout":"Eliminatória","Round robin":"Todos contra todos","Round robin schedule":"Calendário todos contra todos","Pools":"Grupos","Competition name":"Nome do torneio","Date":"Data","Venue":"Local","Club or boulodrome":"Clube ou boulodrome","Format locked after the first draw":"Formato bloqueado após o primeiro sorteio","Entries":"Inscritos","Entry type":"Tipo de inscrição","Format":"Formato","Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.":"Os jogadores inscrevem-se individualmente. Cada ronda sorteia novas equipas, misturando duplas e triplas quando os números não dão certo, e evita repetir parceiros sempre que possível. A classificação é individual.","Points to win":"Pontos para ganhar","Bye counts as":"Isenção conta como","Competition system":"Sistema de jogo","Mêlée competitions play a set number of rounds.":"Os torneios mêlée jogam um número fixo de rondas.","Planned rounds":"Rondas previstas","Rounds":"Rondas","Round {n} is random. After that, teams on the same number of wins play each other and rematches are avoided. Ties are split by points difference, then Buchholz (opponents' wins).":"A ronda {1} é sorteada. Depois, as equipas com o mesmo número de vitórias jogam entre si, sem repetir adversários. Os empates decidem-se pela diferença de pontos e depois pelo Buchholz (vitórias dos adversários).","Rounds are drawn one at a time once the previous round is finished.":"As rondas são sorteadas uma a uma, quando a anterior termina.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice ({n} teams allow up to {n} rounds). With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"As equipas formam duas filas. Em cada ronda uma fila avança um lugar: a equipa {1} joga com quem a equipa {2} acabou de defrontar, a equipa {3} com quem a equipa {4} defrontou, e assim por diante. Todas as rondas são sorteadas de uma vez e ninguém defronta a mesma equipa duas vezes ({5} equipas permitem até {6} rondas). Com número ímpar de equipas, uma fica isenta em cada ronda. Classificação como no suíço: vitórias, diferença de pontos, Buchholz, Buchholz fino.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"As equipas formam duas filas. Em cada ronda uma fila avança um lugar: a equipa {1} joga com quem a equipa {2} acabou de defrontar, a equipa {3} com quem a equipa {4} defrontou, e assim por diante. Todas as rondas são sorteadas de uma vez e ninguém defronta a mesma equipa duas vezes. Com número ímpar de equipas, uma fica isenta em cada ronda. Classificação como no suíço: vitórias, diferença de pontos, Buchholz, Buchholz fino.","Pool size":"Tamanho dos grupos","Pool games":"Jogos de grupo","French poule ({n} wins qualify)":"Poule à francesa ({1} vitórias apuram)","French poules need {n} teams: game {n} is drawn, then winners play winners and losers play losers, and a barrage decides second place. Pools of other sizes play round robin.":"As poules à francesa precisam de {1} equipas: o jogo {2} é sorteado, depois vencedores contra vencedores e vencidos contra vencidos, e uma barragem decide o segundo lugar. Grupos de outros tamanhos jogam todos contra todos.","First-round losers play a consolante":"Os vencidos da 1.ª ronda jogam uma consolação","Third-place play-off":"Jogo do 3.º lugar","Seeding":"Cabeças de série","Random draw":"Sorteio aleatório","Entry order is seeding":"A ordem de inscrição define os cabeças de série","Afternoon knockouts":"Eliminatórias da tarde","Afternoon":"Tarde","Knockouts":"Eliminatórias","What happens after the Swiss rounds. You can change this any time before the knockouts are drawn.":"O que acontece após as rondas do sistema suíço. Pode alterar até ao sorteio das eliminatórias.","What happens after the pools. You can change this any time before the knockouts are drawn.":"O que acontece após os grupos. Pode alterar até ao sorteio das eliminatórias.","What happens after the round robin. You can change this any time before the knockouts are drawn.":"O que acontece após o todos contra todos. Pode alterar até ao sorteio das eliminatórias.","What happens after the snake rounds. You can change this any time before the knockouts are drawn.":"O que acontece após as rondas serpentina. Pode alterar até ao sorteio das eliminatórias.","Quick set-ups":"Configurações rápidas","Draw for the knockouts":"Sorteio das eliminatórias","Seeded by standings ({n} v {n}, {n} v {n}…)":"Pela classificação ({1} vs {2}, {3} vs {4}…)","Seeded (pool winners kept apart)":"Cabeças de série (vencedores de grupo separados)","Random draw (tirage au sort)":"Sorteio aleatório integral","Knockout name":"Nome do quadro","Ranks":"Lugares","Pool places":"Lugares no grupo","3rd-place game":"Jogo do 3.º lugar","From":"De","To":"Até","to":"a","Remove knockout":"Remover quadro","+ Add another knockout":"+ Adicionar outro quadro","Every place from {n} down":"Todos os lugares a partir do {1}.º","Everyone from {n} down":"Todos a partir do {1}.º","Silver competition":"Torneio Silver","everyone who doesn't make the {x} plays their own knockout":"quem não entrar no {1} joga o seu próprio quadro","starts at final":"começa na final","starts at semi-finals":"começa nas meias-finais","starts at quarter-finals":"começa nos quartos de final","star
