/* Layout: compact app bar + tab strip, one working column; courts and brackets as grids that wrap or scroll in place. */
:root{
  --bg:#eceeea; --surface:#ffffff; --surface-2:#f5f6f3; --ink:#1a2320; --muted:#5d6a64; --line:#d3d9d5;
  --accent:#1d6a54; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --jack:#d48d0b; --jack-ink:#8a5a00; --jack-soft:#fbefd6; --danger:#b3261e; --danger-soft:#f8e0de; --wire:#b9c3be;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a211e; --surface-2:#202825; --ink:#e5ebe8; --muted:#97a49e; --line:#2d3833;
  --accent:#5fc19d; --accent-ink:#0b1511; --accent-soft:#1f3a30;
  --jack:#f0b443; --jack-ink:#f0b443; --jack-soft:#3a2f17; --danger:#ef7a70; --danger-soft:#3d1f1d; --wire:#3e4b45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a211e; --surface-2:#202825; --ink:#e5ebe8; --muted:#97a49e; --line:#2d3833;
  --accent:#5fc19d; --accent-ink:#0b1511; --accent-soft:#1f3a30;
  --jack:#f0b443; --jack-ink:#f0b443; --jack-soft:#3a2f17; --danger:#ef7a70; --danger-soft:#3d1f1d; --wire:#3e4b45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{flex:none}.brand .home{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;border-radius:6px}
.brand-txt{display:flex;flex-direction:column;line-height:1}.brand-name{white-space:nowrap}
.memorial{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.site-foot{font-size:12px;color:var(--muted);text-align:center;padding:12px 16px 24px}.site-foot a{color:inherit}
.disp-memorial{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:8px}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.tsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.picker-wrap{position:relative}
.picker-btn{display:flex;align-items:center;gap:10px;max-width:320px;min-width:200px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.picker-btn .pb-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.picker-btn .pb-chev{color:var(--muted)}
.picker{position:absolute;z-index:40;top:calc(100% + 6px);right:0;width:min(440px,calc(100vw - 32px));max-height:min(70vh,560px);display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:0 12px 40px rgba(0,0,0,.18)}
.picker-list{overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.pick-group .eyebrow{padding:4px 6px}
.pick-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.pick-row:hover{background:var(--surface-2)}.pick-row.on{background:var(--accent-soft)}
.pick-row .pr-main{flex:1;min-width:0;display:flex;flex-direction:column}.pick-row .pr-main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-row .pr-tick{color:var(--accent);font-weight:700}
@media (max-width:560px){.picker-wrap{flex:1 1 100%}.picker-btn{max-width:none;width:100%}.picker{left:0;right:auto;width:calc(100vw - 32px)}}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .t-ic,nav.tabs .t-short{display:none}
/* ---------- phones ---------- */
@media (max-width:640px){
  input,select,textarea{font-size:16px} /* stops iPhone zooming in on tap */
  .bar{gap:8px;padding-block:10px}
  .brand{font-size:20px}.brand small{font-size:10.5px}
  .tsel{width:100%;flex-wrap:nowrap}.tsel .picker-wrap{flex:1 1 auto;min-width:0}.picker-btn{min-width:0}
  .tsel .pill,.hide-sm{display:none}span.show-sm{display:inline}
  .new-t{font-size:15px;font-weight:700;padding:7px 12px;line-height:1;white-space:nowrap}
  nav.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;gap:0;background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  nav.tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-bottom:0;border-radius:10px;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:0}
  nav.tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
  nav.tabs .t-ic,nav.tabs .t-short{display:block}nav.tabs .t-long{display:none}
  main{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .site-foot{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  body .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  html{scroll-padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))} /* Tab never leaves a control hidden under the tab bar */
  main .seg{display:flex;width:100%}main .seg button{flex:1 1 auto;padding:9px 10px}
  header .seg{flex:none;flex-wrap:nowrap}header .seg button{padding:7px 10px}
  .btn{min-height:40px}.btn.sm{min-height:34px}
  h2{font-size:23px}
}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:26px}
h3{font-size:19px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.rp-live{border-color:var(--danger);background:var(--danger-soft);box-shadow:inset 0 0 0 1px var(--danger)}
.panel.rp-ready{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.rp-state{font-weight:600}.rp-live .rp-state{color:var(--danger)}.rp-ready .rp-state{color:var(--accent)}
.btn.wait:disabled{opacity:.7;color:var(--danger);border-color:var(--danger);background:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.ghost{background:none;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* read out by screen readers, not shown */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* keyboard users: the first Tab shows a link straight to the page's content */
.skip{position:absolute;left:8px;top:8px;z-index:100;transform:translateY(-200%);background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:10px;padding:10px 14px;font-weight:700;text-decoration:none}
.skip:focus{transform:none}body.stream .skip{display:none}
#main:focus,.modal:focus{outline:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f>span{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
/* date boxes: iPhone Safari gives native date inputs their own width, which pushed them past the panel edge */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:40px;line-height:1.3;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-datetime-edit{padding:0}
label.f,.fields>*{min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.seg{display:inline-flex;align-self:flex-start;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface-2);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.wrap{white-space:normal;overflow-wrap:anywhere;max-width:100%;border-radius:10px;line-height:1.3;padding-block:3px}
.pill.playing{background:var(--jack-soft);color:var(--jack-ink)}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.ready{background:var(--surface-2);color:var(--ink);border:1px dashed var(--line)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.notice{padding:10px 14px;border-radius:8px;background:var(--jack-soft);color:var(--ink);font-size:14px}
.notice.example{background:var(--accent-soft)}
/* matches */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;cursor:pointer;min-width:0}
.match:hover{border-color:var(--muted)}
.match.ro{cursor:default}
.match.playing{border-color:var(--jack);box-shadow:inset 3px 0 0 var(--jack)}
.match .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.side{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.side .nm{min-width:0;overflow-wrap:anywhere;font-weight:500}
.side.win .nm{font-weight:700}
.side .sc{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.side.win .sc{color:var(--accent)}
.side.lose .sc{color:var(--muted)}
.court-tag{font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink);letter-spacing:.03em}
.tbd{color:var(--muted);font-style:italic}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:160px}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.rank{font-family:var(--display);font-weight:700;font-size:17px}
/* courts */
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.court{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.court .cn{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;display:flex;justify-content:space-between;align-items:center}
.court.free{background:var(--surface-2);border-style:dashed}
.court.off{opacity:.5}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.ptile{display:flex;flex-direction:column;gap:3px;min-width:0;padding:9px 11px 10px;border:1px solid var(--jack);box-shadow:inset 3px 0 0 var(--jack);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;text-align:left}
button.ptile{cursor:pointer}button.ptile:hover{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ptile.me{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent),0 0 0 1px var(--accent)}
.pt-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.pt-n{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.pt-ctx{min-width:0;font-size:12px;line-height:1.25;color:var(--muted);text-align:right;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pt-s{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.pt-s .nm{min-width:0;overflow-wrap:anywhere;font-weight:600;line-height:1.25}
.pt-s .sc{font-family:var(--display);font-size:18px;font-weight:700}
.pt-free{font-size:13px;font-weight:600}
.pfree{display:flex;align-items:baseline;gap:10px;padding:9px 12px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface-2);color:var(--muted)}
.pfree [data-notr]{font-family:var(--display);font-size:19px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}

/* bracket */
/* bracket: every round column is the same height and each match sits in an equal share of it,
   so a match always lines up halfway between the two games that feed it; wires are drawn with borders */
.bk-scroll{overflow:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;max-width:100%}
.bk-tools{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bk-tools .btn{min-width:36px;justify-content:center}
.bk-tools .zv{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:4ch;text-align:center}
.bk{--gap:40px;display:grid;grid-auto-columns:minmax(200px,230px);grid-template-rows:auto 1fr;column-gap:var(--gap);width:max-content;min-width:100%}
.bk h4{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;grid-row:1}
.bk-col{grid-row:2;display:flex;flex-direction:column}
.bk-pair{flex:1;display:flex;flex-direction:column;position:relative}
.bk-slot{flex:1;display:flex;align-items:center;position:relative;padding-block:5px}
.bk-slot>*{width:100%}
.bk-col.out .bk-slot::after{content:"";position:absolute;right:calc(var(--gap) / -2);width:calc(var(--gap) / 2);top:50%;border-top:2px solid var(--wire)}
.bk-col.out .bk-pair::after{content:"";position:absolute;right:calc(var(--gap) / -2);top:25%;bottom:25%;border-right:2px solid var(--wire)}
.bk-col.in .bk-slot::before{content:"";position:absolute;left:calc(var(--gap) / -2);width:calc(var(--gap) / 2);top:50%;border-top:2px solid var(--wire)}
.bk-col.out .bk-slot.done::after{border-color:var(--accent)}
.bkm{display:flex;flex-direction:column;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:left;padding:0;cursor:pointer;font-size:14px}
.bkm.ro{cursor:default}
button.bkm:hover{border-color:var(--muted)}
/* status by colour, never by extra height: grey not started, red playing, green finished */
.bkm.playing{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.bkm.done{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bkm-pst{position:absolute;top:-8px;right:8px;font-size:10px;line-height:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:6px;background:var(--danger);color:#fff;white-space:nowrap;pointer-events:none}
.bk-key{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-right:auto;font-size:12px;color:var(--muted)}
.bk-key span{display:inline-flex;align-items:center;gap:5px}.bk-key i{width:14px;height:10px;border-radius:3px;border:2px solid var(--line);display:inline-block}
.bk-key i.playing{border-color:var(--danger)}.bk-key i.done{border-color:var(--accent)}
.bkm.bye{opacity:.6;background:var(--surface-2);border-style:dashed;border-color:var(--line);box-shadow:none}
.bkm-row{display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;line-height:20px} /* fixed height: a score never makes a game taller */
.bkm-row+.bkm-row{border-top:1px solid var(--line)}
.bkm-row .sd{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.6ch;text-align:right}
.bkm-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkm-row .sc{font-family:var(--display);font-weight:700;font-size:18px;line-height:20px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.bkm-row.win .nm{font-weight:700}.bkm-row.win .sc{color:var(--accent)}
.bkm-row.lose .nm,.bkm-row.lose .sc{color:var(--muted)}
.bkm-row .tbd{font-size:13px}
.bk-champ{border:2px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}

.bk-third{display:flex;justify-content:flex-end}
.bk-list{display:flex;flex-direction:column;gap:12px}.bk-list h4{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const SIZE = { singles: 1, doubles: 2, triples: 3 };
const FORMAT_LABEL = { singles: "Singles (tête-à-tête)", doubles: "Doubles", triples: "Triples" };

const HOW_ANCHOR = { swiss: "swiss", snake: "snake", pools: "barrage", leagues: "leagues", roundrobin: "round-robin", knockout: "knockout", clubs: "inter-club", melee: "melee", shooting: "shooting" };
const SYSTEM_LABEL = { swiss: "Swiss rounds", pools: "Barrage → knockout", leagues: "Leagues", clubs: "Inter-club", knockout: "Knockout", roundrobin: "Round robin", snake: "Snake", melee: "Mêlée rounds" };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
/* ---------------- colours: competition accent, stream team colours, light/dark ---------------- */
const isHex = v => /^#[0-9a-f]{6}$/i.test(String(v || ""));
const rgbOf = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const hexOf = c => "#" + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
const mixHex = (a, b, t) => { const x = rgbOf(a), y = rgbOf(b); return hexOf(x.map((v, i) => v + (y[i] - v) * t)); };
const lumOf = h => { const [r, g, b] = rgbOf(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
const contrastOf = (a, b) => { const x = lumOf(a), y = lumOf(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
// text that reads on a colour: near-black or white, whichever contrasts more
const inkOn = h => contrastOf(h, "#0b0f16") >= contrastOf(h, "#ffffff") ? "#0b0f16" : "#ffffff";
// nudge a colour towards black or white until it reads as text on the given ground (4.5:1)
const readableOn = (h, ground) => { let c = h; const to = lumOf(ground) > .4 ? "#000000" : "#ffffff"; for (let i = 0; i < 20 && contrastOf(c, ground) < 4.5; i++) c = mixHex(c, to, .12); return c; };
// device theme: automatic (follows the phone), light or dark; remembered on this device
const THEMES = [["auto", "Automatic"], ["light", "Light"], ["dark", "Dark"]];
const thIc = d => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const THEME_ICON = {
  auto: thIc('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>'),
  light: thIc('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>'),
  dark: thIc('<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/>'),
};
const themePref = () => { const v = lsGet("carreau-theme"); return v === "light" || v === "dark" ? v : "auto"; };
function applyTheme() { const v = themePref(); if (v === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v; }
applyTheme();
// competition colours: the organiser's accent colour, applied for everyone viewing that competition
const ACCENTS = [["#1d6a54", "Green"], ["#1f5fbf", "Blue"], ["#1d3557", "Navy"], ["#b3261e", "Red"], ["#8a1c4a", "Claret"], ["#6b3fa0", "Purple"], ["#c25b12", "Orange"], ["#1a2320", "Black"]];
let themeKey = null;
function applyCompTheme(t) {
  const acc = t && isHex(t.accent) ? t.accent.toLowerCase() : null; if (themeKey === acc) return; themeKey = acc;
  let el = document.getElementById("comp-theme"); if (!el) { el = document.createElement("style"); el.id = "comp-theme"; document.head.appendChild(el); }
  if (!acc) { el.textContent = ""; return; }
  const L = readableOn(acc, "#ffffff"), D = readableOn(mixHex(acc, "#ffffff", .3), "#1a211e");
  const light = `--accent:${L};--accent-ink:${inkOn(L)};--accent-soft:${mixHex(acc, "#ffffff", .86)}`;
  const dark = `--accent:${D};--accent-ink:${inkOn(D)};--accent-soft:${mixHex(acc, "#1a211e", .72)}`;
  el.textContent = `:root{${light}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark}}}:root[data-theme="dark"]{${dark}}`;
}

1}–{2}).","To correct a wrong score, change it and press Update result. If the winner changes and a later game has already been played, you'll be asked to confirm an override.":"Para corregir un resultado erróneo, cámbialo y pulsa Actualizar resultado. Si cambia el ganador y ya se jugó una partida posterior, se te pedirá confirmar el forzado.","To correct a wrong score, change it and press Update result. If the winner changes and a later game has already been played, you'll be asked to confirm an override (only possible for the current and previous round).":"Para corregir un resultado erróneo, cámbialo y pulsa Actualizar resultado. Si cambia el ganador y ya se jugó una partida posterior, se te pedirá confirmar el forzado (solo posible para la ronda actual y la anterior).","Only the current and previous round can be corrected.":"Solo se pueden corregir la ronda actual y la anterior.","This result has already moved two rounds on, so it can't be corrected here.":"Este resultado ya ha avanzado dos rondas, así que no se puede corregir aquí.","Fit":"Ajustar","Zoom in":"Acercar","Zoom out":"Alejar","Open testing":"Prueba abierta","Admin back end":"Panel de administración","Back to competitions":"Volver a los torneos","Open testing is on: everyone who opens a competition can run it, including registration, setup, draws and scores. Spectator and organiser links are switched off while it's on.":"La prueba abierta está activada: cualquiera que abra un torneo puede gestionarlo, incluidas inscripciones, ajustes, sorteos y resultados. Los enlaces de espectador y organizador están desactivados mientras tanto.","Link to this competition":"Enlace a este torneo","Anyone with this link can run this competition while open testing is on.":"Cualquiera con este enlace puede gestionar este torneo mientras la prueba abierta esté activada.","Everyone can run every competition (beta testing). Spectator and organiser links are switched off.":"Todos pueden gestionar todos los torneos (prueba beta). Los enlaces de espectador y organizador están desactivados.","Off: spectators see the draw, results, standings and big screen; organisers use their organiser link or code.":"Desactivada: los espectadores ven el sorteo, los resultados, la clasificación y la pantalla grande; los organizadores usan su enlace o código de organizador.","Turn open testing off":"Desactivar la prueba abierta","Turn open testing on":"Activar la prueba abierta","Open testing is on.":"Prueba abierta activada.","Open testing is off.":"Prueba abierta desactivada.","Sign in with the admin Google account to change site settings.":"Inicia sesión con la cuenta Google de administrador para cambiar los ajustes del sitio.","Sign in with Google":"Iniciar sesión con Google","Signed in as {x}":"Sesión iniciada como {1}","Competitions":"Torneos","Test mode":"Modo prueba","That setting didn't save.":"El ajuste no se ha guardado.","Admin":"Admin","Admin sign in":"Acceso admin","Sign out":"Cerrar sesión","Signed out.":"Sesión cerrada.","Signed in as admin.":"Sesión iniciada como admin.","Admin: {x}":"Admin: {1}","That Google account isn't an admin for this site.":"Esa cuenta de Google no es administradora de este sitio.","Sign-in didn't complete. Allow pop-ups for this site and try again.":"No se completó el inicio de sesión. Permite las ventanas emergentes para este sitio e inténtalo de nuevo.","That code didn't work. Check it with the organiser.":"Ese código no funciona. Compruébalo con el organizador.","You're now an organiser for this competition.":"Ahora eres organizador de este torneo.","You can now enter scores for this competition.":"Ahora puedes introducir resultados en este torneo.","Couldn't connect. Check your internet connection and reload.":"No se pudo conectar. Revisa tu conexión a internet y recarga.","Firebase isn't set up yet, so this is saving on this device only.":"Firebase aún no está configurado, así que se guarda solo en este dispositivo.","Scorers open this once on their phone and can then enter scores and move games between pistes. Scorer code":"Los anotadores lo abren una vez en su móvil y luego pueden introducir resultados y mover partidas entre pistas. Código de anotador","Gives full control, including registration, setup, draws and scores. Keep it to your organising team, and keep a copy for yourself in case you change device. Organiser code":"Da control total, incluidas inscripciones, ajustes, sorteos y resultados. Compártelo solo con tu equipo organizador y guarda una copia por si cambias de dispositivo. Código de organizador","Last {n}":"Ronda de {1}","Last 16":"Octavos de final","Last 32":"Dieciseisavos de final","Last 64":"Treintaidosavos de final"},
  "it": {"Watch how it works":"Guarda come funziona","A 2½-minute walk-through of a first competition":"Una guida di 2 minuti e mezzo a una prima gara","Guides":"Guide","Short videos that walk you through the competition desk, step by step.":"Brevi video che ti guidano passo passo nel banco di gara.","Your first competition":"La tua prima gara","Running a shooting competition":"Organizzare una gara di tiro","From a blank page to round 1 on the pistes: create a competition, add teams, check in, share the link, draw and enter scores.":"Da una pagina vuota al turno 1 sui campi: crea una gara, aggiungi le squadre, registra gli arrivi, condividi il link, sorteggia e inserisci i punteggi.","Tir de précision: qualifying scorecards with the live scorer, then a knockout to the final and the podium.":"Tir de précision: cartellini di qualificazione con il segnapunti dal vivo, poi un'eliminazione diretta fino alla finale e al podio.","New to the desk? Watch the 2-minute walk-through.":"Nuovo qui? Guarda la guida di 2 minuti.","Running a shooting day? Watch how it works (3 min).":"Organizzi una gara di tiro? Guarda come funziona (3 min).","The videos are in English.":"I video sono in inglese.","{n} teams lost their first game and are ready to play.":"{1} squadre hanno perso la prima partita e sono pronte a giocare.","Available once every team has played its first game.":"Disponibile quando ogni squadra ha giocato la prima partita.","Not enough teams lost their first game to make a consolante.":"Troppo poche squadre hanno perso la prima partita per una consolante.","At least 2 teams are needed for a knockout.":"Servono almeno 2 squadre per un'eliminazione diretta.","{n} teams → barrage sizes {x}":"{1} squadre → barrage da {2}","Round {n} · Cross-over":"Turno {1} · Incrocio","{n} cross-over game(s) this round (teams with different results).":"{1} partita/e incrociata/e in questo turno (squadre con risultati diversi).","{n} cross-over game(s) this round (teams with different results). {n} rematch(es) were unavoidable this round.":"{1} partita/e incrociata/e in questo turno (squadre con risultati diversi). {2} rivincita/e inevitabile/i in questo turno.","In loving memory of Steve Noel":"In ricordo di Steve Noel","SN Pétanque · In loving memory of Steve Noel":"SN Pétanque · In ricordo di Steve Noel","Competition desk":"Banco di gara","+ New competition":"+ Nuova gara","New competition":"Nuova gara","Competition":"Gara","Sections":"Sezioni","This device only":"Solo questo dispositivo","Saved in this browser only":"Salvato solo in questo browser","Registration":"Iscrizioni","Setup":"Impostazioni","Draw & results":"Sorteggio e risultati","Pistes":"Campi","Standings":"Classifica","Big screen":"Maxischermo","Loading competitions…":"Caricamento gare…","No competitions yet":"Nessuna gara per ora","Set up a competition, add teams or players, then draw rounds, pools or a knockout. Pistes are allocated as games finish and scores go live for everyone with the link.":"Crea una gara, aggiungi squadre o giocatori, poi sorteggia turni, gironi o un tabellone. I campi vengono assegnati man mano che finiscono le partite e i punteggi sono in diretta per chi ha il link.","Create a competition":"Crea una gara","The organiser hasn't created a competition yet.":"L'organizzatore non ha ancora creato una gara.","This is an example competition with made-up teams, so you can see how everything works. Create your own from the menu above, then delete this one in Setup.":"Questa è una gara di esempio con squadre inventate, per vedere come funziona tutto. Crea la tua dal menu in alto, poi elimina questa in Impostazioni.","Close":"Chiudi","Delete":"Elimina","Delete…":"Elimina…","Keep it":"Mantieni","Remove":"Rimuovi","Add":"Aggiungi","Copy":"Copia","Join":"Entra","Singles":"Individuale","Doubles":"Coppie","Triples":"Terne","Singles (tête-à-tête)":"Individuale (tête-à-tête)","Fixed teams":"Squadre fisse","Mêlée (random teams)":"Mêlée (squadre sorteggiate)","Mêlée":"Mêlée","Mêlée rounds":"Turni a mêlée","Swiss":"Svizzero","Swiss rounds":"Turni a sistema svizzero","Snake":"Serpentina","Snake rounds":"Turni a serpentina","Pools → KO":"Gironi → tabellone","Pools → knockout":"Gironi → eliminazione","Knockout":"Eliminazione diretta","Round robin":"Girone all'italiana","Round robin schedule":"Calendario all'italiana","Pools":"Gironi","Competition name":"Nome della gara","Date":"Data","Venue":"Luogo","Club or boulodrome":"Club o bocciodromo","Format locked after the first draw":"Formula bloccata dopo il primo sorteggio","Entries":"Iscritti","Entry type":"Tipo di iscrizione","Format":"Formula","Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.":"I giocatori si iscrivono singolarmente. A ogni turno si sorteggiano nuove squadre, mescolando coppie e terne se i numeri non tornano, evitando se possibile gli stessi compagni. La classifica è individuale.","Points to win":"Punti per vincere","Bye counts as":"Il riposo vale","Competition system":"Sistema di gara","Mêlée competitions play a set number of rounds.":"Le gare a mêlée si giocano su un numero fisso di turni.","Planned rounds":"Turni previsti","Rounds":"Turni","Round {n} is random. After that, teams on the same number of wins play each other and rematches are avoided. Ties are split by points difference, then Buchholz (opponents' wins).":"Il turno {1} è sorteggiato. Poi si affrontano le squadre con lo stesso numero di vittorie, evitando rivincite. Le parità si risolvono con la differenza punti, poi il Buchholz (vittorie degli avversari).","Rounds are drawn one at a time once the previous round is finished.":"I turni si sorteggiano uno alla volta, finito il precedente.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice ({n} teams allow up to {n} rounds). With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"Le squadre formano due file. A ogni turno una fila avanza di un posto: la squadra {1} gioca con chi ha appena affrontato la squadra {2}, la squadra {3} con chi ha appena affrontato la squadra {4}, e così via. Tutti i turni si sorteggiano insieme e nessuno incontra due volte la stessa squadra ({5} squadre consentono fino a {6} turni). Con un numero dispari di squadre, una riposa a ogni turno e ottiene il riposo. Classifica come nello svizzero: vittorie, differenza punti, Buchholz, Buchholz fine.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"Le squadre formano due file. A ogni turno una fila avanza di un posto: la squadra {1} gioca con chi ha appena affrontato la squadra {2}, la squadra {3} con chi ha appena affrontato la squadra {4}, e così via. Tutti i turni si sorteggiano insieme e nessuno incontra due volte la stessa squadra. Con un numero dispari di squadre, una riposa a ogni turno e ottiene il riposo. Classifica come nello svizzero: vittorie, differenza punti, Buchholz, Buchholz fine.","Pool size":"Dimensione gironi","Pool games":"Partite di girone","French poule ({n} wins qualify)":"Girone alla francese ({1} vittorie qualificano)","French poules need {n} teams: game {n} is drawn, then winners play winners and losers play losers, and a barrage decides second place. Pools of other sizes play round robin.":"I gironi alla francese sono da {1} squadre: la partita {2} è sorteggiata, poi vincenti contro vincenti e perdenti contro perdenti, e uno spareggio decide il secondo posto. I gironi di altre dimensioni si giocano all'italiana.","First-round losers play a consolante":"I perdenti del primo turno giocano una consolazione","Third-place play-off":"Finale 3°/4° posto","Seeding":"Teste di serie","Random draw":"Sorteggio libero","Entry order is seeding":"L'ordine di iscrizione decide le teste di serie","Afternoon knockouts":"Tabelloni del pomeriggio","Afternoon":"Pomeriggio","Knockouts":"Tabelloni","What happens after the Swiss rounds. You can change this any time before the knockouts are drawn.":"Cosa segue ai turni a sistema svizzero. Modificabile fino al sorteggio dei tabelloni.","What happens after the pools. You can change this any time before the knockouts are drawn.":"Cosa segue ai gironi. Modificabile fino al sorteggio dei tabelloni.","What happens after the round robin. You can change this any time before the knockouts are drawn.":"Cosa segue al girone all'italiana. Modificabile fino al sorteggio dei tabelloni.","What happens after the snake rounds. You can change this any time before the knockouts are drawn.":"Cosa segue ai turni a serpentina. Modificabile fino al sorteggio dei tabelloni.","Quick set-ups":"Formule rapide","Draw for the knockouts":"Sorteggio dei tabelloni","Seeded by standings ({n} v {n}, {n} v {n}…)":"Secondo classifica ({1} contro {2}, {3} contro {4}…)","Seeded (pool winners kept apart)":"Teste di serie (primi dei gironi separati)","Random draw (tirage au sort)":"Sorteggio integrale","Knockout name":"Nome del tabellone","Ranks":"Posizioni","Pool places":"Posizioni nel girone","3rd-place game":"Finale 3°/4° posto","From":"Da","To":"A","to":"a","Remove knockout":"Rimuovi tabellone","+ Add another knockout":"+ Aggiungi un tabellone","Every place from {n} down":"Tutte le posizioni dalla {1}ª","Everyone from {n} down":"Tutti dal {1}° in giù","Silver competition":"Gara Silver","everyone who doesn't make the {x} plays their own knockout":"chi non entra nel {1} gioca un proprio tabellone","starts at final":"parte dalla finale","starts at semi-finals":"parte dalle semifinali","starts at quarter-finals":"parte dai quarti di finale","starts at last {n}":"parte dal turno dei {1}","Pick which finishing places in each pool go into each knockout, e.g. {n}st–{n}nd into the A, {n}rd–{n}th into the B.":"Scegli quali posizioni di ogni girone vanno in ogni tabellone, es. 1°–2° nell'A, 3°–4° nel B.","Pick which overall ranks go into each knockout. Numbers that aren't a power of two get byes for the top seeds, so top {n} gives seeds {n} and {n} a bye into the semi-finals.":"Scegli quali posizioni della classifica vanno in ogni tabellone. Se il numero non è una potenza di due, le migliori teste di serie riposano: con i primi {1}, le teste di serie {2} e {3} passano direttamente in semifinale.","not enough teams":"squadre insufficienti","{n} teams · starts at final":"{1} squadre · parte dalla finale","{n} teams · starts at semi-finals":"{1} squadre · parte dalle semifinali","{n} teams · starts at quarter-finals":"{1} squadre · parte dai quarti di finale","{n} teams · starts at last {n}":"{1} squadre · parte dal turno dei {2}","{n} byes for the top seeds":"{1} riposi per le migliori teste di serie","{n} bye for the top seed":"{1} riposo per la miglior testa di serie","Final (top {n})":"Finale (primi {1})","Semi-finals (top {n})":"Semifinali (primi {1})","Quarter-finals (top {n})":"Quarti di finale (primi {1})","Top {n} + Plate ({n}–{n})":"Primi {1} + Complementare ({2}–{3})","Top {n}":"Primi {1}","Everyone → one knockout":"Tutti → un solo tabellone","{n}st & {n}nd → A, rest → B":"1° e 2° → A, altri → B","{n}st → A, {n}nd → B, rest → C":"1° → A, 2° → B, altri → C","{n}st & {n}nd → A only":"1° e 2° → solo A","Number of pistes":"Numero di campi","Piste name":"Nome del campo","In use":"In uso","Rename a piste to match the markings on your terrain, or switch it off if it's unusable. Free pistes are given to waiting games as soon as a result comes in.":"Rinomina un campo secondo le marcature del tuo terreno, o disattivalo se non è utilizzabile. I campi liberi vanno alle partite in attesa appena arriva un risultato.","Allocate pistes at random (otherwise lowest free piste first)":"Assegna i campi a caso (altrimenti il primo campo libero)","Delete competition":"Elimina gara","Removes the competition, its entries and every result.":"Elimina la gara, gli iscritti e tutti i risultati.","Delete “{x}” for everyone":"Elimina “{1}” per tutti","Checked in on the day":"Presenti il giorno della gara","of {n} teams":"su {1} squadre","of {n} players":"su {1} giocatori","Check in everyone":"Segna tutti presenti","Clear check-ins":"Azzera presenze","Only checked-in teams go into the draw, so the format and the number of games are worked out from who has actually turned up.":"Al sorteggio entrano solo le squadre presenti: formula e numero di partite dipendono da chi è davvero arrivato.","Only checked-in players go into the draw, so the format and the number of games are worked out from who has actually turned up.":"Al sorteggio entrano solo i giocatori presenti: formula e numero di partite dipendono da chi è davvero arrivato.","{n} not checked in yet.":"{1} non ancora presenti.","Check-in is off, so every entered team goes into the draw.":"Appello disattivato: tutte le squadre iscritte entrano nel sorteggio.","Check-in is off, so every entered player goes into the draw.":"Appello disattivato: tutti i giocatori iscritti entrano nel sorteggio.","Teams must check in on the day before they're included in the draw":"Le squadre devono segnarsi presenti il giorno della gara per entrare nel sorteggio","The draw has started. Anyone checked in now joins from the next round.":"Il sorteggio è iniziato. Chi si segna presente ora entra dal turno successivo.","The draw has started. New entries join from the next round.":"Il sorteggio è iniziato. Le nuove iscrizioni entrano dal turno successivo.","The draw has been made, so new entri zatore.","Turn open testing off":"Disattiva il test aperto","Turn open testing on":"Attiva il test aperto","Open testing is on.":"Test aperto attivo.","Open testing is off.":"Test aperto disattivato.","Sign in with the admin Google account to change site settings.":"Accedi con l'account Google admin per modificare le impostazioni del sito.","Sign in with Google":"Accedi con Google","Signed in as {x}":"Accesso come {1}","Competitions":"Gare","Test mode":"Modalità test","That setting didn't save.":"L'impostazione non è stata salvata.","Admin":"Admin","Admin sign in":"Accesso admin","Sign out":"Esci","Signed out.":"Disconnesso.","Signed in as admin.":"Accesso come admin.","Admin: {x}":"Admin: {1}","That Google account isn't an admin for this site.":"Quell'account Google non è amministratore di questo sito.","Sign-in didn't complete. Allow pop-ups for this site and try again.":"Accesso non completato. Consenti i pop-up per questo sito e riprova.","That code didn't work. Check it with the organiser.":"Quel codice non funziona. Verificalo con l'organizzatore.","You're now an organiser for this competition.":"Ora sei organizzatore di questa gara.","You can now enter scores for this competition.":"Ora puoi inserire i punteggi di questa gara.","Couldn't connect. Check your internet connection and reload.":"Connessione non riuscita. Controlla la connessione internet e ricarica.","Firebase isn't set up yet, so this is saving on this device only.":"Firebase non è ancora configurato, quindi si salva solo su questo dispositivo.","Scorers open this once on their phone and can then enter scores and move games between pistes. Scorer code":"I segnapunti lo aprono una volta sul telefono, poi possono inserire punteggi e spostare partite tra i campi. Codice segnapunti","Gives full control, including registration, setup, draws and scores. Keep it to your organising team, and keep a copy for yourself in case you change device. Organiser code":"Dà il controllo totale: iscrizioni, impostazioni, sorteggi e punteggi. Riservalo al tuo staff organizzativo e tienine una copia nel caso cambi dispositivo. Codice organizzatore","Last {n}":"Turno dei {1}","Last 16":"Ottavi di finale","Last 32":"Sedicesimi di finale","Last 64":"Trentaduesimi di finale"},

plette","Singles (tête-à-tête)":"Tête-à-tête","Fixed teams":"Feste Teams","Mêlée (random teams)":"Mêlée (zugeloste Teams)","Mêlée":"Mêlée","Mêlée rounds":"Mêlée-Runden","Swiss":"Schweizer","Swiss rounds":"Schweizer System","Snake":"Schlange","Snake rounds":"Schlangen-Runden","Pools → KO":"Gruppen → KO","Pools → knockout":"Gruppen → KO-Runde","Knockout":"KO-System","Round robin":"Jeder gegen jeden","Round robin schedule":"Spielplan jeder gegen jeden","Pools":"Gruppen","Competition name":"Turniername","Date":"Datum","Venue":"Ort","Club or boulodrome":"Verein oder Boulodrome","Format locked after the first draw":"Format nach der ersten Auslosung gesperrt","Entries":"Meldungen","Entry type":"Meldeart","Format":"Format","Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.":"Spieler melden sich einzeln. Jede Runde werden neue Teams zugelost – bei ungerader Zahl gemischt aus Doubletten und Tripletten –, und wiederholte Partner werden möglichst vermieden. Gewertet wird jeder Spieler einzeln.","Points to win":"Punkte zum Sieg","Bye counts as":"Freilos zählt als","Competition system":"Turniersystem","Mêlée competitions play a set number of rounds.":"Mêlée-Turniere spielen eine feste Anzahl Runden.","Planned rounds":"Geplante Runden","Rounds":"Runden","Round {n} is random. After that, teams on the same number of wins play each other and rematches are avoided. Ties are split by points difference, then Buchholz (opponents' wins).":"Runde {1} wird zugelost. Danach spielen Teams mit gleich vielen Siegen gegeneinander, Wiederholungen werden vermieden. Bei Gleichstand entscheidet die Punktdifferenz, dann Buchholz (Siege der Gegner).","Rounds are drawn one at a time once the previous round is finished.":"Runden werden einzeln ausgelost, sobald die vorige Runde beendet ist.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice ({n} teams allow up to {n} rounds). With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"Die Teams stehen in zwei Reihen. Jede Runde rückt eine Reihe einen Platz weiter: Team {1} spielt gegen den letzten Gegner von Team {2}, Team {3} gegen den von Team {4} usw. Alle Runden werden auf einmal ausgelost, niemand trifft zweimal auf dasselbe Team ({5} Teams erlauben bis zu {6} Runden). Bei ungerader Teamzahl setzt jede Runde ein Team aus und erhält ein Freilos. Wertung wie im Schweizer System: Siege, Punktdifferenz, Buchholz, Fein-Buchholz.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"Die Teams stehen in zwei Reihen. Jede Runde rückt eine Reihe einen Platz weiter: Team {1} spielt gegen den letzten Gegner von Team {2}, Team {3} gegen den von Team {4} usw. Alle Runden werden auf einmal ausgelost, niemand trifft zweimal auf dasselbe Team. Bei ungerader Teamzahl setzt jede Runde ein Team aus und erhält ein Freilos. Wertung wie im Schweizer System: Siege, Punktdifferenz, Buchholz, Fein-Buchholz.","Pool size":"Gruppengröße","Pool games":"Gruppenspiele","French poule ({n} wins qualify)":"Französische Poule ({1} Siege qualifizieren)","French poules need {n} teams: game {n} is drawn, then winners play winners and losers play losers, and a barrage decides second place. Pools of other sizes play round robin.":"Französische Poules brauchen {1} Teams: Spiel {2} wird ausgelost, dann spielen Sieger gegen Sieger und Verlierer gegen Verlierer, und eine Barrage entscheidet Platz zwei. Gruppen anderer Größe spielen jeder gegen jeden.","First-round losers play a consolante":"Verlierer der ersten Runde spielen eine Consolante","Third-place play-off":"Spiel um Platz 3","Seeding":"Setzliste","Random draw":"Freie Auslosung","Entry order is seeding":"Meldereihenfolge = Setzliste","Afternoon knockouts":"KO-Runden am Nachmittag","Afternoon":"Nachmittag","Knockouts":"KO-Runden","What happens after the Swiss rounds. You can change this any time before the knockouts are drawn.":"Was nach den Schweizer Runden folgt. Bis zur Auslosung der KO-Runden jederzeit änderbar.","What happens after the pools. You can change this any time before the knockouts are drawn.":"Was nach den Gruppen folgt. Bis zur Auslosung der KO-Runden jederzeit änderbar.","What happens after the round robin. You can change this any time before the knockouts are drawn.":"Was nach jeder gegen jeden folgt. Bis zur Auslosung der KO-Runden jederzeit änderbar.","What happens after the snake rounds. You can change this any time before the knockouts are drawn.":"Was nach den Schlangen-Runden folgt. Bis zur Auslosung der KO-Runden jederzeit änderbar.","Quick set-ups":"Schnellvorlagen","Draw for the knockouts":"Auslosung der KO-Runden","Seeded by standings ({n} v {n}, {n} v {n}…)":"Nach Tabelle gesetzt ({1} gg. {2}, {3} gg. {4}…)","Seeded (pool winners kept apart)":"Gesetzt (Gruppensieger getrennt)","Random draw (tirage au sort)":"Freie Auslosung (tirage au sort)","Knockout name":"Name der KO-Runde","Ranks":"Plätze","Pool places":"Gruppenplätze","3rd-place game":"Spiel um Platz 3","From":"Von","To":"Bis","to":"bis","Remove knockout":"KO-Runde entfernen","+ Add another knockout":"+ Weitere KO-Runde","Every place from {n} down":"Alle Plätze ab {1}","Everyone from {n} down":"Alle ab Platz {1}","Silver competition":"Silver-Turnier","everyone who doesn't make the {x} plays their own knockout":"wer nicht ins {1} kommt, spielt .":"Benenne eine Bahn wie auf deinem Gelände markiert oder schalte sie ab, wenn sie unbespielbar ist. Freie Bahnen gehen an wartende Spiele, sobald ein Ergebnis eintrifft.","Allocate pistes at random (otherwise lowest free piste first)":"Bahnen zufällig vergeben (sonst niedrigste freie Bahn zuerst)","Delete competition":"Turnier löschen","Removes the competition, its entries and every result.":"Entfernt das Turnier, seine Meldungen und alle Ergebnisse.","Delete “{x}” for everyone":"„{1}“ für alle löschen","Checked in on the day":"Am Turniertag eingecheckt","of {n} teams":"von {1} Teams","of {n} players":"von {1} Spielern","Check in everyone":"Alle einchecken","Clear check-ins":"Check-ins löschen","Only checked-in teams go into the draw, so the format and the number of games are worked out from who has actually turned up.":"Nur eingecheckte Teams kommen in die Auslosung – Format und Anzahl der Spiele richten sich danach, wer wirklich da ist.","Only checked-in players go into the draw, so the format and the number of games are worked out from who has actually turned up.":"Nur eingecheckte Spieler kommen in die Auslosung – Format und Anzahl der Spiele richten sich danach, wer wirklich da ist.","{n} not checked in yet.":"{1} noch nicht eingecheckt.","Check-in is off, so every entered team goes into the draw.":"Check-in ist aus, daher kommen alle gemeldeten Teams in die Auslosung.","Check-in is off, so every entered player goes into the draw.":"Check-in ist aus, daher kommen alle gemeldeten Spieler in die Auslosung.","Teams must check in on the day before they're included in the draw":"Teams müssen am Turniertag einchecken, um ausgelost zu werden","The draw has started. Anyone checked in now joins from the next round.":"Die Auslosung hat begonnen. Wer jetzt eincheckt, spielt ab der nächsten Runde.","The draw has started. New entries join from the next round.":"Die Auslosung hat begonnen. Neue Meldungen spielen ab der nächsten Runde.","The draw has been made, so new entri  9 m. Every shot scores 0, 1, 3 or 5, so a scorecard is out of 100.":"Schießer melden sich einzeln. Präzisionsschießen nach FIPJP-Regeln: 5 Ateliers (einzelne Kugel, Kugel hinter der Sau, Kugel zwischen zwei Kugeln, Kugel hinter Hindernis, die Sau), je ein Schuss aus 6, 7, 8 und 9 m. Jeder Schuss zählt 0, 1, 3 oder 5, maximal also 100 pro Bogen.","Qualifying → top 8 knockout":"Qualifikation → KO der besten 8","Qualifying → top 16 knockout":"Qualifikation → KO der besten 16","Qualifying → final":"Qualifikation → Finale","Shooters in the final":"Schießer im Finale","Everyone shoots a qualifying scorecard. The top shooters then shoot a final scorecard, and the highest final score wins.":"Alle schießen einen Qualifikationsbogen. Die Besten schießen dann einen Finalbogen, die höchste Finalsumme gewinnt.","Everyone shoots a qualifying scorecard. The top {n} go into a knockout (1st v {n}th, and so on). Each knockout game is a duel: both shooters shoot a full scorecard and the higher total goes through.":"Alle schießen einen Qualifikationsbogen. Die besten {1} kommen in eine KO-Runde (1. gg. {2}. usw.). Jedes KO-Spiel ist ein Duell: Beide schießen einen vollen Bogen, die höhere Summe kommt weiter.","Third-place duel":"Duell um Platz 3","Shooting order":"Schießreihenfolge","Entry order":"Meldereihenfolge","Archive competition":"Turnier archivieren","Archived":"Archiviert","Archive…":"Archivieren…","Archive":"Archivieren","Restore":"Wiederherstellen","Competition restored.":"Turnier wiederhergestellt.","Only the site admin can see this competition. Restore it to make it visible again.":"Nur der Site-Admin sieht dieses Turnier. Stelle es wieder her, um es sichtbar zu machen.","Once the competition has finished, archive it to hide it from everyone except the site admin.":"Ist das Turnier beendet, archiviere es, um es vor allen außer dem Site-Admin zu verbergen.","Once the competition has finished, archive it to hide it from everyone except the site admin. Some games aren't fini  {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice ({n} teams allow up to {n} rounds). With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"De teams staan in twee rijen. Elke ronde schuift één rij een plaats op: team {1} speelt tegen de vorige tegenstander van team {2}, team {3} tegen die van team {4}, enzovoort. Alle rondes worden in één keer geloot en niemand treft twee keer hetzelfde team ({5} teams geven maximaal {6} rondes). Bij een oneven aantal teams heeft elke ronde één team een vrijloting. Klassement zoals Zwitsers: overwinningen, puntensaldo, Buchholz, fijne Buchholz.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"De teams staan in twee rijen. Elke ronde schuift één rij een plaats op: team {1} speelt tegen de vorige tegenstander van team {2}, team {3} tegen die van team {4}, enzovoort. Alle rondes worden in één keer geloot en niemand treft twee keer hetzelfde team. Bij een oneven aantal teams heeft elke ronde één team een vrijloting. Klassement zoals Zwitsers: overwinningen, puntensaldo, Buchholz, fijne Buchholz.","Pool size":"Poulegrootte","Pool games":"Poulepartijen","French poule ({n} wins qualify)":"Franse poule ({1} zeges plaatsen zich)","French poules need {n} teams: game {n} is drawn, then winners play winners and losers play losers, and a barrage decides second place. Pools of other sizes play round robin.":"Franse poules hebben {1} teams nodig: partij {2} wordt geloot, daarna spelen winnaars tegen winnaars en verliezers tegen verliezers, en een barrage beslist over de .","Sign in with Google":"Inloggen met Google","Signed in as {x}":"Ingelogd als {1}","Competitions":"Toernooien","Test mode":"Testmodus","That setting didn't save.":"Die instelling is niet opgeslagen.","Admin":"Admin","Admin sign in":"Admin-login","Sign out":"Uitloggen","Signed out.":"Uitgelogd.","Signed in as admin.":"Ingelogd als admin.","Admin: {x}":"Admin: {1}","That Google account isn't an admin for this site.":"Dat Google-account is geen beheerder van deze site.","Sign-in didn't complete. Allow pop-ups for this site and try again.":"Inloggen is niet gelukt. Sta pop-ups toe voor deze site en probeer opnieuw.","That code didn't work. Check it with the organiser.":"Die code werkt niet. Controleer hem bij de organisator.","You're now an organiser for this competition.":"Je bent nu organisator van dit toernooi.","You can now enter scores for this competition.":"Je kunt nu scores invoeren voor dit toernooi.","Couldn't connect. Check your internet connection and reload.":"Geen verbinding. Controleer je internetverbinding en herlaad de pagina.","Firebase isn't set up yet, so this is saving on this device only.":"Firebase is nog niet ingesteld, dus er wordt alleen op dit apparaat opgeslagen.","Scorers open this once on their phone and can then enter scores and move games between pistes. Scorer code":"Scoretellers openen dit één keer op hun telefoon en kunnen dan scores invoeren en partijen tussen banen verplaatsen. Scoretellercode","Gives full control, including registration, setup, draws and scores. Keep it to your organising team, and keep a copy for yourself in case you change device. Organiser code":"Geeft volledige controle, inclusief inschrijving, instellingen, lotingen en scores. Alleen voor je organisatieteam – en bewaar zelf een kopie voor als je van apparaat wisselt. Organisatorcode","Last {n}":"Laatste {1}","Last 16":"Achtste finales","Last 32":"Zestiende finales","Last 64":"Tweeëndertigste finales"},
  "pt": {"Watch how it works":"Veja como funciona","A 2½-minute walk-through of a first competition":"Uma apresentação de 2 minutos e meio de um primeiro torneio","Guides":"Guias","Short videos that walk you through the competition desk, step by step.":"Vídeos curtos que o guiam passo a passo pela mesa do torneio.","Your first competition":"O seu primeiro torneio","Running a shooting competition":"Organizar um concurso de tiro","From a blank page to round 1 on the pistes: create a competition, add teams, check in, share the link, draw and enter scores.":"De uma página em branco à ronda 1 nas pistas: criar um torneio, adicionar equipas, registar chegadas, partilhar o link, sortear e registar resultados.","Tir de précision: qualifying scorecards with the live scorer, then a knockout to the final and the podium.":"Tir de précision: folhas de qualificação com o marcador ao vivo, depois uma eliminatória até à final e ao pódio.","New to the desk? Watch the 2-minute walk-through.":"É novo aqui? Veja a apresentação de 2 minutos.","Running a shooting day? Watch how it works (3 min).":"Vai organizar um concurso de tiro? Veja como funciona (3 min).","The videos are in English.":"Os vídeos estão em inglês.","{n} teams lost their first game and are ready to play.":"{1} equipas perderam o primeiro jogo e estão prontas para jogar.","Available once every team has played its first game.":"Disponível quando todas as equipas tiverem jogado o primeiro jogo.","Not enough teams lost their first game to make a consolante.":"Não há equipas suficientes que perderam o primeiro jogo para uma consolante.","At least 2 teams are needed for a knockout.":"São precisas pelo menos 2 equipas para uma eliminatória.","{n} teams → barrage sizes {x}":"{1} equipas → barragens de {2}","Round {n} · Cross-over":"Ronda {1} · Cruzamento","{n} cross-over game(s) this round (teams with different results).":"{1} jogo(s) cruzado(s) nesta ronda (equipas com resultados diferentes).","{n} cross-over game(s) this round (teams with different results). {n} rematch(es) were unavoidable this round.":"{1} jogo(s) cruzado(s) nesta ronda (equipas com resultados diferentes). {2} repetição(ões) inevitável(eis) nesta ronda.","In loving memory of Steve Noel":"Em memória de Steve Noel","SN Pétanque · In loving memory of Steve Noel":"SN Pétanque · Em memória de Steve Noel","Competition desk":"Mesa do torneio","+ New competition":"+ Novo torneio","New competition":"Novo torneio","Competition":"Torneio","Sections":"Secções","This device only":"Só neste dispositivo","Saved in this browser only":"Guardado só neste navegador","Registration":"Inscrições","Setup":"Configuração","Draw & results":"Sorteio e resultados","Pistes":"Pistas","Standings":"Classificação","Big screen":"Ecrã grande","Loading competitions…":"A carregar torneios…","No competitions yet":"Ainda sem torneios","Set up a competition, add teams or players, then draw rounds, pools or a knockout. Pistes are allocated as games finish and scores go live for everyone with the link.":"Crie um torneio, adicione equipas ou jogadores e sorteie rondas, grupos ou um quadro eliminatório. As pistas são atribuídas à medida que os jogos terminam e os resultados aparecem em direto para quem tiver o link.","Create a competition":"Criar um torneio","The organiser hasn't created a competition yet.":"O organizador ainda não criou um torneio.","This is an example competition with made-up teams, so you can see how everything works. Create your own from the menu above, then delete this one in Setup.":"Este é um torneio de exemplo com equipas fictícias, para ver como tudo funciona. Crie o seu no menu acima e depois apague este em Configuração.","Close":"Fechar","Delete":"Apagar","Delete…":"Apagar…","Keep it":"Manter","Remove":"Remover","Add":"Adicionar","Copy":"Copiar","Join":"Entrar","Singles":"Individual","Doubles":"Duplas","Triples":"Triplas","Singles (tête-à-tête)":"Individual (tête-à-tête)","Fixed teams":"Equipas fixas","Mêlée (random teams)":"Mêlée (equipas sorteadas)","Mêlée":"Mêlée","Mêlée rounds":"Rondas mêlée","Swiss":"Suíço","Swiss rounds":"Rondas sistema suíço","Snake":"Serpentina","Snake rounds":"Rondas serpentina","Pools → KO":"Grupos → KO","Pools → knockout":"Grupos → eliminatórias","Knockout":"Eliminatória","Round robin":"Todos contra todos","Round robin schedule":"Calendário todos contra todos","Pools":"Grupos","Competition name":"Nome do torneio","Date":"Data","Venue":"Local","Club or boulodrome":"Clube ou boulodrome","Format locked after the first draw":"Formato bloqueado após o primeiro sorteio","Entries":"Inscritos","Entry type":"Tipo de inscrição","Format":"Formato","Players enter individually. Each round draws new random teams, mixing doubles and triples when numbers don't divide evenly, and avoids repeat partners where it can. Players are ranked individually.":"Os jogadores inscrevem-se individualmente. Cada ronda sorteia novas equipas, misturando duplas e triplas quando os números não dão certo, e evita repetir parceiros sempre que possível. A classificação é individual.","Points to win":"Pontos para ganhar","Bye counts as":"Isenção conta como","Competition system":"Sistema de jogo","Mêlée competitions play a set number of rounds.":"Os torneios mêlée jogam um número fixo de rondas.","Planned rounds":"Rondas previstas","Rounds":"Rondas","Round {n} is random. After that, teams on the same number of wins play each other and rematches are avoided. Ties are split by points difference, then Buchholz (opponents' wins).":"A ronda {1} é sorteada. Depois, as equipas com o mesmo número de vitórias jogam entre si, sem repetir adversários. Os empates decidem-se pela diferença de pontos e depois pelo Buchholz (vitórias dos adversários).","Rounds are drawn one at a time once the previous round is finished.":"As rondas são sorteadas uma a uma, quando a anterior termina.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice ({n} teams allow up to {n} rounds). With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"As equipas formam duas filas. Em cada ronda uma fila avança um lugar: a equipa {1} joga com quem a equipa {2} acabou de defrontar, a equipa {3} com quem a equipa {4} defrontou, e assim por diante. Todas as rondas são sorteadas de uma vez e ninguém defronta a mesma equipa duas vezes ({5} equipas permitem até {6} rondas). Com número ímpar de equipas, uma fica isenta em cada ronda. Classificação como no suíço: vitórias, diferença de pontos, Buchholz, Buchholz fino.","Teams stand in two lines. Each round one line moves along a place, so team {n} plays whoever team {n} just played, team {n} whoever team {n} just played, and so on. All rounds are drawn at once and nobody meets the same team twice. With an odd number of teams, one team sits out each round and scores a bye. Ranked like Swiss: wins, points difference, Buchholz, fine Buchholz.":"As equipas formam duas filas. Em cada ronda uma fila avança um lugar: a equipa {1} joga com quem a equipa {2} acabou de defrontar, a equipa {3} com quem a equipa {4} defrontou, e assim por diante. Todas as rondas são sorteadas de uma vez e ninguém defronta a mesma equipa duas vezes. Com número ímpar de equipas, uma fica isenta em cada ronda. Classificação como no suíço: vitórias, diferença de pontos, Buchholz, Buchholz fino.","Pool size":"Tamanho dos grupos","Pool games":"Jogos de grupo","French poule ({n} wins qualify)":"Poule à francesa ({1} vitórias apuram)","French poules need {n} teams: game {n} is drawn, then winners play winners and losers play losers, and a barrage decides second place. Pools of other sizes play round robin.":"As poules à francesa precisam de {1} equipas: o jogo {2} é sorteado, depois vencedores contra vencedores e vencidos contra vencidos, e uma barragem decide o segundo lugar. Grupos de outros tamanhos jogam todos contra todos.","First-round losers play a consolante":"Os vencidos da 1.ª ronda jogam uma consolação","Third-place play-off":"Jogo do 3.º lugar","Seeding":"Cabeças de série","Random draw":"Sorteio aleatório","Entry order is seeding":"A ordem de inscrição define os cabeças de série","Afternoon knockouts":"Eliminatórias da tarde","Afternoon":"Tarde","Knockouts":"Eliminatórias","What happens after the Swiss rounds. You can change this any time before the knockouts are drawn.":"O que acontece após as rondas do sistema suíço. Pode alterar até ao sorteio das eliminatórias.","What happens after the pools. You can change this any time before the knockouts are drawn.":"O que acontece após os grupos. Pode alterar até ao sorteio das eliminatórias.","What happens after the round robin. You can change this any time before the knockouts are drawn.":"O que acontece após o todos contra todos. Pode alterar até ao sorteio das eliminatórias.","What happens after the snake rounds. You can change this any time before the knockouts are drawn.":"O que acontece após as rondas serpentina. Pode alterar até ao sorteio das eliminatórias.","Quick set-ups":"Configurações rápidas","Draw for the knockouts":"Sorteio das eliminatórias","Seeded by standings ({n} v {n}, {n} v {n}…)":"Pela classificação ({1} vs {2}, {3} vs {4}…)","Seeded (pool winners kept apart)":"Cabeças de série (vencedores de grupo separados)","Random draw (tirage au sort)":"Sorteio aleatório integral","Knockout name":"Nome do quadro","Ranks":"Lugares","Pool places":"Lugares no grupo","3rd-place game":"Jogo do 3.º lugar","From":"De","To":"Até","to":"a","Remove knockout":"Remover quadro","+ Add another knockout":"+ Adicionar outro quadro","Every place from {n} down":"Todos os lugares a partir do {1}.º","Everyone from {n} down":"Todos a partir do {1}.º","Silver competition":"Torneio Silver","everyone who doesn't make the {x} plays their own knockout":"quem não entrar no {1} joga o seu próprio quadro","starts at final":"começa na final","starts at semi-finals":"começa nas meias-finais","starts at quarter-finals":"começa nos quartos de final","starts at last {n}":"começa na ronda dos {1}","Pick which finishing places in each pool go into each knockout, e.g. {n}st–{n}nd into the A, {n}rd–{n}th into the B.":"Escolha que lugares de cada grupo vão para cada quadro, p. ex. 1.º–2.º para o A, 3.º–4.º para o B.","Pick which overall ranks go into each knockout. Numbers that aren't a power of two get byes for the top seeds, so top {n} gives seeds {n} and {n} a bye into the semi-finals.":"Escolha que lugares da classificação vão para cada quadro. Se o número não for potência de dois, os melhores cabeças de série ficam isentos: com os {1} primeiros, os cabeças de série {2} e {3} passam diretamente às meias-finais.","not enough teams":"equipas insuficientes","{n} teams · starts at final":"{1} equipas · começa na final","{n} teams · starts at semi-finals":"{1} equipas · começa nas meias-finais","{n} teams · starts at quarter-finals":"{1} equipas · começa nos quartos de final","{n} teams · starts at last {n}":"{1} equipas · começa na ronda dos {2}","{n} byes for the top seeds":"{1} isenções para os cabeças de série","{n} bye for the top seed":"{1} isenção para o cabeça de série","Final (top {n})":"Final ({1} primeiros)","Semi-finals (top {n})":"Meias-finais ({1} primeiros)","Quarter-finals (top {n})":"Quartos de final ({1} primeiros)","Top {n} + Plate ({n}–{n})":"{1} primeiros + Plate ({2}–{3})","Top {n}":"{1} primeiros","Everyone → one knockout":"Todos → um quadro","{n}st & {n}nd → A, rest → B":"1.º e 2.º → A, resto → B","{n}st → A, {n}nd → B, rest → C":"1.º → A, 2.º → B, resto → C","{n}st & {n}nd → A only":"1.º e 2.º → só A","Number of pistes":"Número de pistas","Piste name":"Nome da pista","In use":"Em uso","Rename a piste to match the markings on your terrain, or switch it off if it's unusable. Free pistes are given to waiting games as soon as a result comes in.":"Mude o nome da pista para coincidir com as marcações do terreno, ou desative-a se não puder ser usada. As pistas livres são dadas aos jogos em espera assim que chega um resultado.","Allocate pistes at random (otherwise lowest free piste first)":"Atribuir pistas ao acaso (senão a primeira pista livre)","Delete competition":"Apagar torneio","Removes the competition, its entries and every result.":"Remove o torneio, as inscrições e todos os resultados.","Delete “{x}” for everyone":"Apagar “{1}” para todos","Checked in on the day":"Presença confirmada no dia","of {n} teams":"de {1} equipas","of {n} players":"de {1} jogadores","Check in everyone":"Confirmar todos","Clear check-ins":"Limpar presenças","Only checked-in teams go into the draw, so the format and the number of games are worked out from who has actually turned up.":"Só as equipas presentes entram no sorteio, por isso o formato e o número de jogos dependem de quem realmente apareceu.","Only checked-in players go into the draw, so the format and the number of games are worked out from who has actually turned up.":"Só os jogadores presentes entram no sorteio, por isso o formato e o número de jogos dependem de quem realmente apareceu.","{n} not checked in yet.":"{1} ainda sem presença.","Check-in is off, so every entered team goes into the draw.":"Controlo de presenças desligado: todas as equipas inscritas entram no sorteio.","Check-in is off, so every entered player goes into the draw.":"Controlo de presenças desligado: todos os jogadores inscritos entram no sorteio.","Teams must check in on the day before they're included in the draw":"As equipas têm de confirmar presença no dia para entrar no sorteio","The draw has started. Anyone checked in now joins from the next round.":"O sorteio já começou. Quem confirmar agora entra na próxima ronda.","The draw has started. New entries join from the next round.":"O sorteio já começou. Novas inscrições entram na próxima ronda.","The draw
